    en: "Document in which a supplier publishes the prices and parameters of a product; it is the binding reference for checking the amounts shown on an invoice."
    de: "Dokument, mit dem ein Lieferant die Preise und Parameter eines Produkts veröffentlicht; es ist die verbindliche Referenz zur Prüfung der Rechnungsbeträge."
