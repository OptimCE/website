# ==================================================================
# OptimCE — Glossaire / Glossary / Glossar / Woordenlijst
# ------------------------------------------------------------------
# Single multilingual source of truth for the glossary page.
# Shared metadata (slug, categorie, tags, source) is defined once;
# `terme`, `definition` and `alias` are nested per locale (fr/en/de/nl).
#
# - `categorie` and `tags` are lowercase, accent-free slugs.
# - `categorie` drives the filter pills (labels: i18n glossary.categories).
# - `tags` only enrich the client-side search index.
# - Authored in French alphabetical order (no-JS fallback); the page
#   re-sorts alphabetically per language at runtime.
#
# NOTE: EN/DE/NL are draft translations and should be reviewed by a
# native/domain speaker before publishing (esp. NL/DE Belgian terms).
# ==================================================================

- slug: accises
  categorie: facturation
  tags: [fiscalite, facture, belgique]
  source_nom: CREG
  source_url: "https://www.creg.be/fr/consommateurs/le-marche-de-lenergie/comment-est-compose-le-prix-de-lenergie"
  terme:
    fr: "Accises"
    en: "Excise duties"
    de: "Akzisen"
    nl: "Accijnzen"
  definition:
    fr: "Droits d'accise dus sur l'électricité ; sur les kWh partagés, ils figurent sur la facture émise par le représentant du partage."
    en: "Excise duties due on electricity; on shared kWh, they appear on the invoice issued by the sharing representative."
    de: "Auf Strom geschuldete Akzisen; auf den geteilten kWh erscheinen sie auf der vom Vertreter der Energieteilung ausgestellten Rechnung."
    nl: "Op elektriciteit verschuldigde accijnzen; op de gedeelde kWh verschijnen ze op de door de vertegenwoordiger van het energiedelen uitgereikte factuur."
  alias:
    fr: ["droit d'accise", "droits d'accise"]
    en: ["excise duty", "excise"]
    de: ["Akzise", "Verbrauchsteuer"]
    nl: ["accijns"]

- slug: amr
  categorie: mesure
  tags: [compteur, releve, data]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6078"
  terme:
    fr: "AMR"
    en: "AMR"
    de: "AMR"
    nl: "AMR"
  definition:
    fr: "Automatic Meter Reading : compteur à télérelevé quart-horaire, généralement posé sur les raccordements de plus forte puissance. La CWaPE l'admet au même titre que le compteur communicant pour participer à un partage d'énergie."
    en: "Automatic Meter Reading: a remotely read meter recording quarter-hourly values, usually fitted on higher-capacity connections. CWaPE accepts it on the same footing as a communicating meter for taking part in energy sharing."
    de: "Automatic Meter Reading: fernausgelesener Zähler mit viertelstündlicher Erfassung, meist an Anschlüssen höherer Leistung. Die CWaPE lässt ihn für die Teilnahme am Energieteilen ebenso zu wie den Kommunikationszähler."
    nl: "Automatic Meter Reading: op afstand uitgelezen meter met kwartierregistratie, meestal op aansluitingen met hoger vermogen. De CWaPE aanvaardt hem voor deelname aan energiedelen op dezelfde voet als de digitale meter."
  alias:
    fr: ["compteur AMR", "télérelevé"]
    en: ["AMR meter", "automatic meter reading"]
    de: ["AMR-Zähler", "Fernauslesung"]
    nl: ["AMR-meter", "telelezing"]

- slug: asbl
  categorie: juridique
  tags: [belgique, association, gouvernance]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/communautes-denergie"
  terme:
    fr: "ASBL"
    en: "ASBL"
    de: "ASBL"
    nl: "vzw"
  definition:
    fr: "Association sans but lucratif, forme juridique fréquente pour des projets d'énergie partagée."
    en: "Non-profit association (Belgian 'ASBL'), a common legal form for shared-energy projects."
    de: "Vereinigung ohne Erwerbszweck (belgische 'ASBL'), eine häufige Rechtsform für Energieteilungsprojekte."
    nl: "Vereniging zonder winstoogmerk (vzw), een veelgebruikte rechtsvorm voor energiedelingsprojecten."
  alias:
    fr: ["association sans but lucratif"]
    en: ["non-profit association"]
    de: ["Vereinigung ohne Erwerbszweck"]
    nl: ["vereniging zonder winstoogmerk", "ASBL"]

- slug: association-des-coproprietaires
  categorie: juridique
  tags: [copropriete, gouvernance, belgique, immeuble]
  source_nom: IPI
  source_url: "https://www.ipi.be/media/1462/download?inline=1"
  terme:
    fr: "Association des copropriétaires"
    en: "Association of co-owners"
    de: "Vereinigung der Miteigentümer"
    nl: "Vereniging van mede-eigenaars"
  definition:
    fr: "Personne morale qui réunit de plein droit tous les copropriétaires d'un immeuble et en assure la conservation et l'administration. Son patrimoine se limite aux meubles nécessaires à cet objet (art. 3.86, § 3, du Code civil) : elle ne peut donc pas être propriétaire de l'installation photovoltaïque qui alimente un partage d'énergie."
    en: "Legal person automatically grouping all the co-owners of a building, responsible for preserving and administering it. Its assets are limited to the movable property needed for that purpose (art. 3.86, § 3, of the Civil Code), so it cannot own the photovoltaic installation that feeds an energy sharing operation."
    de: "Rechtsperson, die von Rechts wegen alle Miteigentümer eines Gebäudes vereint und dessen Erhaltung und Verwaltung sicherstellt. Ihr Vermögen beschränkt sich auf die dafür erforderlichen beweglichen Güter (Art. 3.86, § 3, des Zivilgesetzbuches); sie kann daher nicht Eigentümerin der Photovoltaikanlage sein, die eine Energieteilung speist."
    nl: "Rechtspersoon die van rechtswege alle mede-eigenaars van een gebouw verenigt en instaat voor het behoud en het beheer ervan. Haar vermogen blijft beperkt tot de daarvoor noodzakelijke roerende goederen (art. 3.86, § 3, van het Burgerlijk Wetboek); zij kan dus geen eigenaar zijn van de fotovoltaïsche installatie die een deelactiviteit voedt."
  alias:
    fr: ["ACP", "association de copropriétaires"]
    en: ["ACP", "co-owners' association"]
    de: ["ACP", "Miteigentümergemeinschaft"]
    nl: ["VME", "vereniging van medeeigenaars"]

- slug: audit-logement
  categorie: reglementaire
  tags: [audit, prime, renovation, wallonie]
  source_nom: "SPW Logement"
  source_url: "https://logement.wallonie.be/fr/aide/primes-habitation-2025"
  terme:
    fr: "Audit logement"
    en: "Housing audit"
    de: "Wohnungsaudit"
    nl: "Woningaudit"
  definition:
    fr: "Diagnostic réalisé par un auditeur agréé qui établit un rapport et un ordre de priorité des travaux. En Wallonie, il conditionne la quasi-totalité des primes Habitation — seules les interventions sur la toiture en sont dispensées — et les droits qu'il ouvre restent acquis huit ans."
    en: "An assessment carried out by an approved auditor who produces a report and a prioritised list of works. In Wallonia it is a precondition for almost every Habitation grant — only roof interventions are exempt — and the entitlements it opens remain valid for eight years."
    de: "Von einem zugelassenen Auditor erstellte Bestandsaufnahme mit Bericht und Rangfolge der Arbeiten. In Wallonien ist sie Voraussetzung für nahezu jede Wohnungsprämie — nur Eingriffe am Dach sind davon befreit — und die damit eröffneten Ansprüche bleiben acht Jahre bestehen."
    nl: "Doorlichting door een erkende auditor die een verslag en een volgorde van de werken opstelt. In Wallonië is die voorwaarde voor nagenoeg elke woonpremie — alleen ingrepen aan het dak zijn vrijgesteld — en de rechten die ze opent, blijven acht jaar geldig."
  alias:
    fr: ["audit énergétique"]
    en: ["energy audit"]
    de: ["Energieaudit"]
    nl: ["energieaudit"]

- slug: autoconsommation
  categorie: autoconsommation
  tags: [production, consommation, local]
  source_nom: "Ministère de la Transition écologique"
  source_url: "https://www.ecologie.gouv.fr/politiques-publiques/systemes-dautoconsommation"
  terme:
    fr: "Autoconsommation"
    en: "Self-consumption"
    de: "Eigenverbrauch"
    nl: "Zelfverbruik"
  definition:
    fr: "Fait de consommer sa propre production d'électricité au lieu de l'injecter sur le réseau. C'est le poste le plus rentable d'une installation, puisque le kWh autoconsommé évite l'achat au prix de détail complet."
    en: "Consuming your own electricity generation instead of feeding it into the grid. It is the most profitable use of an installation, since a self-consumed kWh avoids buying one at the full retail price."
    de: "Der Verbrauch des selbst erzeugten Stroms, statt ihn ins Netz einzuspeisen. Das ist der rentabelste Posten einer Anlage, denn eine selbst verbrauchte kWh erspart den Einkauf zum vollen Endkundenpreis."
    nl: "Het verbruiken van je eigen elektriciteitsproductie in plaats van ze op het net te injecteren. Dat is de rendabelste post van een installatie: een zelf verbruikte kWh vermijdt aankoop tegen de volle detailhandelsprijs."
  alias:
    fr: []
    en: ["self consumption"]
    de: []
    nl: []

- slug: autoconsommation-collective
  categorie: autoconsommation
  tags: [collectif, partage, batiment]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/documents/download/2979"
  terme:
    fr: "Autoconsommation collective"
    en: "Collective self-consumption"
    de: "Kollektiver Eigenverbrauch"
    nl: "Collectief zelfverbruik"
  definition:
    fr: "Autoconsommation réalisée à plusieurs, au sein d'un même bâtiment ou d'un périmètre défini. Elle relève d'un cadre réglementaire distinct de l'autoconsommation individuelle et suppose une clé de répartition entre participants."
    en: "Self-consumption carried out by several parties, within one building or a defined perimeter. It falls under a regulatory framework distinct from individual self-consumption and requires an allocation key between participants."
    de: "Eigenverbrauch durch mehrere Beteiligte, innerhalb eines Gebäudes oder eines definierten Umkreises. Er unterliegt einem eigenen Regelwerk und setzt einen Aufteilungsschlüssel zwischen den Teilnehmern voraus."
    nl: "Zelfverbruik met meerdere partijen, binnen één gebouw of een afgebakende perimeter. Het valt onder een eigen regelgevend kader en vereist een verdeelsleutel tussen de deelnemers."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: autorisation
  categorie: reglementaire
  tags: [conformite, regulateur, belgique]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/secteur/communautes-partage-energie"
  terme:
    fr: "Autorisation"
    en: "Authorisation"
    de: "Genehmigung"
    nl: "Toelating"
  definition:
    fr: "Accord préalable du régulateur requis lorsqu'une communauté sort du cadre standard, notamment pour une clé de répartition qui n'appartient pas aux familles reconnues dans sa région."
    en: "Prior approval from the regulator, required when a community steps outside the standard framework — in particular for an allocation key that does not belong to the families recognised in its region."
    de: "Vorherige Genehmigung des Regulators, erforderlich wenn eine Gemeinschaft den Standardrahmen verlässt — insbesondere für einen Aufteilungsschlüssel außerhalb der in ihrer Region anerkannten Familien."
    nl: "Voorafgaande goedkeuring van de regulator, vereist wanneer een gemeenschap buiten het standaardkader treedt — met name voor een verdeelsleutel die niet tot de in haar gewest erkende families behoort."
  alias:
    fr: []
    en: ["authorization"]
    de: []
    nl: []

- slug: borne-de-recharge
  categorie: technique
  tags: [vehicule, recharge, flexibilite]
  source_nom: OptimCE
  source_ref: about
  terme:
    fr: "Borne de recharge"
    en: "Charge point"
    de: "Ladestation"
    nl: "Laadpaal"
  definition:
    fr: "Point de recharge fixe pour véhicule électrique, raccordé à l'installation du logement. Les modèles pilotables modulent leur puissance en continu pour suivre la production photovoltaïque ; en monophasé, la modulation s'arrête sous 6 ampères, soit environ 1,4 kW."
    en: "A fixed charging point for an electric vehicle, wired into the dwelling's installation. Controllable models modulate their power continuously to follow solar generation; in single phase, modulation stops below 6 amps, roughly 1.4 kW."
    de: "Fester Ladepunkt für ein Elektrofahrzeug, an die Hausinstallation angeschlossen. Steuerbare Modelle modulieren ihre Leistung stufenlos, um der Solarerzeugung zu folgen; einphasig endet die Modulation unter 6 Ampere, also rund 1,4 kW."
    nl: "Vast laadpunt voor een elektrisch voertuig, aangesloten op de installatie van de woning. Stuurbare modellen moduleren hun vermogen doorlopend om de zonneproductie te volgen; in eenfasig stopt de modulatie onder 6 ampère, ongeveer 1,4 kW."
  alias:
    fr: ["wallbox", "point de recharge"]
    en: ["wallbox", "charging point"]
    de: ["Wallbox", "Ladepunkt"]
    nl: ["wallbox", "laadpunt"]

- slug: brugel
  categorie: regulateur
  tags: [bruxelles, regulation, belgique]
  source_nom: BRUGEL
  source_url: "https://brugel.brussels/"
  terme:
    fr: "BRUGEL"
    en: "BRUGEL"
    de: "BRUGEL"
    nl: "BRUGEL"
  definition:
    fr: "Régulateur bruxellois des marchés de l'électricité et du gaz. Il définit les méthodes de répartition admises en Région de Bruxelles-Capitale et supervise les communautés d'énergie qui y opèrent."
    en: "The Brussels regulator for the electricity and gas markets. It defines the allocation methods permitted in the Brussels-Capital Region and supervises the energy communities operating there."
    de: "Brüsseler Regulierungsbehörde für die Strom- und Gasmärkte. Sie legt die in der Region Brüssel-Hauptstadt zulässigen Aufteilungsmethoden fest und beaufsichtigt die dort tätigen Energiegemeinschaften."
    nl: "De Brusselse regulator voor de elektriciteits- en gasmarkt. Hij bepaalt welke verdeelmethodes in het Brussels Hoofdstedelijk Gewest zijn toegelaten en houdt toezicht op de energiegemeenschappen die er actief zijn."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: ce
  categorie: modele
  tags: [communaute, abreviation, generique]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/secteur/communautes-partage-energie"
  terme:
    fr: "CE"
    en: "CE"
    de: "CE"
    nl: "CE"
  definition:
    fr: "Abréviation générique de communauté d'énergie, qui recouvre les différents statuts juridiques existants — CER, CEC ou CEL selon la directive européenne d'origine et la région belge concernée."
    en: "Generic abbreviation for energy community, covering the different legal statuses that exist — REC, CEC or LEC, depending on the originating European directive and the Belgian region concerned."
    de: "Allgemeine Abkürzung für Energiegemeinschaft; sie umfasst die verschiedenen bestehenden Rechtsformen — EEG, BEG oder LEG, je nach zugrunde liegender europäischer Richtlinie und betroffener belgischer Region."
    nl: "Algemene afkorting voor energiegemeenschap, die de verschillende bestaande rechtsvormen dekt — HEG, BEG of LEG, naargelang de onderliggende Europese richtlijn en het betrokken Belgische gewest."
  alias:
    fr: ["communauté d'énergie"]
    en: ["energy community"]
    de: ["Energiegemeinschaft"]
    nl: ["energiegemeenschap"]

- slug: cec
  categorie: modele
  tags: [communaute, citoyenne, belgique]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/communautes-denergie"
  terme:
    fr: "CEC"
    en: "CEC"
    de: "CEC"
    nl: "CEC"
  definition:
    fr: "Communauté d'énergie citoyenne, au sens de la directive européenne sur le marché intérieur de l'électricité. Neutre sur le plan technologique mais limitée à l'électricité, elle n'impose aucun critère de proximité géographique."
    en: "Citizen energy community, as defined by the European internal electricity market directive. Technology-neutral but limited to electricity, it imposes no geographic proximity requirement on its members."
    de: "Bürgerenergiegemeinschaft im Sinne der europäischen Strombinnenmarktrichtlinie. Technologieneutral, aber auf Strom beschränkt — ein geografisches Näheerfordernis besteht für ihre Mitglieder nicht."
    nl: "Burgerenergiegemeenschap in de zin van de Europese elektriciteitsmarktrichtlijn. Technologieneutraal maar beperkt tot elektriciteit, en zonder geografisch nabijheidsvereiste voor haar leden."
  alias:
    fr: ["communauté d'énergie citoyenne"]
    en: ["citizen energy community"]
    de: ["Bürgerenergiegemeinschaft"]
    nl: ["burgerenergiegemeenschap"]

- slug: cel
  categorie: modele
  tags: [communaute, locale, bruxelles]
  source_nom: "Bruxelles Environnement"
  source_url: "https://environnement.brussels/media/12676/download?inline"
  terme:
    fr: "CEL"
    en: "CEL"
    de: "CEL"
    nl: "CEL"
  definition:
    fr: "Communauté d'énergie locale, statut propre au cadre bruxellois. Elle permet le partage d'électricité entre participants situés dans un périmètre local défini par la réglementation régionale, sous le contrôle de BRUGEL."
    en: "Local energy community, a status specific to the Brussels framework. It allows electricity sharing between participants inside a local perimeter set by regional rules, under BRUGEL's supervision."
    de: "Lokale Energiegemeinschaft, ein Status des Brüsseler Rahmens. Sie erlaubt die Stromteilung zwischen Teilnehmern innerhalb eines regional festgelegten lokalen Umkreises, unter Aufsicht von BRUGEL."
    nl: "Lokale energiegemeenschap, een statuut eigen aan het Brusselse kader. Ze laat elektriciteitsdeling toe tussen deelnemers binnen een gewestelijk bepaalde lokale perimeter, onder toezicht van BRUGEL."
  alias:
    fr: ["communauté d'énergie locale"]
    en: ["local energy community"]
    de: ["lokale Energiegemeinschaft"]
    nl: ["lokale energiegemeenschap"]

- slug: cer
  categorie: modele
  tags: [communaute, renouvelable, belgique]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/communautes-denergie"
  terme:
    fr: "CER"
    en: "CER"
    de: "CER"
    nl: "CER"
  definition:
    fr: "Communauté d'énergie renouvelable, au sens de la directive européenne RED II. Elle ne porte que sur l'énergie renouvelable et ses membres doivent se situer à proximité des installations de production détenues par la communauté."
    en: "Renewable energy community, as defined by the European RED II directive. It covers renewable energy only, and its members must be located in proximity to the generation assets the community owns."
    de: "Erneuerbare-Energien-Gemeinschaft im Sinne der europäischen Richtlinie RED II. Sie betrifft ausschließlich erneuerbare Energie, und ihre Mitglieder müssen sich in der Nähe der gemeinschaftseigenen Erzeugungsanlagen befinden."
    nl: "Hernieuwbare-energiegemeenschap in de zin van de Europese richtlijn RED II. Ze betreft uitsluitend hernieuwbare energie en haar leden moeten zich in de nabijheid van de eigen productie-installaties bevinden."
  alias:
    fr: ["communauté d'énergie renouvelable"]
    en: ["renewable energy community", "REC"]
    de: ["Erneuerbare-Energie-Gemeinschaft"]
    nl: ["hernieuwbare-energiegemeenschap"]

- slug: certificat-vert
  categorie: facturation
  tags: [soutien, production, obligation]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6063"
  terme:
    fr: "Certificat vert"
    en: "Green certificate"
    de: "Grünes Zertifikat"
    nl: "Groenestroomcertificaat"
  definition:
    fr: "Mécanisme de soutien à l'électricité renouvelable ; sur l'énergie partagée, l'obligation de restitution des quotas (OSP) est répercutée sur la facture du représentant du partage."
    en: "Support mechanism for renewable electricity; on shared energy, the obligation to surrender quotas (PSO) is passed on to the sharing representative's invoice."
    de: "Fördermechanismus für erneuerbaren Strom; bei geteilter Energie wird die Verpflichtung zur Rückgabe der Quoten (ÖDV) auf die Rechnung des Vertreters der Energieteilung weitergegeben."
    nl: "Steunmechanisme voor hernieuwbare elektriciteit; bij gedeelde energie wordt de verplichting tot inlevering van de quota (ODV) doorgerekend op de factuur van de vertegenwoordiger van het energiedelen."
  alias:
    fr: ["certificats verts", "OSP certificats verts", "quotas de certificats verts"]
    en: ["green certificates", "green-certificate quota"]
    de: ["grüne Zertifikate", "Quoten grüner Zertifikate"]
    nl: ["groenestroomcertificaten", "quota groenestroomcertificaten"]

- slug: chauffe-eau-thermodynamique
  categorie: technique
  tags: [eau-chaude, pompe-a-chaleur, autoconsommation]
  source_nom: SPW Logement
  source_url: "https://logement.wallonie.be/fr/aide/primes-habitation-2025"
  terme:
    fr: "Chauffe-eau thermodynamique"
    en: "Heat-pump water heater"
    de: "Wärmepumpenboiler"
    nl: "Warmtepompboiler"
  definition:
    fr: "Ballon d'eau chaude sanitaire équipé d'une pompe à chaleur, dont le coefficient de performance se situe entre 2,5 et 3,5. À besoin d'eau chaude égal, il consomme environ trois fois moins d'électricité qu'un ballon résistif — et absorbe donc environ trois fois moins de surplus photovoltaïque."
    en: "A domestic hot-water tank fitted with a heat pump, with a coefficient of performance between 2.5 and 3.5. For the same hot-water need it consumes about three times less electricity than a resistive tank — and therefore absorbs about three times less solar surplus."
    de: "Warmwasserspeicher mit Wärmepumpe, dessen Leistungszahl zwischen 2,5 und 3,5 liegt. Bei gleichem Warmwasserbedarf verbraucht er rund dreimal weniger Strom als ein Widerstandsboiler — und nimmt damit rund dreimal weniger Solarüberschuss auf."
    nl: "Boiler voor sanitair warm water met een warmtepomp, met een prestatiecoëfficiënt tussen 2,5 en 3,5. Bij gelijke warmwaterbehoefte verbruikt hij ongeveer drie keer minder elektriciteit dan een weerstandsboiler — en neemt hij dus ongeveer drie keer minder zonne-overschot op."
  alias:
    fr: ["boiler thermodynamique", "ballon thermodynamique"]
    en: ["heat pump water heater", "thermodynamic water heater"]
    de: ["Warmwasser-Wärmepumpe", "Brauchwasserwärmepumpe"]
    nl: ["boiler op warmtepomp", "thermodynamische boiler"]

- slug: circuit-court-energetique
  categorie: territoire
  tags: [local, proximite, partage]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/5618"
  terme:
    fr: "Circuit court énergétique"
    en: "Energy short circuit"
    de: "Kurzer Weg beim Strom"
    nl: "Korte keten voor stroom"
  definition:
    fr: "Chaîne de fourniture d'électricité réduite au minimum d'intermédiaires commerciaux entre un producteur local et ses consommateurs. Contrairement au circuit court alimentaire, défini par l'administration wallonne comme n'admettant au maximum qu'un intermédiaire, il ne supprime jamais le gestionnaire de réseau, dont les frais restent dus : il raccourcit la composante énergie de la facture, pas le trajet physique du courant."
    en: "An electricity supply chain reduced to the minimum of commercial intermediaries between a local producer and its consumers. Unlike the food short supply chain, defined by the Walloon administration as allowing at most one intermediary, it never removes the network operator, whose charges remain payable: it shortens the energy component of the bill, not the physical path of the current."
    de: "Stromlieferkette, die auf ein Minimum an kommerziellen Zwischenhändlern zwischen einem lokalen Erzeuger und seinen Verbrauchern verkürzt ist. Anders als der kurze Weg bei Lebensmitteln, den die wallonische Verwaltung mit höchstens einem Zwischenhändler definiert, entfällt der Netzbetreiber nie, dessen Kosten geschuldet bleiben: Verkürzt wird die Energiekomponente der Rechnung, nicht der physische Weg des Stroms."
    nl: "Elektriciteitsketen die is teruggebracht tot een minimum aan commerciële tussenschakels tussen een lokale producent en zijn afnemers. Anders dan de korte keten voor voeding, die de Waalse administratie omschrijft als hoogstens één tussenschakel, verdwijnt de netbeheerder nooit, wiens kosten verschuldigd blijven: verkort wordt de energiecomponent van de factuur, niet het fysieke traject van de stroom."
  alias:
    fr: ["circuit court de l'énergie", "circuit court électrique", "circuit court"]
    en: ["short supply chain for electricity", "short circuit"]
    de: ["kurze Wege beim Strom", "kurzer Weg"]
    nl: ["korte keten voor elektriciteit", "korte keten"]

- slug: clef-de-repartition
  categorie: calcul
  tags: [partage, gouvernance, repartition]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6092"
  terme:
    fr: "Clef de répartition"
    en: "Allocation key"
    de: "Aufteilungsschlüssel"
    nl: "Verdeelsleutel"
  definition:
    fr: "Règle qui détermine comment l'énergie partagée est répartie entre participants, appliquée au quart d'heure sur les relevés réels. Chaque région belge reconnaît ses propres familles de clés standards."
    en: "The rule determining how shared energy is split between participants, applied quarter-hour by quarter-hour to actual meter readings. Each Belgian region recognises its own families of standard keys."
    de: "Regel, die festlegt, wie die geteilte Energie unter den Teilnehmern aufgeteilt wird — viertelstundengenau auf Basis der realen Messwerte. Jede belgische Region erkennt eigene Familien von Standardschlüsseln an."
    nl: "Regel die bepaalt hoe de gedeelde energie onder de deelnemers wordt verdeeld, kwartier per kwartier toegepast op de echte meterstanden. Elk Belgisch gewest erkent zijn eigen families van standaardsleutels."
  alias:
    fr: ["clé de répartition", "clef de repartition"]
    en: ["repartition key", "distribution key"]
    # Canonical term is "Aufteilungsschlüssel" (see `terme.de`) — the wording in
    # Austrian law (ElWOG 2010 §16e) and on energiegemeinschaften.gv.at. The two
    # aliases are the variants Belgian and German DSOs also use; they stay here
    # so the autolink filter still matches them wherever they survive in text.
    de: ["Verteilungsschlüssel", "Verteilschlüssel"]
    nl: ["verdeelsleutel"]

- slug: client-protege
  categorie: facturation
  tags: [aide, belgique, tarif]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/51"
  terme:
    fr: "Client protégé"
    en: "Protected customer"
    de: "Geschützter Kunde"
    nl: "Beschermde klant"
  definition:
    fr: "Ménage qui, du fait de sa situation sociale, bénéficie du tarif social et de protections spécifiques. Les clients protégés fédéraux — bénéficiaires de certaines aides du CPAS, de certaines allocations du Service fédéral des Pensions ou d'allocations liées au handicap — l'obtiennent en général automatiquement par croisement de données. Les clients protégés régionaux doivent réclamer une attestation et la transmettre à leur gestionnaire de réseau. Le seul statut BIM n'ouvre plus ce droit depuis le 1er juillet 2023."
    en: "A household that, because of its social situation, benefits from the social tariff and from specific protections. Federal protected customers — recipients of certain forms of public welfare assistance, of certain Federal Pension Service allowances or of disability-related allowances — generally obtain it automatically through data matching. Regional protected customers must request a certificate and pass it to their grid operator. Increased-reimbursement status alone has not conferred this entitlement since 1 July 2023."
    de: "Haushalt, der aufgrund seiner sozialen Lage den Sozialtarif und besondere Schutzrechte genießt. Föderal geschützte Kunden — Empfänger bestimmter Hilfen des Sozialhilfezentrums, bestimmter Leistungen des Föderalen Pensionsdienstes oder behinderungsbedingter Beihilfen — erhalten ihn in der Regel automatisch durch Datenabgleich. Regional geschützte Kunden müssen eine Bescheinigung anfordern und sie ihrem Netzbetreiber übermitteln. Der Status der erhöhten Beihilfe allein begründet dieses Recht seit dem 1. Juli 2023 nicht mehr."
    nl: "Gezin dat wegens zijn sociale situatie het sociaal tarief en specifieke beschermingen geniet. Federaal beschermde klanten — begunstigden van bepaalde steun van het OCMW, van bepaalde uitkeringen van de Federale Pensioendienst of van uitkeringen verbonden aan een handicap — krijgen het doorgaans automatisch via gegevenskruising. Regionaal beschermde klanten moeten zelf een attest opvragen en het aan hun netbeheerder bezorgen. Het statuut van verhoogde tegemoetkoming alleen geeft dit recht sinds 1 juli 2023 niet meer."
  alias:
    fr: ["clients protégés"]
    en: ["protected customers"]
    de: ["geschützte Kunden"]
    nl: ["beschermde klanten"]

- slug: code-ean
  categorie: reseau
  tags: [contrat, point, facture]
  source_nom: Ecoconso
  source_url: "https://www.ecoconso.be/fr/content/comprendre-sa-facture-delectricite"
  terme:
    fr: "Code EAN"
    en: "EAN code"
    de: "EAN-Code"
    nl: "EAN-code"
  definition:
    fr: "Identifiant unique à 18 chiffres d'un point de fourniture, commençant par 54 en Belgique ; il ne change ni au remplacement du compteur ni au changement de fournisseur."
    en: "Unique 18-digit identifier of a supply point, starting with 54 in Belgium; it changes neither when the meter is replaced nor when the supplier changes."
    de: "Eindeutige 18-stellige Kennung einer Lieferstelle, in Belgien mit 54 beginnend; sie ändert sich weder beim Zählertausch noch beim Lieferantenwechsel."
    nl: "Unieke identificatie van 18 cijfers van een leveringspunt, in België beginnend met 54; hij verandert niet bij vervanging van de meter, noch bij een leverancierswissel."
  alias:
    fr: ["EAN", "numéro EAN"]
    en: ["EAN", "EAN number"]
    de: ["EAN", "EAN-Nummer"]
    nl: ["EAN", "EAN-nummer"]

- slug: coefficient-de-performance
  categorie: technique
  tags: [rendement, pompe-a-chaleur, eau-chaude]
  source_nom: OptimCE
  source_ref: about
  terme:
    fr: "Coefficient de performance"
    en: "Coefficient of performance"
    de: "Leistungszahl"
    nl: "Prestatiecoëfficiënt"
  definition:
    fr: "Rapport entre la chaleur produite par un appareil et l'électricité qu'il consomme pour la produire. Un coefficient de 3 signifie trois kilowattheures de chaleur pour un kilowattheure soutiré. Plus il est élevé, moins l'appareil consomme — et moins il peut absorber de surplus photovoltaïque."
    en: "The ratio between the heat an appliance produces and the electricity it draws to produce it. A coefficient of 3 means three kilowatt-hours of heat for one kilowatt-hour drawn. The higher it is, the less the appliance consumes — and the less solar surplus it can absorb."
    de: "Verhältnis zwischen der von einem Gerät erzeugten Wärme und dem dafür bezogenen Strom. Eine Leistungszahl von 3 bedeutet drei Kilowattstunden Wärme je bezogener Kilowattstunde. Je höher sie ist, desto weniger verbraucht das Gerät — und desto weniger Solarüberschuss kann es aufnehmen."
    nl: "Verhouding tussen de warmte die een toestel produceert en de elektriciteit die het daarvoor afneemt. Een coëfficiënt van 3 betekent drie kilowattuur warmte per afgenomen kilowattuur. Hoe hoger hij is, hoe minder het toestel verbruikt — en hoe minder zonne-overschot het kan opnemen."
  alias:
    fr: ["COP"]
    en: ["COP"]
    de: ["COP"]
    nl: ["COP"]

- slug: commission-locale-energie
  categorie: juridique
  tags: [wallonie, coupure, cpas]
  source_nom: "Energie Info Wallonie"
  source_url: "https://www.energieinfowallonie.be/fr/commissions-locales-pour-lenergie"
  terme:
    fr: "Commission locale pour l'énergie"
    en: "Local Energy Commission"
    de: "Lokale Energiekommission"
    nl: "Lokale Energiecommissie"
  definition:
    fr: "Instance communale wallonne qui se réunit, à la demande du gestionnaire de réseau ou du client, avant une suspension de fourniture. Elle associe le conseil de l'aide sociale, le gestionnaire de réseau, la guidance sociale énergétique du CPAS et le client, et statue à la majorité sur la fourniture minimale garantie, la remise de dette, les bons mazout ou la réouverture du compteur. Recours possible devant le juge de paix."
    en: "A Walloon municipal body convened, at the request of the network operator or the customer, before a supply suspension. It brings together the social welfare council, the network operator, the CPAS social energy guidance service and the customer, and rules by majority on guaranteed minimum supply, debt relief, heating oil vouchers or meter reopening. An appeal lies to the justice of the peace."
    de: "Kommunales wallonisches Gremium, das auf Antrag des Netzbetreibers oder des Kunden vor einer Aussetzung der Belieferung zusammentritt. Es vereint den Sozialhilferat, den Netzbetreiber, die soziale Energiebegleitung des ÖSHZ und den Kunden und entscheidet mit Mehrheit über die garantierte Mindestversorgung, den Schuldenerlass, Heizölgutscheine oder die Wiederöffnung des Zählers. Der Rechtsweg zum Friedensgericht steht offen."
    nl: "Waals gemeentelijk orgaan dat op verzoek van de netbeheerder of de afnemer samenkomt vóór een opschorting van de levering. Het verenigt de raad voor maatschappelijk welzijn, de netbeheerder, de sociale energiebegeleiding van het OCMW en de afnemer, en beslist bij meerderheid over de gewaarborgde minimumlevering, de kwijtschelding van schuld, stookoliebonnen of de heropening van de meter. Beroep bij de vrederechter is mogelijk."
  alias:
    fr: ["Commissions locales pour l'énergie"]
    en: ["Local Energy Commissions"]
    de: ["Lokale Energiekommissionen"]
    nl: ["Lokale Energiecommissies"]

- slug: communaute
  categorie: gouvernance
  tags: [communaute, membres, partage]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/communautes-denergie"
  terme:
    fr: "Communauté"
    en: "Community"
    de: "Gemeinschaft"
    nl: "Gemeenschap"
  definition:
    fr: "Entité qui regroupe des membres pour produire, consommer, stocker ou partager de l'énergie."
    en: "An entity that brings members together to produce, consume, store or share energy."
    de: "Einheit, die Mitglieder zusammenbringt, um Energie zu erzeugen, zu verbrauchen, zu speichern oder zu teilen."
    nl: "Entiteit die leden samenbrengt om energie te produceren, te verbruiken, op te slaan of te delen."
  alias:
    fr: ["communauté d'énergie"]
    en: ["energy community"]
    de: ["Energiegemeinschaft"]
    nl: ["energiegemeenschap"]

- slug: compensation
  categorie: facturation
  tags: [photovoltaique, facture, wallonie]
  source_nom: Wallonie
  source_url: "https://www.wallonie.be/fr/actualites/panneaux-photovoltaiques-fin-du-compteur-qui-tourne-lenvers"
  terme:
    fr: "Compensation"
    en: "Compensation"
    de: "Kompensation"
    nl: "Compensatie"
  definition:
    fr: "Mécanisme dit du « compteur qui tourne à l'envers » : les injections viennent annuellement en déduction des prélèvements. Interdite par le droit européen au-delà du 31 décembre 2023, elle reste acquise en Wallonie jusqu'au 31 décembre 2030 pour les installations mises en service avant le 1er janvier 2024 — et doit être abandonnée pour participer à un partage d'énergie."
    en: "The mechanism known as the meter running backwards: injections are annually netted off withdrawals. Banned under European law beyond 31 December 2023, it remains secured in Wallonia until 31 December 2030 for systems commissioned before 1 January 2024 — and must be given up to take part in energy sharing."
    de: "Der sogenannte rückwärtslaufende Zähler: Einspeisungen werden jährlich von den Entnahmen abgezogen. Nach europäischem Recht über den 31. Dezember 2023 hinaus untersagt, bleibt sie in Wallonien bis zum 31. Dezember 2030 für vor dem 1. Januar 2024 in Betrieb genommene Anlagen erhalten — und muss für die Teilnahme am Energieteilen aufgegeben werden."
    nl: "Het mechanisme van de zogenaamde terugdraaiende teller: injecties worden jaarlijks in mindering gebracht op de afnames. Door het Europese recht verboden na 31 december 2023, blijft ze in Wallonië verworven tot 31 december 2030 voor installaties die vóór 1 januari 2024 in dienst zijn genomen — en moet ze worden opgegeven om aan energiedelen deel te nemen."
  alias:
    fr: ["compteur qui tourne à l'envers", "compensation annuelle"]
    en: ["net metering", "meter running backwards"]
    de: ["rückwärtslaufender Zähler", "jährliche Kompensation", "Saldierung"]
    nl: ["terugdraaiende teller", "jaarlijkse compensatie"]

- slug: composante-energie
  categorie: facturation
  tags: [facture, prix, marche]
  source_nom: CREG
  source_url: "https://www.creg.be/fr/consommateurs/le-marche-de-lenergie/comment-est-compose-le-prix-de-lenergie"
  terme:
    fr: "Composante énergie"
    en: "Energy component"
    de: "Energiekomponente"
    nl: "Energiecomponent"
  definition:
    fr: "Part de la facture correspondant au prix du kWh fixé par le fournisseur, soit environ 40 % du total ; seule composante soumise à la concurrence, et seule sur laquelle le partage d'énergie agit."
    en: "The share of the bill corresponding to the price per kWh set by the supplier, around 40 % of the total; the only competitive component, and the only one energy sharing acts on."
    de: "Der Anteil der Rechnung, der dem vom Lieferanten festgelegten Preis pro kWh entspricht, rund 40 % der Gesamtsumme; die einzige dem Wettbewerb ausgesetzte Komponente und die einzige, auf die die Energieteilung wirkt."
    nl: "Het deel van de factuur dat overeenstemt met de door de leverancier vastgelegde prijs per kWh, ongeveer 40 % van het totaal; de enige component die aan concurrentie onderworpen is en de enige waarop energiedeling inwerkt."
  alias:
    fr: ["composante énergie pure", "composante de l'énergie"]
    en: ["pure energy component"]
    de: ["reine Energiekomponente"]
    nl: ["pure energiecomponent"]

- slug: compteur-communicant
  categorie: mesure
  tags: [compteur, data, releve]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/secteur/communautes-partage-energie"
  terme:
    fr: "Compteur communicant"
    en: "Smart meter"
    de: "Intelligenter Zähler"
    nl: "Communicerende meter"
  definition:
    fr: "Compteur capable de relever et transmettre la consommation au quart d'heure. Il est la condition technique du partage d'énergie : sans données à ce pas de temps, aucune clé de répartition ne peut être appliquée."
    en: "A meter able to record and transmit consumption in quarter-hourly steps. It is the technical precondition for energy sharing: without data at that granularity, no allocation key can be applied."
    de: "Zähler, der den Verbrauch viertelstündlich erfassen und übermitteln kann. Er ist die technische Voraussetzung der Energieteilung: Ohne Daten in diesem Zeitraster lässt sich kein Aufteilungsschlüssel anwenden."
    nl: "Meter die het verbruik per kwartier kan registreren en doorsturen. Hij is de technische voorwaarde voor energiedelen: zonder data op dat tijdsinterval kan geen enkele verdeelsleutel worden toegepast."
  alias:
    fr: ["compteur intelligent"]
    en: ["communicating meter"]
    de: ["Smart Meter"]
    nl: ["slimme meter", "digitale meter"]

- slug: compteur-double-flux
  categorie: mesure
  tags: [compteur, photovoltaique, injection]
  source_nom: Wallonie
  source_url: "https://www.wallonie.be/fr/actualites/panneaux-photovoltaiques-fin-du-compteur-qui-tourne-lenvers"
  terme:
    fr: "Compteur double flux"
    en: "Dual-flow meter"
    de: "Zweirichtungszähler"
    nl: "Dubbele-fluxmeter"
  definition:
    fr: "Compteur qui mesure séparément l'électricité prélevée sur le réseau et l'électricité injectée. Obligatoire en Wallonie pour toute installation photovoltaïque mise en service à partir du 1er janvier 2024, il rend la compensation impossible et conditionne la vente du surplus au tarif d'injection."
    en: "A meter that measures electricity drawn from the grid and electricity injected separately. Mandatory in Wallonia for any solar installation commissioned from 1 January 2024, it makes compensation impossible and is the precondition for selling the surplus at the injection tariff."
    de: "Zähler, der die aus dem Netz entnommene und die eingespeiste Elektrizität getrennt misst. In Wallonien für jede ab dem 1. Januar 2024 in Betrieb genommene Photovoltaikanlage vorgeschrieben, macht er die Kompensation unmöglich und ist Voraussetzung für den Verkauf des Überschusses zum Einspeisetarif."
    nl: "Meter die de van het net afgenomen en de geïnjecteerde elektriciteit apart meet. In Wallonië verplicht voor elke fotovoltaïsche installatie die vanaf 1 januari 2024 in dienst wordt genomen, maakt hij compensatie onmogelijk en is hij de voorwaarde om het overschot tegen het injectietarief te verkopen."
  alias:
    fr: ["compteur bidirectionnel"]
    en: ["bidirectional meter", "two-way meter"]
    de: ["Zweiwegezähler", "bidirektionaler Zähler"]
    nl: ["tweerichtingsmeter", "bidirectionele meter"]

- slug: contrat-d-injection
  categorie: marche
  tags: [injection, fournisseur, surplus]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/prosumer-a-partir-de-2024"
  terme:
    fr: "Contrat d'injection"
    en: "Injection contract"
    de: "Einspeisevertrag"
    nl: "Injectiecontract"
  definition:
    fr: "Contrat par lequel un fournisseur rémunère l'électricité qu'un producteur injecte sur le réseau. Il est distinct du contrat de fourniture et son prix n'est régulé nulle part en Belgique. Sans compensation, il est la seule façon de valoriser un surplus autrement que par le partage ou l'autoconsommation."
    en: "The contract under which a supplier pays for the electricity a producer feeds into the grid. It is separate from the supply contract and its price is regulated nowhere in Belgium. Without compensation, it is the only way to monetise a surplus other than through sharing or self-consumption."
    de: "Vertrag, mit dem ein Lieferant den ins Netz eingespeisten Strom eines Erzeugers vergütet. Er ist vom Liefervertrag getrennt, und sein Preis ist in Belgien nirgends reguliert. Ohne Kompensation ist er der einzige Weg, einen Überschuss anders als über Teilen oder Eigenverbrauch zu verwerten."
    nl: "Contract waarmee een leverancier de elektriciteit vergoedt die een producent op het net injecteert. Het staat los van het leveringscontract en de prijs ervan is nergens in België gereguleerd. Zonder compensatie is het de enige manier om een overschot te valoriseren buiten delen of zelfverbruik om."
  alias:
    fr: ["contrat de rachat"]
    en: ["export contract", "feed-in contract"]
    de: ["Einspeisungsvertrag"]
    nl: ["injectieovereenkomst"]

- slug: convention-de-partage
  categorie: juridique
  tags: [contrat, partage, gouvernance]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6064"
  terme:
    fr: "Convention de partage"
    en: "Sharing agreement"
    de: "Teilungsvereinbarung"
    nl: "Deelovereenkomst"
  definition:
    fr: "Contrat entre les participants d'un partage d'énergie fixant leurs droits et obligations, dont la clé de répartition et le prix de l'électricité partagée."
    en: "Contract between the participants in an energy-sharing scheme setting out their rights and obligations, including the allocation key and the price of the shared electricity."
    de: "Vertrag zwischen den Teilnehmern einer Energieteilung, der ihre Rechte und Pflichten festlegt, einschließlich Aufteilungsschlüssel und Preis des geteilten Stroms."
    nl: "Overeenkomst tussen de deelnemers aan energiedelen die hun rechten en plichten vastlegt, met inbegrip van de verdeelsleutel en de prijs van de gedeelde elektriciteit."
  alias:
    fr: ["convention de partage d'énergie", "contrat de partage"]
    en: ["energy sharing agreement"]
    de: ["Vereinbarung über Energieteilung"]
    nl: ["overeenkomst energiedelen"]

- slug: cooperative
  categorie: juridique
  tags: [belgique, structure, gouvernance]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/communautes-denergie"
  terme:
    fr: "Coopérative"
    en: "Cooperative"
    de: "Genossenschaft"
    nl: "Coöperatie"
  definition:
    fr: "Structure à capital variable et gouvernance démocratique, souvent retenue pour porter une communauté d'énergie. Le principe « une personne, une voix » répond directement à l'exigence européenne de contrôle effectif par les membres."
    en: "A structure with variable capital and democratic governance, often chosen to host an energy community. The \"one person, one vote\" principle answers the European requirement of effective control by members."
    de: "Struktur mit veränderlichem Kapital und demokratischer Governance, häufig als Träger einer Energiegemeinschaft gewählt. Das Prinzip „eine Person, eine Stimme\" erfüllt unmittelbar die europäische Anforderung der tatsächlichen Mitgliederkontrolle."
    nl: "Structuur met veranderlijk kapitaal en democratisch bestuur, vaak gekozen om een energiegemeenschap te dragen. Het principe „één persoon, één stem\" beantwoordt rechtstreeks aan de Europese eis van daadwerkelijke zeggenschap door de leden."
  alias:
    fr: ["coop"]
    en: ["co-op"]
    de: ["Koop"]
    nl: ["coöp"]

- slug: copropriete
  categorie: juridique
  tags: [immeuble, batiment, belgique, partage]
  source_nom: IPI
  source_url: "https://www.ipi.be/media/1462/download?inline=1"
  terme:
    fr: "Copropriété"
    en: "Condominium"
    de: "Wohnungseigentum"
    nl: "Mede-eigendom"
  definition:
    fr: "Situation d'un immeuble divisé en au moins deux lots appartenant à des propriétaires différents et comportant au moins une partie commune. À Bruxelles, cette définition recoupe presque mot pour mot celle du bâtiment qui ouvre le droit au partage d'énergie."
    en: "Situation of a building divided into at least two units held by different owners and containing at least one common part. In Brussels, that definition matches almost word for word the definition of the building that opens the right to share energy."
    de: "Lage eines Gebäudes, das in mindestens zwei Einheiten unterschiedlicher Eigentümer geteilt ist und mindestens einen gemeinschaftlichen Teil aufweist. In Brüssel deckt sich diese Definition fast wörtlich mit der des Gebäudes, das den Anspruch auf Energieteilung eröffnet."
    nl: "Situatie van een gebouw dat verdeeld is in ten minste twee kavels van verschillende eigenaars en ten minste één gemeenschappelijk deel bevat. In Brussel valt die definitie bijna woordelijk samen met die van het gebouw dat het recht op energiedelen opent."
  alias:
    fr: ["copropriété forcée", "immeuble en copropriété"]
    en: ["co-ownership", "condominium building"]
    de: ["Miteigentum", "Eigentümergemeinschaft"]
    nl: ["gedwongen mede-eigendom", "appartementsmede-eigendom"]

- slug: cwape
  categorie: regulateur
  tags: [wallonie, regulation, belgique]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/"
  terme:
    fr: "CWaPE"
    en: "CWaPE"
    de: "CWaPE"
    nl: "CWaPE"
  definition:
    fr: "Commission wallonne pour l'énergie, régulateur du marché wallon. Elle définit les familles de clés de répartition standards, reçoit la notification des communautés d'énergie et autorise les clés non standards."
    en: "The Walloon energy regulator. It defines the families of standard allocation keys, receives the notification of energy communities, and authorises non-standard keys."
    de: "Wallonische Energieregulierungsbehörde. Sie definiert die Familien der Standard-Aufteilungsschlüssel, nimmt die Meldung von Energiegemeinschaften entgegen und genehmigt nicht standardisierte Schlüssel."
    nl: "De Waalse energieregulator. Hij bepaalt de families van standaardverdeelsleutels, ontvangt de melding van energiegemeenschappen en verleent vergunning voor niet-standaardsleutels."
  alias:
    fr: ["Commission wallonne pour l'Énergie"]
    en: ["Walloon Energy Commission"]
    de: ["Wallonische Energiekommission"]
    nl: ["Waalse Energiecommissie"]

- slug: decompte-annuel
  categorie: facturation
  tags: [facture, releve, paiement]
  source_nom: Ecoconso
  source_url: "https://www.ecoconso.be/fr/content/comprendre-sa-facture-delectricite"
  terme:
    fr: "Décompte annuel"
    en: "Annual statement"
    de: "Jahresabrechnung"
    nl: "Jaarafrekening"
  definition:
    fr: "Facture de régularisation fondée sur les index relevés au compteur ; elle calcule la consommation réelle de la période et solde les acomptes déjà payés."
    en: "Settlement invoice based on the meter readings; it calculates real consumption over the period and settles the instalments already paid."
    de: "Ausgleichsrechnung auf Basis der abgelesenen Zählerstände; sie berechnet den tatsächlichen Verbrauch des Zeitraums und verrechnet die bereits gezahlten Abschläge."
    nl: "Regularisatiefactuur op basis van de opgenomen meterstanden; ze berekent het werkelijke verbruik van de periode en vereffent de reeds betaalde voorschotten."
  alias:
    fr: ["facture de régularisation", "régularisation annuelle"]
    en: ["settlement invoice", "annual settlement"]
    de: ["Ausgleichsrechnung", "Jahresverbrauchsabrechnung"]
    nl: ["regularisatiefactuur", "jaarlijkse regularisatie"]

- slug: droit-de-superficie
  categorie: juridique
  tags: [toiture, tiers-investisseur, copropriete, belgique]
  source_nom: Notaire.be
  source_url: "https://www.notaire.be/immobilier/les-servitudes-lemphyteose-et-le-droit-de-superficie/le-droit-de-superficie"
  terme:
    fr: "Droit de superficie"
    en: "Right of superficies"
    de: "Erbbaurecht"
    nl: "Opstalrecht"
  definition:
    fr: "Droit réel permettant d'avoir des constructions sur le fonds d'autrui, pour 99 ans au maximum depuis le livre 3 du Code civil. C'est le montage par lequel une coopérative ou un tiers investisseur devient propriétaire des panneaux posés sur une toiture commune ; son octroi requiert les quatre cinquièmes des voix en assemblée générale."
    en: "Real right allowing someone to own constructions on another's land, for up to 99 years since Book 3 of the Civil Code. It is the structure through which a cooperative or a third-party investor becomes owner of panels installed on a common roof; granting it requires four fifths of the votes at the general meeting."
    de: "Dingliches Recht, Bauwerke auf fremdem Grund zu haben, seit Buch 3 des Zivilgesetzbuches für höchstens 99 Jahre. Es ist die Konstruktion, mit der eine Genossenschaft oder ein Drittinvestor Eigentümer der auf einem gemeinschaftlichen Dach errichteten Module wird; seine Einräumung verlangt vier Fünftel der Stimmen in der Eigentümerversammlung."
    nl: "Zakelijk recht om constructies te hebben op andermans grond, sinds boek 3 van het Burgerlijk Wetboek voor maximaal 99 jaar. Het is de structuur waarmee een coöperatie of een derde-investeerder eigenaar wordt van de panelen op een gemeenschappelijk dak; de toekenning ervan vereist vier vijfde van de stemmen in de algemene vergadering."
  alias:
    fr: ["superficie"]
    en: ["superficies"]
    de: ["Baurecht"]
    nl: ["recht van opstal"]

- slug: energie-locale
  categorie: territoire
  tags: [local, communaute, proximite]
  source_nom: "Bruxelles Environnement"
  source_url: "https://environnement.brussels/media/12676/download?inline"
  terme:
    fr: "Énergie locale"
    en: "Local energy"
    de: "Lokale Energie"
    nl: "Lokale energie"
  definition:
    fr: "Énergie produite et consommée à l'échelle d'un territoire proche, sans transiter par le réseau de transport. La proximité est un critère juridique pour les communautés d'énergie renouvelable, pas seulement une intention."
    en: "Energy produced and consumed within a nearby area, without passing through the transmission grid. Proximity is a legal criterion for renewable energy communities, not merely an intention."
    de: "Energie, die im nahen Umfeld erzeugt und verbraucht wird, ohne das Übertragungsnetz zu durchlaufen. Nähe ist für Erneuerbare-Energien-Gemeinschaften ein Rechtskriterium, nicht bloß eine Absicht."
    nl: "Energie die op korte afstand wordt geproduceerd en verbruikt, zonder via het transmissienet te passeren. Nabijheid is voor hernieuwbare-energiegemeenschappen een juridisch criterium, niet louter een intentie."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: energie-renouvelable
  categorie: production
  tags: [renouvelable, cer, production]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/communautes-denergie"
  terme:
    fr: "Énergie renouvelable"
    en: "Renewable energy"
    de: "Erneuerbare Energie"
    nl: "Hernieuwbare energie"
  definition:
    fr: "Énergie issue de sources renouvelables comme le solaire, l'éolien ou l'hydraulique."
    en: "Energy from renewable sources such as solar, wind or hydropower."
    de: "Energie aus erneuerbaren Quellen wie Solar-, Wind- oder Wasserkraft."
    nl: "Energie uit hernieuwbare bronnen zoals zonne-, wind- of waterkracht."
  alias:
    fr: ["énergie verte"]
    en: ["green energy"]
    de: ["grüne Energie"]
    nl: ["groene energie"]

- slug: energie-residuelle
  categorie: facturation
  tags: [facturation, partage, fournisseur]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/5618"
  terme:
    fr: "Énergie résiduelle"
    en: "Residual energy"
    de: "Restenergie"
    nl: "Restenergie"
  definition:
    fr: "Part de votre consommation que le partage ne couvre pas et que votre fournisseur continue de facturer au tarif de votre contrat. Elle existe toujours, car le partage ne joue que dans les quarts d'heure où il y a de la production locale."
    en: "The share of your consumption that sharing does not cover and that your supplier keeps billing at your contract price. It always exists, because sharing only applies during the quarter-hours when local production is available."
    de: "Der Teil Ihres Verbrauchs, den die Teilung nicht abdeckt und den Ihr Lieferant weiterhin zum Preis Ihres Vertrags abrechnet. Er besteht immer, denn die Teilung greift nur in den Viertelstunden mit lokaler Erzeugung."
    nl: "Het deel van uw verbruik dat het delen niet dekt en dat uw leverancier blijft factureren tegen de prijs van uw contract. Het bestaat altijd, want delen speelt alleen tijdens de kwartieren met lokale productie."
  alias:
    fr: ["énergie complémentaire"]
    en: ["complementary energy"]
    de: ["Reststrom"]
    nl: ["aanvullende energie"]

