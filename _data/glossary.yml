    en: "Closing invoice"
    de: "Schlussrechnung"
    nl: "Slotfactuur"
  definition:
    fr: "Facture émise lors d'un déménagement ou d'un changement de fournisseur, établie à partir du relevé d'index final pour solder le point de fourniture."
    en: "Invoice issued when moving home or switching supplier, drawn up from the final meter reading to close the supply point."
    de: "Rechnung bei Umzug oder Lieferantenwechsel, erstellt auf Basis des Endzählerstands, um die Lieferstelle abzuschließen."
    nl: "Factuur bij een verhuizing of een leverancierswissel, opgemaakt op basis van de eindmeterstand om het leveringspunt af te sluiten."
  alias:
    fr: ["facture finale"]
    en: ["final invoice"]
    de: ["Endabrechnung"]
    nl: ["eindfactuur"]

- slug: fiche-tarifaire
