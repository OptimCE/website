- slug: fonds-social-chauffage
  categorie: reglementaire
  tags: [aide, mazout, cpas]
  source_nom: "Fonds Social Chauffage"
  source_url: "https://www.fondschauffage.be"
  terme:
    fr: "Fonds social chauffage"
    en: "Social Heating Fund"
    de: "Sozialer Heizfonds"
    nl: "Sociaal Verwarmingsfonds"
  definition:
    fr: "Fonds fédéral qui intervient, via le CPAS, dans l'achat de gasoil de chauffage, de propane en vrac ou de pétrole lampant par les ménages à revenus modestes. En 2026 l'allocation va de 0,14 à 0,20 € par litre, dans la limite de 1 500 litres et de 300 € par an, ou 210 € forfaitaires pour un achat à la pompe. C'est le seul dispositif couvrant les vecteurs de chauffage privés de tarif social."
    en: "A federal fund contributing, through the CPAS, to the purchase of heating gasoil, bulk propane or kerosene by modest-income households. In 2026 the allowance runs from €0.14 to €0.20 per litre, within a limit of 1,500 litres and €300 per year, or a €210 flat rate for purchases at the pump. It is the only scheme covering heating fuels that have no social tariff."
    de: "Föderaler Fonds, der über das ÖSHZ zum Kauf von Heizgasöl, losem Propangas oder Leuchtpetroleum durch Haushalte mit bescheidenem Einkommen beiträgt. 2026 reicht die Zuwendung von 0,14 bis 0,20 € je Liter, begrenzt auf 1 500 Liter und 300 € pro Jahr, oder 210 € pauschal beim Kauf an der Zapfsäule. Es ist das einzige Instrument für Heizträger ohne Sozialtarif."
    nl: "Federaal fonds dat via het OCMW tussenkomt in de aankoop van huisbrandolie, propaan in bulk of lampolie door gezinnen met een bescheiden inkomen. In 2026 loopt de toelage van 0,14 tot 0,20 € per liter, binnen een grens van 1 500 liter en 300 € per jaar, of 210 € forfaitair bij aankoop aan de pomp. Het is de enige maatregel voor verwarmingsbrandstoffen zonder sociaal tarief."
  alias:
    fr: ["Fonds social mazout", "Fonds chauffage"]
    en: ["Heating Fund"]
    de: ["Heizfonds"]
    nl: ["Verwarmingsfonds"]

- slug: fournisseur
  categorie: marche
  tags: [contrat, vente, energie]
  source_nom: Coretec
  source_url: "https://coretec.be/lexique/"
  terme:
    fr: "Fournisseur"
    en: "Supplier"
    de: "Lieferant"
    nl: "Leverancier"
  definition:
    fr: "Entreprise qui vend l'énergie au client final et lui facture sa consommation résiduelle. Dans un partage d'énergie, sa facture coexiste avec celle émise par le représentant du partage."
    en: "The company that sells energy to the final customer and bills their residual consumption. In an energy-sharing setup, its invoice coexists with the one issued by the sharing representative."
    de: "Unternehmen, das dem Endkunden Energie verkauft und dessen Restverbrauch abrechnet. Bei der Energieteilung besteht seine Rechnung neben derjenigen des Vertreters der Teilungsoperation."
    nl: "Bedrijf dat energie verkoopt aan de eindafnemer en zijn restverbruik factureert. Bij energiedelen bestaat zijn factuur naast die van de vertegenwoordiger van de deelactie."
  alias:
    fr: ["fournisseur d'énergie"]
    en: ["energy supplier"]
    de: ["Energielieferant"]
    nl: ["energieleverancier"]

- slug: garantie-d-origine
  categorie: reglementaire
  tags: [tracabilite, fournisseur, renouvelable]
  source_nom: "SPW Énergie"
  source_url: "https://energie.wallonie.be/home/les-marches-et-les-acteurs/le-marche-des-garanties-d-origine/garanties-d-origine-de-l-electricite-et-du-gaz.html"
  terme:
    fr: "Garantie d'origine"
    en: "Guarantee of origin"
    de: "Herkunftsnachweis"
    nl: "Garantie van oorsprong"
  definition:
    fr: "Certificat électronique attestant qu'un mégawattheure d'électricité renouvelable a été produit quelque part dans l'Espace économique européen. Il se vend indépendamment de l'électricité, reste valable douze mois et circule entre pays : il prouve une production, pas une livraison."
    en: "An electronic certificate attesting that one megawatt-hour of renewable electricity was produced somewhere in the European Economic Area. It is sold independently of the electricity, stays valid for twelve months and travels between countries: it proves production, not delivery."
    de: "Elektronisches Zertifikat, das belegt, dass irgendwo im Europäischen Wirtschaftsraum eine Megawattstunde erneuerbaren Stroms erzeugt wurde. Es wird unabhängig vom Strom verkauft, bleibt zwölf Monate gültig und zirkuliert zwischen Ländern: Es belegt eine Erzeugung, keine Lieferung."
    nl: "Elektronisch certificaat dat aantoont dat ergens in de Europese Economische Ruimte één megawattuur hernieuwbare stroom is geproduceerd. Het wordt los van de elektriciteit verkocht, blijft twaalf maanden geldig en circuleert tussen landen: het bewijst een productie, geen levering."
  alias:
    fr: ["garanties d'origine", "label de garantie d'origine"]
    en: ["guarantees of origin"]
    de: ["Herkunftsnachweise"]
    nl: ["garanties van oorsprong"]
