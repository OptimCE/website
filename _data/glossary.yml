    en: "Transmission system operator: the company responsible for the high-voltage grid that carries electricity to the distribution networks. In Belgium this role is held by Elia."
    de: "Übertragungsnetzbetreiber: das Unternehmen, das für das Hochspannungsnetz zuständig ist, welches den Strom zu den Verteilnetzen transportiert. In Belgien nimmt Elia diese Rolle wahr."
