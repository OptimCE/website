    fr: "Gestionnaire du réseau de transport : l'entreprise responsable du réseau haute tension qui achemine l'électricité jusqu'aux réseaux de distribution. En Belgique, ce rôle est assuré par Elia."
    en: "Transmission system operator: the company responsible for the high-voltage grid that carries electricity to the distribution networks. In Belgium this role is held by Elia."
    de: "Übertragungsnetzbetreiber: das Unternehmen, das für das Hochspannungsnetz zuständig ist, welches den Strom zu den Verteilnetzen transportiert. In Belgien nimmt Elia diese Rolle wahr."
    nl: "Transmissienetbeheerder: het bedrijf dat instaat voor het hoogspanningsnet dat elektriciteit naar de distributienetten brengt. In België wordt die rol vervuld door Elia."
