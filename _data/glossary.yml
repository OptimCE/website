    en: "A cycle of recalculating the allocation or sharing within an algorithm."
    de: "Zyklus der Neuberechnung der Aufteilung oder Verteilung in einem Algorithmus."
    nl: "Cyclus waarin de verdeling of het delen in een algoritme opnieuw wordt berekend."
