    en: "The distribution system operator for the whole of Flanders. It supplies the quarter-hourly metering data and applies the allocation keys recognised by the Flemish regulator VREG."
    de: "Verteilnetzbetreiber für ganz Flandern. Er liefert die viertelstündlichen Messdaten und wendet die vom flämischen Regulator VREG anerkannten Aufteilungsschlüssel an."
