- slug: facture-d-acompte
  categorie: facturation
  tags: [facture, paiement, estimation]
  source_nom: Ecoconso
  source_url: "https://www.ecoconso.be/fr/content/comprendre-sa-facture-delectricite"
  terme:
    fr: "Facture d'acompte"
    en: "Instalment invoice"
    de: "Abschlagsrechnung"
    nl: "Voorschotfactuur"
  definition:
    fr: "Avance périodique calculée sur une estimation de la consommation annuelle, généralement celle de l'année précédente ; elle ne reflète pas la consommation réelle."
    en: "Periodic advance calculated from an estimate of annual consumption, usually the previous year's; it does not reflect actual consumption."
    de: "Regelmäßige Vorauszahlung auf Basis einer Schätzung des Jahresverbrauchs, meist des Vorjahres; sie gibt den tatsächlichen Verbrauch nicht wieder."
    nl: "Periodieke voorafbetaling berekend op een raming van het jaarverbruik, doorgaans dat van vorig jaar; ze geeft het werkelijke verbruik niet weer."
  alias:
    fr: ["acompte", "acomptes"]
    en: ["instalment", "advance invoice"]
    de: ["Abschlag", "Abschlagszahlung"]
    nl: ["voorschot", "voorschotten"]

- slug: facture-de-cloture
  categorie: facturation
  tags: [facture, demenagement, releve]
