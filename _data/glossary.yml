  source_url: "https://energie.wallonie.be/home/contacts/guichets-energie-wallonie.html"
  terme:
    fr: "Guichet Énergie Wallonie"
    en: "Walloon Energy Desk"
    de: "Energieschalter der Wallonie"
    nl: "Energieloket van Wallonië"
  definition:
    fr: "Réseau de 16 espaces et 40 consultants du Service public de Wallonie qui délivrent un conseil technique personnalisé, neutre et entièrement gratuit sur l'énergie dans l'habitat : primes, tarifs, isolation, chauffage, photovoltaïque. Premier contact par le numéro vert 1718."
    en: "A network of 16 offices and 40 consultants run by the Walloon public service, providing personalised, neutral and entirely free technical advice on household energy: grants, tariffs, insulation, heating, photovoltaics. First contact through the 1718 freephone number."
    de: "Netz aus 16 Anlaufstellen und 40 Beratern des Öffentlichen Dienstes der Wallonie, die persönliche, neutrale und vollständig kostenlose technische Beratung zu Energie im Wohnbereich bieten: Prämien, Tarife, Dämmung, Heizung, Photovoltaik. Erster Kontakt über die grüne Nummer 1718."
    nl: "Netwerk van 16 loketten en 40 consulenten van de Waalse Overheidsdienst die persoonlijk, neutraal en volledig gratis technisch advies geven over energie in de woning: premies, tarieven, isolatie, verwarming, zonnepanelen. Eerste contact via het groene nummer 1718."
  alias:
    fr: ["Guichets Énergie Wallonie", "Guichet Énergie"]
    en: ["Walloon Energy Desks"]
    de: ["Energieschalter"]
    nl: ["Energieloketten van Wallonië", "Energieloket"]

- slug: injection
  categorie: reseau
  tags: [production, reseau, surplus]
  source_nom: ORES
  source_url: "https://www.ores.be/faq/partage-denergie/"
  terme:
    fr: "Injection"
    en: "Injection"
    de: "Einspeisung"
    nl: "Injectie"
  definition:
    fr: "Énergie renvoyée vers le réseau lorsque la production locale dépasse la consommation instantanée. Elle est rémunérée au tarif d'injection, généralement bien inférieur au prix de détail de l'électricité."
    en: "Energy sent back to the grid when local generation exceeds instantaneous consumption. It is paid at the injection tariff, generally far below the retail price of electricity."
    de: "Energie, die ins Netz zurückgespeist wird, wenn die lokale Erzeugung den momentanen Verbrauch übersteigt. Sie wird zum Einspeisetarif vergütet, der in der Regel deutlich unter dem Endkundenpreis liegt."
    nl: "Energie die naar het net wordt teruggestuurd wanneer de lokale productie het momentane verbruik overtreft. Ze wordt vergoed tegen het injectietarief, doorgaans ver onder de detailhandelsprijs."
  alias:
    fr: []
    en: ["grid injection"]
    de: ["Netzeinspeisung"]
    nl: ["teruglevering"]

