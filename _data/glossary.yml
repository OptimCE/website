- slug: greenwashing
  categorie: marche
  tags: [reglementaire, fournisseur, consommateur]
  source_nom: "SPF Économie"
  source_url: "https://economie.fgov.be/fr/themes/entreprises/guidance/pratiques-commerciales/rediger-des-allegations"
  terme:
    fr: "Greenwashing"
    en: "Greenwashing"
    de: "Greenwashing"
    nl: "Greenwashing"
  definition:
    fr: "Pratique consistant à présenter un produit ou un service comme plus respectueux de l'environnement qu'il ne l'est. Le SPF Économie vise une allégation fausse, présentée de manière trompeuse ou qui ne peut pas être vérifiée, interdite par les articles VI.93 à VI.100 du Code de droit économique."
    en: "Presenting a product or service as more environmentally friendly than it is. The FPS Economy targets a claim that is false, presented in a misleading way or that cannot be verified, prohibited by articles VI.93 to VI.100 of the Code of Economic Law."
    de: "Ein Produkt oder eine Dienstleistung umweltfreundlicher darstellen, als sie ist. Der FÖD Wirtschaft zielt auf eine Aussage, die falsch ist, irreführend dargestellt wird oder nicht überprüft werden kann, verboten durch die Artikel VI.93 bis VI.100 des Wirtschaftsgesetzbuchs."
    nl: "Een product of dienst milieuvriendelijker voorstellen dan het is. De FOD Economie viseert een claim die vals is, misleidend wordt voorgesteld of niet kan worden geverifieerd, verboden door de artikelen VI.93 tot VI.100 van het Wetboek van economisch recht."
  alias:
    fr: ["écoblanchiment"]
    en: ["green washing"]
    de: ["Grünfärberei"]
    nl: ["groenwassen"]
