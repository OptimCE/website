    en: "The company that sells energy to the final customer and bills their residual consumption. In an energy-sharing setup, its invoice coexists with the one issued by the sharing representative."
    de: "Unternehmen, das dem Endkunden Energie verkauft und dessen Restverbrauch abrechnet. Bei der Energieteilung besteht seine Rechnung neben derjenigen des Vertreters der Teilungsoperation."
    nl: "Bedrijf dat energie verkoopt aan de eindafnemer en zijn restverbruik factureert. Bij energiedelen bestaat zijn factuur naast die van de vertegenwoordiger van de deelactie."
