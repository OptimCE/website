- slug: injection
  categorie: reseau
  tags: [production, reseau, surplus]
  source_nom: ORES
  source_url: "https://www.ores.be/faq/partage-denergie/"
  terme:
    fr: "Injection"
    en: "Injection"
    de: "Einspeisung"
    nl: "Injectie"
  definition:
    fr: "Énergie renvoyée vers le réseau lorsque la production locale dépasse la consommation instantanée. Elle est rémunérée au tarif d'injection, généralement bien inférieur au prix de détail de l'électricité."
    en: "Energy sent back to the grid when local generation exceeds instantaneous consumption. It is paid at the injection tariff, generally far below the retail price of electricity."
    de: "Energie, die ins Netz zurückgespeist wird, wenn die lokale Erzeugung den momentanen Verbrauch übersteigt. Sie wird zum Einspeisetarif vergütet, der in der Regel deutlich unter dem Endkundenpreis liegt."
    nl: "Energie die naar het net wordt teruggestuurd wanneer de lokale productie het momentane verbruik overtreft. Ze wordt vergoed tegen het injectietarief, doorgaans ver onder de detailhandelsprijs."
  alias:
    fr: []
    en: ["grid injection"]
    de: ["Netzeinspeisung"]
    nl: ["teruglevering"]

