    de: ["Mitglied"]
    nl: ["lid"]

- slug: personne-morale
  categorie: juridique
  tags: [structure, droit, communaute]
  source_nom: "Bruxelles Environnement"
  source_url: "https://environnement.brussels/media/12676/download?inline"
  terme:
    fr: "Personne morale"
    en: "Legal entity"
    de: "Juristische Person"
    nl: "Rechtspersoon"
  definition:
    fr: "Entité juridique constituée, obligatoire pour porter une communauté d'énergie : les directives européennes l'exigent explicitement. En pratique, ASBL et coopérative sont les formes les plus courantes en Belgique."
    en: "A constituted legal entity, mandatory to host an energy community: the European directives require it explicitly. In practice, the non-profit association and the cooperative are the commonest forms in Belgium."
    de: "Gegründete Rechtsperson, zwingend erforderlich für eine Energiegemeinschaft — die europäischen Richtlinien verlangen dies ausdrücklich. In der Praxis sind Verein und Genossenschaft die häufigsten Formen in Belgien."
    nl: "Opgerichte rechtspersoon, verplicht om een energiegemeenschap te dragen: de Europese richtlijnen eisen dat uitdrukkelijk. In de praktijk zijn de vzw en de coöperatie de meest voorkomende vormen in België."
  alias:
    fr: []
    en: ["legal person"]
    de: []
    nl: []

- slug: point-de-fourniture
  categorie: reseau
  tags: [contrat, point, livraison]
  source_nom: Coretec
  source_url: "https://coretec.be/lexique/"
  terme:
    fr: "Point de fourniture"
    en: "Supply point"
    de: "Lieferstelle"
    nl: "Leveringspunt"
  definition:
    fr: "Point contractuel de livraison de l'énergie, identifié par un code EAN unique. C'est l'unité de base d'une opération de partage : la clé de répartition s'applique par point de fourniture, pas par personne."
    en: "The contractual delivery point for energy, identified by a unique EAN code. It is the base unit of a sharing operation: the allocation key applies per supply point, not per person."
    de: "Vertraglicher Lieferpunkt für Energie, identifiziert durch einen eindeutigen EAN-Code. Er ist die Grundeinheit einer Teilungsoperation: Der Aufteilungsschlüssel gilt je Lieferstelle, nicht je Person."
    nl: "Contractueel leveringspunt voor energie, geïdentificeerd door een unieke EAN-code. Het is de basiseenheid van een deelactie: de verdeelsleutel geldt per leveringspunt, niet per persoon."
  alias:
