- slug: grd
  categorie: reseau
  tags: [acteur, distribution, belgique]
  source_nom: Coretec
  source_url: "https://coretec.be/lexique/"
  terme:
    fr: "GRD"
    en: "GRD"
    de: "GRD"
    nl: "GRD"
