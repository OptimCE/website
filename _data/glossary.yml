- slug: terme-capacitaire
  categorie: reseau
  tags: [tarif, reseau, puissance, pointe]
  source_nom: Fluvius
  source_url: "https://www.fluvius.be/nl/factuur-en-tarieven/capaciteitstarief"
  terme:
    fr: "Terme capacitaire"
    en: "Capacity term"
    de: "Kapazitätsterm"
    nl: "Capaciteitstarief"
  definition:
    fr: "Part du tarif de réseau calculée sur la puissance appelée plutôt que sur les kWh consommés. En Flandre, il se base sur la pointe la plus élevée d'un quart d'heure du mois, avec un plancher de 2,5 kW ; à Bruxelles, il est lié à la puissance de raccordement."
    en: "The part of the network tariff calculated on the power drawn rather than on the kWh consumed. In Flanders it is based on the highest quarter-hour peak of the month, with a 2.5 kW floor; in Brussels it is tied to connection capacity."
    de: "Der Teil des Netztarifs, der auf die abgerufene Leistung statt auf die verbrauchten kWh berechnet wird. In Flandern beruht er auf der höchsten Viertelstundenspitze des Monats, mit einer Untergrenze von 2,5 kW; in Brüssel ist er an die Anschlussleistung gekoppelt."
    nl: "Het deel van het nettarief dat wordt berekend op het gevraagde vermogen in plaats van op de verbruikte kWh. In Vlaanderen vertrekt het van de hoogste kwartierpiek van de maand, met een ondergrens van 2,5 kW; in Brussel is het gekoppeld aan het aansluitvermogen."
  alias:
    fr: ["tarif capacitaire", "terme de puissance"]
    en: ["capacity tariff", "power term"]
    de: ["Kapazitätstarif", "Leistungsterm"]
