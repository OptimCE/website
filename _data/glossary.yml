- slug: mebar
  categorie: reglementaire
  tags: [prime, wallonie, cpas]
  source_nom: "SPW Énergie"
  source_url: "https://www.wallonie.be/fr/demarches/demander-une-subvention-energie-en-tant-que-menage-revenu-modeste-prime-mebar"
  terme:
    fr: "MEBAR"
    en: "MEBAR"
    de: "MEBAR"
    nl: "MEBAR"
  definition:
    fr: "Subvention wallonne aux ménages à revenus modestes pour des travaux économiseurs d'énergie dans le logement principal : châssis, isolation, poêle, gainage de cheminée, chaudière ou chauffe-eau. Elle atteint 2 000 € depuis le 13 juin 2022 et peut être doublée selon la nature des travaux. Elle s'introduit exclusivement par le CPAS, avec un délai minimum de cinq ans entre deux demandes."
    en: "A Walloon subsidy for modest-income households covering energy-saving works in the main dwelling: window frames, insulation, a stove, chimney lining, a boiler or a water heater. It reaches €2,000 since 13 June 2022 and can be doubled depending on the type of works. It is filed exclusively through the CPAS, with a minimum of five years between two applications."
    de: "Wallonischer Zuschuss für Haushalte mit bescheidenem Einkommen für energiesparende Arbeiten an der Hauptwohnung: Fensterrahmen, Dämmung, Ofen, Schornsteinauskleidung, Heizkessel oder Warmwasserbereiter. Er beträgt seit dem 13. Juni 2022 bis zu 2 000 € und kann je nach Art der Arbeiten verdoppelt werden. Der Antrag läuft ausschließlich über das ÖSHZ, mit mindestens fünf Jahren zwischen zwei Anträgen."
    nl: "Waalse subsidie voor gezinnen met een bescheiden inkomen voor energiebesparende werken aan de hoofdwoning: ramen, isolatie, kachel, het voeren van een schoorsteen, ketel of waterverwarmer. Ze bedraagt sinds 13 juni 2022 tot 2 000 € en kan naargelang de aard van de werken worden verdubbeld. Ze wordt uitsluitend via het OCMW ingediend, met minstens vijf jaar tussen twee aanvragen."
  alias:
    fr: ["prime MEBAR", "subvention MEBAR"]
    en: ["MEBAR grant"]
    de: ["MEBAR-Prämie"]
    nl: ["MEBAR-premie"]

- slug: mediation-energie
  categorie: juridique
  tags: [recours, litige, belgique]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/srme/mediation"
  terme:
    fr: "Service de médiation de l'énergie"
    en: "Energy ombudsman service"
    de: "Ombudsdienst für Energie"
    nl: "Ombudsdienst voor Energie"
  definition:
    fr: "Instance de recours en cas de litige avec un fournisseur ou un gestionnaire de réseau, après démarche écrite préalable ; le service fédéral traite le contrat et le prix, les services régionaux le compteur et le réseau."
    en: "Body of appeal in a dispute with a supplier or a network operator, after a prior written step; the federal service handles the contract and the price, the regional services the meter and the network."
    de: "Beschwerdestelle bei Streitigkeiten mit einem Lieferanten oder Netzbetreiber, nach vorherigem schriftlichem Schritt; der föderale Dienst behandelt Vertrag und Preis, die regionalen Dienste Zähler und Netz."
    nl: "Beroepsinstantie bij een geschil met een leverancier of netbeheerder, na een voorafgaande schriftelijke stap; de federale dienst behandelt het contract en de prijs, de gewestelijke diensten de meter en het net."
  alias:
    fr: ["médiateur de l'énergie", "SRME"]
    en: ["energy ombudsman", "SRME"]
    de: ["Energie-Ombudsstelle", "SRME"]
    nl: ["energieombudsman", "SRME"]

- slug: membre
  categorie: gouvernance
  tags: [membres, participation, communaute]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/communautes-denergie"
  terme:
    fr: "Membre"
    en: "Member"
    de: "Mitglied"
    nl: "Lid"
  definition:
    fr: "Personne ou entité qui adhère à une communauté d'énergie et participe à sa gouvernance. Les directives européennes réservent le contrôle effectif aux personnes physiques, autorités locales et petites entreprises."
    en: "A person or entity that joins an energy community and takes part in its governance. The European directives reserve effective control to natural persons, local authorities and small enterprises."
    de: "Person oder Einrichtung, die einer Energiegemeinschaft beitritt und an ihrer Governance teilnimmt. Die europäischen Richtlinien behalten die tatsächliche Kontrolle natürlichen Personen, lokalen Behörden und Kleinunternehmen vor."
    nl: "Persoon of entiteit die toetreedt tot een energiegemeenschap en deelneemt aan haar bestuur. De Europese richtlijnen behouden de daadwerkelijke zeggenschap voor aan natuurlijke personen, lokale overheden en kleine ondernemingen."
  alias:
    fr: ["participant"]
    en: ["participant"]
    de: ["Teilnehmer"]
    nl: ["deelnemer"]

- slug: mix-residuel
  categorie: marche
  tags: [tracabilite, fournisseur, marche]
  source_nom: "Association of Issuing Bodies"
  source_url: "https://www.aib-net.org/facts/european-residual-mix"
  terme:
    fr: "Mix résiduel"
    en: "Residual mix"
    de: "Residualmix"
    nl: "Residuele mix"
  definition:
    fr: "Composition de l'électricité qu'aucune garantie d'origine ne revendique, une fois que tous les détenteurs ont retiré la leur. C'est le mix attribué par défaut à un client sans offre verte : 18,07 % de renouvelable en Belgique en 2024, contre 49,38 % dans le mix de fourniture wallon."
    en: "The composition of the electricity that no guarantee of origin claims, once every holder has withdrawn theirs. It is the mix assigned by default to a customer without a green offer: 18.07 % renewable in Belgium in 2024, against 49.38 % in the Walloon supply mix."
    de: "Zusammensetzung des Stroms, den kein Herkunftsnachweis beansprucht, nachdem alle Inhaber den ihren entnommen haben. Es ist der Mix, der einem Kunden ohne Ökostromangebot standardmäßig zugewiesen wird: 18,07 % erneuerbar in Belgien im Jahr 2024, gegenüber 49,38 % im wallonischen Liefermix."
    nl: "Samenstelling van de elektriciteit die door geen enkele garantie van oorsprong wordt opgeëist, nadat alle houders de hunne hebben weggenomen. Het is de mix die standaard wordt toegewezen aan een klant zonder groen aanbod: 18,07 % hernieuwbaar in België in 2024, tegenover 49,38 % in de Waalse leveringsmix."
  alias:
    fr: ["mix résiduel belge"]
    en: ["Belgian residual mix"]
    de: ["belgischer Residualmix"]
    nl: ["Belgische residuele mix"]
- slug: notification
  categorie: reglementaire
  tags: [conformite, declaration, belgique]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/secteur/communautes-partage-energie"
  terme:
    fr: "Notification"
    en: "Notification"
    de: "Meldung"
    nl: "Kennisgeving"
  definition:
    fr: "Déclaration préalable adressée au régulateur avant le démarrage d'une opération de partage. En Wallonie, la CWaPE en accuse réception, ce qui conditionne le lancement effectif du partage avec le GRD."
    en: "Prior declaration filed with the regulator before a sharing operation starts. In Wallonia, CWaPE acknowledges receipt, and that acknowledgement conditions the actual launch of sharing with the grid operator."
    de: "Vorherige Meldung an den Regulator vor dem Start einer Teilungsoperation. In der Wallonie bestätigt die CWaPE den Eingang; diese Bestätigung ist Voraussetzung für den tatsächlichen Start der Teilung mit dem Netzbetreiber."
    nl: "Voorafgaande melding aan de regulator vóór de start van een deelactie. In Wallonië bevestigt de CWaPE de ontvangst, en die bevestiging is voorwaarde voor de effectieve start van het delen met de netbeheerder."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: onduleur
  categorie: technique
  tags: [photovoltaique, materiel, puissance]
  source_nom: Énergie Commune
  source_url: "https://sifpv.energiecommune.be/"
  terme:
    fr: "Onduleur"
    en: "Inverter"
    de: "Wechselrichter"
    nl: "Omvormer"
  definition:
    fr: "Appareil qui convertit le courant continu produit par les panneaux photovoltaïques en courant alternatif utilisable. Sa puissance en kWe constitue la puissance nette développable, base de calcul du tarif prosumer wallon ; il se remplace généralement vers la douzième année."
    en: "The device that converts the direct current produced by solar panels into usable alternating current. Its rating in kWe is the net deliverable capacity used to compute the Walloon prosumer tariff; it is usually replaced around year twelve."
    de: "Gerät, das den von den Photovoltaikmodulen erzeugten Gleichstrom in nutzbaren Wechselstrom umwandelt. Seine Leistung in kWe bildet die netto verfügbare Leistung, Berechnungsgrundlage des wallonischen Prosumer-Tarifs; er wird meist um das zwölfte Jahr ersetzt."
    nl: "Toestel dat de door de fotovoltaïsche panelen geproduceerde gelijkstroom omzet in bruikbare wisselstroom. Zijn vermogen in kWe vormt het netto ontwikkelbaar vermogen, de rekenbasis van het Waalse prosumententarief; hij wordt meestal rond het twaalfde jaar vervangen."
  alias:
    fr: ["convertisseur"]
    en: ["solar inverter"]
    de: ["Solarwechselrichter"]
    nl: ["invertor"]

- slug: pair-a-pair
  categorie: partage
  tags: [partage, voisinage, bilateral]
  source_nom: Brugel
  source_url: "https://energysharing.brugel.brussels/energysharing/partage-d-energie-540"
  terme:
    fr: "Pair-à-pair"
    en: "Peer-to-peer"
    de: "Peer-to-Peer"
    nl: "Peer-to-peer"
  definition:
    fr: "Partage d'électricité entre deux points de fourniture seulement, par exemple entre deux voisins, sans créer de personne morale. Opérationnel à Bruxelles et en Flandre ; prévu par le décret wallon depuis 2022 mais toujours inopérant faute d'arrêté d'exécution."
    en: "Electricity sharing between two supply points only, for instance between two neighbours, without creating a legal entity. Operational in Brussels and Flanders; provided for by the Walloon decree since 2022 but still inoperative for lack of an implementing order."
    de: "Stromteilung zwischen nur zwei Lieferstellen, etwa zwischen zwei Nachbarn, ohne Gründung einer juristischen Person. In Brüssel und Flandern in Betrieb; im wallonischen Dekret seit 2022 vorgesehen, mangels Ausführungserlass jedoch weiterhin außer Betrieb."
    nl: "Elektriciteit delen tussen slechts twee leveringspunten, bijvoorbeeld tussen twee buren, zonder een rechtspersoon op te richten. Operationeel in Brussel en Vlaanderen; sinds 2022 voorzien in het Waalse decreet maar nog steeds niet operationeel bij gebrek aan een uitvoeringsbesluit."
  alias:
    fr: ["peer-to-peer", "partage de pair à pair"]
    en: ["P2P sharing"]
    de: ["Peer-to-Peer-Teilung"]
    nl: ["peer-to-peerdelen"]

- slug: partage-d-energie
  categorie: partage
  tags: [partage, communaute, collectif]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6092"
  terme:
    fr: "Partage d'énergie"
    en: "Energy sharing"
    de: "Energieteilung"
    nl: "Energiedeling"
  definition:
    fr: "Répartition de l'électricité produite localement entre les participants d'une communauté ou d'un même bâtiment. C'est une opération administrative et tarifaire : les électrons continuent de circuler normalement sur le réseau."
    en: "Splitting locally generated electricity between the participants of a community or a single building. It is an administrative and tariff operation: the electrons keep flowing across the grid exactly as before."
    de: "Aufteilung des lokal erzeugten Stroms unter den Teilnehmern einer Gemeinschaft oder eines Gebäudes. Es handelt sich um einen administrativen und tariflichen Vorgang: Die Elektronen fließen weiterhin normal über das Netz."
    nl: "Verdeling van lokaal opgewekte elektriciteit onder de deelnemers van een gemeenschap of één gebouw. Het is een administratieve en tarifaire operatie: de elektronen blijven gewoon over het net stromen."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: partage-d-operation
  categorie: technique
  tags: [partage, operation, processus]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6092"
  terme:
    fr: "Partage d'opération"
    en: "Sharing operation"
    de: "Aufteilungsvorgang"
    nl: "Deelverrichting"
  definition:
    fr: "Opération par laquelle l'énergie est répartie entre les participants d'un même partage."
    en: "The operation by which energy is distributed among the participants of a given sharing scheme."
    de: "Vorgang, durch den Energie unter den Teilnehmern einer Aufteilung verteilt wird."
    nl: "Verrichting waarbij energie wordt verdeeld onder de deelnemers van eenzelfde deling."
  alias:
    fr: ["partage d'opération"]
    en: []
    de: []
    nl: []

- slug: participant
  categorie: gouvernance
  tags: [membres, partage, communaute]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6092"
  terme:
    fr: "Participant"
    en: "Participant"
    de: "Teilnehmer"
    nl: "Deelnemer"
  definition:
    fr: "Personne ou entité dont le point de fourniture est inclus dans une opération de partage. Être participant ne suppose pas nécessairement d'être membre de la structure juridique qui porte la communauté."
    en: "A person or entity whose supply point is included in a sharing operation. Being a participant does not necessarily mean being a member of the legal structure behind the community."
    de: "Person oder Einrichtung, deren Lieferstelle in eine Teilungsoperation einbezogen ist. Teilnehmer zu sein bedeutet nicht zwingend, Mitglied der tragenden Rechtsperson der Gemeinschaft zu sein."
    nl: "Persoon of entiteit van wie het leveringspunt in een deelactie is opgenomen. Deelnemer zijn betekent niet noodzakelijk lid zijn van de rechtspersoon die de gemeenschap draagt."
  alias:
    fr: ["membre"]
    en: ["member"]
    de: ["Mitglied"]
    nl: ["lid"]

- slug: personne-morale
  categorie: juridique
  tags: [structure, droit, communaute]
  source_nom: "Bruxelles Environnement"
  source_url: "https://environnement.brussels/media/12676/download?inline"
  terme:
    fr: "Personne morale"
    en: "Legal entity"
    de: "Juristische Person"
    nl: "Rechtspersoon"
  definition:
    fr: "Entité juridique constituée, obligatoire pour porter une communauté d'énergie : les directives européennes l'exigent explicitement. En pratique, ASBL et coopérative sont les formes les plus courantes en Belgique."
    en: "A constituted legal entity, mandatory to host an energy community: the European directives require it explicitly. In practice, the non-profit association and the cooperative are the commonest forms in Belgium."
    de: "Gegründete Rechtsperson, zwingend erforderlich für eine Energiegemeinschaft — die europäischen Richtlinien verlangen dies ausdrücklich. In der Praxis sind Verein und Genossenschaft die häufigsten Formen in Belgien."
    nl: "Opgerichte rechtspersoon, verplicht om een energiegemeenschap te dragen: de Europese richtlijnen eisen dat uitdrukkelijk. In de praktijk zijn de vzw en de coöperatie de meest voorkomende vormen in België."
  alias:
    fr: []
    en: ["legal person"]
    de: []
    nl: []

- slug: photovoltaique
  categorie: production
  tags: [production, solaire, technologie]
  source_nom: Renouvelle
  source_url: "https://www.renouvelle.be/fr/faits-chiffres/observatoire-photovoltaique/"
  terme:
    fr: "Photovoltaïque"
    en: "Photovoltaic"
    de: "Photovoltaik"
    nl: "Fotovoltaïsch"
  definition:
    fr: "Technologie qui convertit directement le rayonnement solaire en électricité. Elle fournit l'essentiel de l'énergie partagée en Belgique, avec un parc de 12,8 GWc fin 2025 pour plus de 10 TWh produits."
    en: "The technology that converts solar radiation directly into electricity. It supplies most of the energy shared in Belgium, with a fleet of 12.8 GWp at the end of 2025 generating more than 10 TWh."
    de: "Technologie, die Sonnenstrahlung unmittelbar in Elektrizität umwandelt. Sie liefert den Großteil der in Belgien geteilten Energie, mit einem Anlagenpark von 12,8 GWp Ende 2025 und mehr als 10 TWh Erzeugung."
    nl: "Technologie die zonnestraling rechtstreeks omzet in elektriciteit. Ze levert het grootste deel van de in België gedeelde energie, met een park van 12,8 GWp eind 2025 en meer dan 10 TWh productie."
  alias:
    fr: ["panneaux solaires", "panneau solaire", "panneau photovoltaïque"]
    en: ["solar panels", "solar panel", "solar photovoltaic"]
    de: ["Solaranlage", "Solarmodul", "Photovoltaikanlage"]
    nl: ["zonnepanelen", "zonnepaneel", "fotovoltaïsche installatie"]

- slug: point-de-fourniture
  categorie: reseau
  tags: [contrat, point, livraison]
  source_nom: Coretec
  source_url: "https://coretec.be/lexique/"
  terme:
    fr: "Point de fourniture"
    en: "Supply point"
    de: "Lieferstelle"
    nl: "Leveringspunt"
  definition:
    fr: "Point contractuel de livraison de l'énergie, identifié par un code EAN unique. C'est l'unité de base d'une opération de partage : la clé de répartition s'applique par point de fourniture, pas par personne."
    en: "The contractual delivery point for energy, identified by a unique EAN code. It is the base unit of a sharing operation: the allocation key applies per supply point, not per person."
    de: "Vertraglicher Lieferpunkt für Energie, identifiziert durch einen eindeutigen EAN-Code. Er ist die Grundeinheit einer Teilungsoperation: Der Aufteilungsschlüssel gilt je Lieferstelle, nicht je Person."
    nl: "Contractueel leveringspunt voor energie, geïdentificeerd door een unieke EAN-code. Het is de basiseenheid van een deelactie: de verdeelsleutel geldt per leveringspunt, niet per persoon."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: precarite-energetique
  categorie: reglementaire
  tags: [social, belgique, indicateur]
  source_nom: "SPF Economie"
  source_url: "https://economie.fgov.be/fr/themes/energie/energie-sociale/indicateurs-de-precarite"
  terme:
    fr: "Précarité énergétique"
    en: "Energy poverty"
    de: "Energiearmut"
    nl: "Energiearmoede"
  definition:
    fr: "Situation d'un ménage qui rencontre des difficultés particulières, dans son logement, à satisfaire ses besoins élémentaires en énergie. L'arrêté royal du 19 avril 2024 en fixe trois indicateurs officiels, calculés sur l'enquête SILC de Statbel : la précarité mesurée (poids excessif de la facture dans le revenu), cachée (consommation anormalement basse, signe de restriction) et ressentie (difficulté déclarée à chauffer correctement)."
    en: "The situation of a household that faces particular difficulty, in its home, in meeting its basic energy needs. The Royal Decree of 19 April 2024 sets three official indicators, computed on Statbel's SILC survey: measured poverty (an excessive share of income spent on energy), hidden poverty (abnormally low consumption, a sign of self-restriction) and perceived poverty (self-declared difficulty keeping the home warm)."
    de: "Lage eines Haushalts, der in seiner Wohnung besondere Schwierigkeiten hat, seinen elementaren Energiebedarf zu decken. Der Königliche Erlass vom 19. April 2024 legt drei offizielle Indikatoren fest, berechnet auf der SILC-Erhebung von Statbel: die gemessene Armut (übermäßiger Einkommensanteil für Energie), die verdeckte Armut (auffällig niedriger Verbrauch als Zeichen der Einschränkung) und die empfundene Armut (selbst erklärte Schwierigkeit, angemessen zu heizen)."
    nl: "Situatie van een gezin dat in zijn woning bijzondere moeilijkheden ondervindt om in zijn elementaire energiebehoeften te voorzien. Het koninklijk besluit van 19 april 2024 legt drie officiële indicatoren vast, berekend op de SILC-enquête van Statbel: de gemeten armoede (buitensporig aandeel van het inkomen voor energie), de verborgen armoede (abnormaal laag verbruik, teken van zelfbeperking) en de ervaren armoede (zelf verklaarde moeilijkheid om behoorlijk te verwarmen)."
  alias:
    fr: ["pauvreté énergétique"]
    en: ["fuel poverty"]
    de: ["energetische Armut"]
    nl: ["energie-armoede"]

- slug: prime-habitation
  categorie: reglementaire
  tags: [prime, renovation, wallonie, logement]
  source_nom: "SPW Logement"
  source_url: "https://logement.wallonie.be/fr/aide/primes-habitation-2025"
  terme:
    fr: "Prime Habitation"
    en: "Habitation grant"
    de: "Wohnungsprämie"
    nl: "Woonpremie"
  definition:
    fr: "Aide régionale wallonne à la rénovation du logement, conditionnée à un audit logement préalable. Le régime de soutien temporaire court jusqu'au 30 septembre 2026 ; un nouveau régime articulé autour du Rénopack et du Rénoprêt doit prendre le relais au 1er octobre 2026."
    en: "Walloon regional support for home renovation, conditional on a prior housing audit. The temporary support scheme runs until 30 September 2026; a new scheme built around the Rénopack and Rénoprêt is due to take over on 1 October 2026."
    de: "Wallonische Regionalbeihilfe für die Wohnungsrenovierung, die ein vorheriges Wohnungsaudit voraussetzt. Die befristete Förderregelung läuft bis zum 30. September 2026; eine neue Regelung rund um Rénopack und Rénoprêt soll am 1. Oktober 2026 übernehmen."
    nl: "Waalse gewestelijke steun voor woningrenovatie, afhankelijk van een voorafgaande woningaudit. De tijdelijke steunregeling loopt tot 30 september 2026; een nieuwe regeling rond de Rénopack en de Rénoprêt zou het op 1 oktober 2026 moeten overnemen."
  alias:
    fr: ["primes Habitation"]
    en: ["Habitation grants"]
    de: ["Wohnungsprämien"]
    nl: ["woonpremies"]

- slug: prix-de-cession-interne
  categorie: facturation
  tags: [prix, partage, contrat]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6063"
  terme:
    fr: "Prix de cession interne"
    en: "Internal transfer price"
    de: "Interner Verrechnungspreis"
    nl: "Interne overdrachtsprijs"
  definition:
    fr: "Prix au kWh auquel l'électricité partagée est cédée entre membres d'une communauté d'énergie ; il ne porte que sur la composante énergie, hors frais de réseau et taxes."
    en: "Price per kWh at which shared electricity is transferred between members of an energy community; it covers the energy component only, excluding network fees and taxes."
    de: "Preis pro kWh, zu dem geteilter Strom zwischen Mitgliedern einer Energiegemeinschaft abgegeben wird; er betrifft nur die Energiekomponente, ohne Netzentgelte und Steuern."
    nl: "Prijs per kWh waartegen gedeelde elektriciteit tussen leden van een energiegemeenschap wordt overgedragen; hij betreft alleen de energiecomponent, exclusief netkosten en taksen."
  alias:
    fr: ["prix de l'électricité partagée", "prix interne", "prix de l'énergie partagée"]
    en: ["internal price", "shared energy price"]
    de: ["interner Preis", "Preis der geteilten Energie"]
    nl: ["interne prijs", "prijs van de gedeelde energie"]

- slug: productible
  categorie: production
  tags: [photovoltaique, production, calcul]
  source_nom: Énergie Commune
  source_url: "https://sifpv.energiecommune.be/"
  terme:
    fr: "Productible"
    en: "Specific yield"
    de: "Spezifischer Ertrag"
    nl: "Specifieke opbrengst"
  definition:
    fr: "Énergie qu'une installation photovoltaïque produit en un an par unité de puissance installée, exprimée en kWh/kWc. En Wallonie, l'ordre de grandeur retenu est de 950 à 1 000 kWh/kWc par an pour une toiture plein sud inclinée à 35° et non ombragée."
    en: "The energy a solar installation produces in a year per unit of installed capacity, expressed in kWh/kWp. In Wallonia the accepted order of magnitude is 950 to 1,000 kWh/kWp a year for an unshaded, due-south roof at 35°."
    de: "Energie, die eine Photovoltaikanlage in einem Jahr je Einheit installierter Leistung erzeugt, ausgedrückt in kWh/kWp. In Wallonien gilt als Größenordnung 950 bis 1.000 kWh/kWp pro Jahr für ein unverschattetes, nach Süden ausgerichtetes Dach mit 35° Neigung."
    nl: "Energie die een fotovoltaïsche installatie in een jaar produceert per eenheid geïnstalleerd vermogen, uitgedrukt in kWh/kWp. In Wallonië geldt als orde van grootte 950 tot 1.000 kWh/kWp per jaar voor een onbeschaduwd dak pal zuid met een helling van 35°."
  alias:
    fr: ["productivité annuelle", "kWh/kWc"]
    en: ["annual yield", "kWh/kWp"]
    de: ["Jahresertrag", "kWh/kWp"]
    nl: ["jaaropbrengst", "kWh/kWp"]

- slug: prosumer
  categorie: production
  tags: [photovoltaique, production, wallonie]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/compensation-avant-0101"
  terme:
    fr: "Prosumer"
    en: "Prosumer"
    de: "Prosumer"
    nl: "Prosument"
  definition:
    fr: "Utilisateur qui consomme et produit de l'électricité sur le même point de fourniture, typiquement un ménage équipé de panneaux photovoltaïques. En Wallonie, ce statut déclenche le tarif prosumer et détermine le régime applicable au surplus injecté."
    en: "A user who both consumes and produces electricity at the same supply point, typically a household with solar panels. In Wallonia this status triggers the prosumer tariff and determines the regime applying to the injected surplus."
    de: "Nutzer, der am selben Lieferpunkt Strom verbraucht und erzeugt, typischerweise ein Haushalt mit Photovoltaikanlage. In Wallonien löst dieser Status den Prosumer-Tarif aus und bestimmt die für den eingespeisten Überschuss geltende Regelung."
    nl: "Gebruiker die op hetzelfde leveringspunt elektriciteit verbruikt en produceert, typisch een gezin met zonnepanelen. In Wallonië activeert dit statuut het prosumententarief en bepaalt het welk stelsel op het geïnjecteerde overschot van toepassing is."
  alias:
    fr: ["prosommateur", "prosumers"]
    en: ["prosumers"]
    de: ["Prosument", "Prosumenten"]
    nl: ["prosumenten", "prosumer"]

- slug: puissance-nette-developpable
  categorie: reseau
  tags: [photovoltaique, puissance, tarif]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/148"
  terme:
    fr: "Puissance nette développable"
    en: "Net deliverable capacity"
    de: "Netto verfügbare Leistung"
    nl: "Netto ontwikkelbaar vermogen"
  definition:
    fr: "Puissance électrique maximale qu'une installation peut injecter sur le réseau, en pratique celle de l'onduleur exprimée en kWe. Elle sert de base au calcul du tarif prosumer forfaitaire en Wallonie — et non la puissance crête des panneaux exprimée en kWc."
    en: "The maximum electrical capacity an installation can inject into the grid, in practice that of the inverter expressed in kWe. It is the basis for computing the flat prosumer tariff in Wallonia — not the peak capacity of the panels expressed in kWp."
    de: "Maximale elektrische Leistung, die eine Anlage ins Netz einspeisen kann, in der Praxis die des Wechselrichters in kWe. Sie ist die Berechnungsgrundlage des pauschalen Prosumer-Tarifs in Wallonien — nicht die Spitzenleistung der Module in kWp."
    nl: "Maximaal elektrisch vermogen dat een installatie op het net kan injecteren, in de praktijk dat van de omvormer uitgedrukt in kWe. Het vormt de rekenbasis van het forfaitaire prosumententarief in Wallonië — en niet het piekvermogen van de panelen in kWp."
  alias:
    fr: ["puissance développable"]
    en: ["net developable power"]
    de: ["netto entwickelbare Leistung"]
    nl: ["ontwikkelbaar vermogen"]

- slug: quart-d-heure
  categorie: mesure
  tags: [data, mesure, calcul]
