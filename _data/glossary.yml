    de: "Viertelstunde"
    nl: "Kwartier"
  definition:
    fr: "Unité de mesure de 15 minutes utilisée dans le calcul du partage."
    en: "A 15-minute measurement interval used to calculate energy sharing."
    de: "15-Minuten-Messintervall, das zur Berechnung der Aufteilung verwendet wird."
    nl: "Meetinterval van 15 minuten dat wordt gebruikt om de deling te berekenen."
  alias:
    fr: ["quart horaire"]
    en: ["quarter-hourly", "15-minute interval"]
    de: ["Viertelstundenwert"]
    nl: ["kwartierwaarde"]

- slug: recharge-bidirectionnelle
  categorie: technique
  tags: [vehicule, stockage, flexibilite]
  source_nom: OptimCE
  source_ref: about
  terme:
    fr: "Recharge bidirectionnelle"
    en: "Bidirectional charging"
    de: "Bidirektionales Laden"
    nl: "Bidirectioneel laden"
  definition:
    fr: "Capacité d'un véhicule électrique à restituer l'énergie de sa batterie vers le logement (V2H) ou vers le réseau (V2G). En Belgique en 2026, l'offre reste marginale : bornes bidirectionnelles à 4 000-8 000 €, peu de modèles compatibles et cadre normatif de raccordement non stabilisé."
    en: "The ability of an electric vehicle to return energy from its battery to the home (V2H) or to the grid (V2G). In Belgium in 2026 the offering remains marginal: bidirectional charge points at €4,000-8,000, few compatible models and an unsettled connection standards framework."
    de: "Fähigkeit eines Elektrofahrzeugs, Energie aus seiner Batterie an das Haus (V2H) oder das Netz (V2G) zurückzugeben. In Belgien bleibt das Angebot 2026 marginal: bidirektionale Ladestationen für 4.000-8.000 €, wenige kompatible Modelle und ein nicht stabilisierter normativer Anschlussrahmen."
    nl: "Het vermogen van een elektrisch voertuig om energie uit zijn batterij terug te geven aan de woning (V2H) of aan het net (V2G). In België blijft het aanbod in 2026 marginaal: bidirectionele laadpalen aan 4.000-8.000 €, weinig compatibele modellen en een niet-gestabiliseerd normatief aansluitkader."
  alias:
    fr: ["V2G", "V2H", "vehicle-to-grid", "vehicle-to-home"]
    en: ["V2G", "V2H", "vehicle-to-grid", "vehicle-to-home"]
    de: ["V2G", "V2H", "vehicle-to-grid", "vehicle-to-home"]
    nl: ["V2G", "V2H", "vehicle-to-grid", "vehicle-to-home"]

- slug: redevance-fixe
  categorie: facturation
  tags: [facture, contrat, prix]
  source_nom: Test-Achats
  source_url: "https://www.test-achats.be/maison-energie/gaz-electricite-mazout-pellets/news/calcul-redevance-fixe-changement-fournisseur-energie"
  terme:
    fr: "Redevance fixe"
    en: "Standing charge"
    de: "Grundgebühr"
    nl: "Vaste vergoeding"
  definition:
    fr: "Montant forfaitaire annuel facturé par le fournisseur indépendamment des kWh consommés ; il doit être calculé au prorata de la durée réelle de fourniture."
    en: "Flat annual amount charged by the supplier regardless of the kWh consumed; it must be pro-rated to the actual duration of supply."
    de: "Pauschaler Jahresbetrag, den der Lieferant unabhängig von den verbrauchten kWh berechnet; er ist anteilig zur tatsächlichen Lieferdauer zu berechnen."
    nl: "Forfaitair jaarbedrag dat de leverancier aanrekent los van de verbruikte kWh; het moet pro rata van de werkelijke leveringsduur worden berekend."
  alias:
    fr: ["terme fixe"]
    en: ["fixed fee", "standing fee"]
    de: ["fester Term", "Grundpreis"]
    nl: ["vaste term"]

- slug: representant-du-partage
  categorie: partage
  tags: [partage, facturation, acteur]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6059"
  terme:
    fr: "Représentant du partage"
    en: "Sharing representative"
    de: "Vertreter der Energieteilung"
    nl: "Vertegenwoordiger van het energiedelen"
  definition:
    fr: "Personne ou structure désignée dans la convention pour organiser le partage et facturer l'énergie partagée aux participants, sur base des données du gestionnaire de réseau."
    en: "Person or entity designated in the agreement to organise the sharing and invoice the shared energy to participants, based on the grid operator's data."
    de: "Person oder Struktur, die in der Vereinbarung benannt wird, um die Teilung zu organisieren und den Teilnehmern die geteilte Energie auf der Grundlage der Daten des Netzbetreibers in Rechnung zu stellen."
    nl: "Persoon of structuur die in de overeenkomst wordt aangeduid om het delen te organiseren en de gedeelde energie aan de deelnemers te factureren, op basis van de gegevens van de netbeheerder."
  alias:
    fr: ["représentant du partage d'énergie", "représentant de partage"]
    en: ["energy sharing representative"]
    de: ["Teilungsvertreter"]
    nl: ["deelvertegenwoordiger"]

- slug: routeur-solaire
  categorie: technique
  tags: [autoconsommation, eau-chaude, surplus]
  source_nom: OptimCE
  source_ref: about
  terme:
    fr: "Routeur solaire"
    en: "Solar diverter"
    de: "Solarrouter"
    nl: "Zonnerouter"
  definition:
    fr: "Dispositif qui mesure en continu l'électricité sur le point de partir vers le réseau et la redirige vers une charge résistive, le plus souvent le ballon d'eau chaude, watt par watt. Compté de 400 à 900 € posé, c'est le moyen le moins cher d'absorber un surplus photovoltaïque."
    en: "A device that continuously measures the electricity about to leave for the grid and redirects it to a resistive load, most often the hot-water tank, watt by watt. At €400 to €900 installed, it is the cheapest way to absorb a solar surplus."
    de: "Gerät, das laufend den Strom misst, der ins Netz abfließen würde, und ihn watt-genau auf einen Widerstandsverbraucher umleitet, meist den Warmwasserspeicher. Montiert für 400 bis 900 € ist es der günstigste Weg, einen Solarüberschuss aufzunehmen."
    nl: "Toestel dat doorlopend meet welke elektriciteit naar het net dreigt te vertrekken en die watt per watt omleidt naar een weerstandsverbruiker, meestal de warmwaterboiler. Geplaatst voor 400 tot 900 € is het de goedkoopste manier om een zonne-overschot op te nemen."
  alias:
    fr: ["dévieur de surplus", "délesteur solaire", "routeur photovoltaïque"]
    en: ["power diverter", "surplus diverter"]
    de: ["Überschussregler", "Solar-Router"]
    nl: ["overschotsturing", "zonne-router"]

- slug: sibelga
  categorie: reseau
  tags: [bruxelles, grd, reseau]
  source_nom: Sibelga
  source_url: "https://www.sibelga.be/"
  terme:
    fr: "Sibelga"
    en: "Sibelga"
    de: "Sibelga"
    nl: "Sibelga"
  definition:
    fr: "Gestionnaire du réseau de distribution d'électricité et de gaz pour les dix-neuf communes bruxelloises. Il relève les compteurs et applique les méthodes de répartition validées par BRUGEL."
    en: "The electricity and gas distribution operator for the nineteen Brussels municipalities. It reads the meters and applies the allocation methods approved by BRUGEL."
    de: "Verteilnetzbetreiber für Strom und Gas in den neunzehn Brüsseler Gemeinden. Er liest die Zähler aus und wendet die von BRUGEL genehmigten Aufteilungsmethoden an."
    nl: "Distributienetbeheerder voor elektriciteit en gas in de negentien Brusselse gemeenten. Hij leest de meters uit en past de door BRUGEL goedgekeurde verdeelmethodes toe."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: simultaneite
  categorie: mesure
  tags: [quart-d-heure, partage, mesure]
  source_nom: ORES
  source_url: "https://www.ores.be/faq/partage-denergie"
  terme:
    fr: "Simultanéité"
    en: "Simultaneity"
    de: "Gleichzeitigkeit"
    nl: "Gelijktijdigheid"
  definition:
    fr: "Règle qui conditionne le partage d'énergie : seule est répartie l'électricité produite, injectée sur le réseau local et consommée au cours d'un même quart d'heure. Elle interdit tout report d'un créneau sur le suivant — ce qui n'est pas absorbé dans le quart d'heure sort du partage et retombe en injection."
    en: "The rule that governs energy sharing: only electricity produced, injected into the local network and consumed within the same quarter hour is allocated. It forbids any carry-over from one slot to the next — whatever is not absorbed within the quarter hour leaves the sharing arrangement and falls back to injection."
    de: "Regel, die das Energieteilen bestimmt: Aufgeteilt wird nur Strom, der erzeugt, in das lokale Netz eingespeist und innerhalb derselben Viertelstunde verbraucht wird. Sie verbietet jede Übertragung von einem Zeitfenster auf das nächste — was in der Viertelstunde nicht aufgenommen wird, verlässt die Teilung und fällt auf Einspeisung zurück."
    nl: "Regel die het energiedelen bepaalt: alleen stroom die wordt geproduceerd, in het lokale net geïnjecteerd en binnen hetzelfde kwartier verbruikt, wordt verdeeld. Zij verbiedt elke overdracht van het ene tijdvak naar het volgende — wat niet binnen het kwartier wordt opgenomen, verlaat het delen en valt terug op injectie."
  alias:
    fr: ["règle de simultanéité", "concomitance"]
    en: ["simultaneity rule", "concurrency"]
    de: ["Gleichzeitigkeitsregel", "Zeitgleichheit"]
    nl: ["gelijktijdigheidsregel", "tijdsgelijkheid"]

- slug: stockage
  categorie: production
  tags: [batterie, flexibilite, energie]
  source_nom: OptimCE
  source_ref: about
  terme:
    fr: "Stockage"
    en: "Storage"
    de: "Speicherung"
    nl: "Opslag"
  definition:
    fr: "Conservation temporaire de l'énergie, le plus souvent par batterie, pour la restituer à un autre moment. Il augmente le taux d'autoconsommation en décalant la consommation vers les heures de production."
    en: "Temporarily holding energy, most often in a battery, to release it later. It raises the self-consumption rate by shifting consumption towards the hours when generation happens."
    de: "Zeitweiliges Speichern von Energie, meist per Batterie, um sie später wieder abzugeben. Es erhöht die Eigenverbrauchsquote, indem der Verbrauch in die Erzeugungsstunden verschoben wird."
    nl: "Tijdelijk bewaren van energie, meestal in een batterij, om ze later vrij te geven. Het verhoogt de zelfverbruiksgraad door verbruik te verschuiven naar de productie-uren."
  alias:
    fr: ["batterie"]
    en: ["battery"]
    de: ["Batterie", "Speicher"]
    nl: ["batterij"]

- slug: surplus
  categorie: autoconsommation
  tags: [production, injection, vente]
  source_nom: "Ministère de la Transition écologique"
  source_url: "https://www.ecologie.gouv.fr/politiques-publiques/systemes-dautoconsommation"
  terme:
    fr: "Surplus"
    en: "Surplus"
    de: "Überschuss"
    nl: "Overschot"
  definition:
    fr: "Électricité produite mais non consommée sur place, pouvant être injectée ou vendue."
    en: "Electricity that is generated but not consumed on site, which can be injected into the grid or sold."
    de: "Strom, der erzeugt, aber nicht vor Ort verbraucht wird und ins Netz eingespeist oder verkauft werden kann."
    nl: "Elektriciteit die wordt opgewekt maar niet ter plaatse verbruikt, en die kan worden geïnjecteerd of verkocht."
  alias:
    fr: ["surplus de production"]
    en: ["production surplus"]
    de: ["Produktionsüberschuss"]
    nl: ["productieoverschot"]

- slug: surplus-injecte
  categorie: autoconsommation
  tags: [surplus, injection, reseau]
  source_nom: Service-public
  source_url: "https://www.service-public.gouv.fr/particuliers/actualites/A18205"
  terme:
    fr: "Surplus injecté"
    en: "Injected surplus"
    de: "Eingespeister Überschuss"
    nl: "Geïnjecteerd overschot"
  definition:
    fr: "Part du surplus de production effectivement envoyée au réseau après consommation locale et partage. Le réduire est l'objectif direct d'une bonne clé de répartition, car il est valorisé bien moins cher."
    en: "The portion of surplus generation actually sent to the grid after local consumption and sharing. Reducing it is the direct aim of a good allocation key, since it earns far less than a consumed kWh."
    de: "Der Teil des Erzeugungsüberschusses, der nach lokalem Verbrauch und Teilung tatsächlich ins Netz geht. Ihn zu senken ist das direkte Ziel eines guten Aufteilungsschlüssels, denn er wird deutlich schlechter vergütet."
    nl: "Het deel van het productieoverschot dat na lokaal verbruik en delen effectief naar het net gaat. Het verlagen ervan is het rechtstreekse doel van een goede verdeelsleutel, want het levert veel minder op."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: syndic
  categorie: gouvernance
  tags: [copropriete, mandat, representant, belgique]
  source_nom: IPI
  source_url: "https://www.ipi.be/media/1462/download?inline=1"
  terme:
    fr: "Syndic"
    en: "Managing agent"
    de: "Verwalter"
    nl: "Syndicus"
  definition:
    fr: "Mandataire qui exécute les décisions de l'assemblée générale et gère l'immeuble au quotidien. Son mandat ne peut excéder trois ans et, sauf décision expresse de l'assemblée, il ne peut souscrire aucun engagement au-delà de ce terme — un point décisif pour une convention de partage à durée indéterminée."
    en: "Agent who carries out the decisions of the general meeting and runs the building day to day. The mandate may not exceed three years and, unless the meeting expressly decides otherwise, no commitment may be entered into beyond that term — a decisive point for an open-ended sharing agreement."
    de: "Beauftragter, der die Beschlüsse der Eigentümerversammlung ausführt und das Gebäude täglich verwaltet. Sein Mandat darf drei Jahre nicht überschreiten, und vorbehaltlich eines ausdrücklichen Beschlusses der Versammlung darf er keine Verpflichtung über diese Frist hinaus eingehen — entscheidend für eine unbefristete Teilungsvereinbarung."
    nl: "Lasthebber die de beslissingen van de algemene vergadering uitvoert en het gebouw dagelijks beheert. Zijn mandaat mag niet langer duren dan drie jaar en, behoudens uitdrukkelijke beslissing van de vergadering, mag hij geen verbintenis aangaan die die termijn overschrijdt — beslissend voor een deelovereenkomst van onbepaalde duur."
  alias:
    fr: ["syndic de copropriété"]
    en: ["property manager", "syndic"]
    de: ["Hausverwalter", "Syndikus"]
    nl: ["syndicus van de mede-eigendom"]

- slug: tarif-bihoraire
  categorie: reseau
  tags: [tarif, reseau, heures, wallonie, bruxelles, flandre]
  source_nom: ORES
  source_url: "https://www.ores.be/comprendre-ma-facture/tarifs-distribution-2026"
  terme:
    fr: "Tarif bihoraire"
    en: "Dual-rate tariff"
    de: "Zweitarif"
    nl: "Tweevoudig tarief"
  definition:
    fr: "Formule de tarif de réseau qui distingue deux plages horaires, et dont le découpage diffère d'une région à l'autre. En Wallonie depuis 2026, les plages sont identiques tous les jours, week-end compris : heures creuses de 11h à 17h et de 22h à 7h. À Bruxelles, le découpage historique reste en vigueur : heures creuses de 22h à 7h, plus les week-ends et jours fériés. En Flandre, le tarif de distribution ne distingue plus jour et nuit depuis le tarif capacitaire de 2023. Ne pas confondre les plages wallonnes avec les bandes du tarif Impact, qui sont différentes."
    en: "A grid tariff formula distinguishing two time bands, whose split differs from one region to another. In Wallonia since 2026 the bands are identical every day, weekends included: off-peak from 11:00 to 17:00 and from 22:00 to 07:00. In Brussels the historic split still applies: off-peak from 22:00 to 07:00, plus weekends and public holidays. In Flanders the distribution tariff no longer distinguishes day from night since the 2023 capacity tariff. Do not confuse the Walloon bands with the Impact tariff bands, which differ."
    de: "Netztarifformel mit zwei Zeitfenstern, deren Einteilung sich von Region zu Region unterscheidet. In Wallonien sind die Fenster seit 2026 an allen Tagen gleich, Wochenende eingeschlossen: Schwachlast von 11 bis 17 Uhr und von 22 bis 7 Uhr. In Brüssel gilt weiterhin die historische Einteilung: Schwachlast von 22 bis 7 Uhr sowie Wochenenden und Feiertage. In Flandern unterscheidet der Verteilungstarif seit dem Kapazitätstarif von 2023 nicht mehr zwischen Tag und Nacht. Die wallonischen Fenster nicht mit den Bändern des Impact-Tarifs verwechseln, die anders liegen."
    nl: "Nettariefformule met twee uurblokken, waarvan de indeling per gewest verschilt. In Wallonië zijn de blokken sinds 2026 elke dag identiek, weekend inbegrepen: daluren van 11 tot 17 uur en van 22 tot 7 uur. In Brussel geldt nog de historische indeling: daluren van 22 tot 7 uur, plus de weekends en feestdagen. In Vlaanderen maakt het distributietarief sinds het capaciteitstarief van 2023 geen onderscheid meer tussen dag en nacht. Verwar de Waalse blokken niet met die van het Impact-tarief, die anders liggen."
  alias:
    fr: ["bihoraire", "heures creuses", "heures pleines"]
    en: ["dual-rate", "off-peak hours", "peak hours"]
    de: ["Schwachlastzeiten", "Hochlastzeiten"]
    nl: ["daluren", "piekuren"]

- slug: tarif-capacitaire
  categorie: reseau
  tags: [tarif, reseau, flandre, pointe]
  source_nom: VREG
  source_url: "https://www.vlaamsenutsregulator.be/elektriciteit-en-aardgas/nettarieven/capaciteitstarief"
  terme:
    fr: "Tarif capacitaire"
    en: "Capacity tariff"
    de: "Kapazitätstarif"
    nl: "Capaciteitstarief"
  definition:
    fr: "Tarif de distribution flamand en vigueur depuis janvier 2023, calculé sur la puissance de pointe mensuelle plutôt que sur l'heure de consommation. La pointe moyenne relevée par la VREG est d'environ 3,15 kW, avec un minimum facturé de 2,5 kW. Il fait disparaître la distinction jour/nuit de la part réseau de la facture : le geste utile n'est plus de consommer la nuit, mais d'éviter de tout faire tourner en même temps."
    en: "The Flemish distribution tariff in force since January 2023, calculated on monthly peak power rather than on the hour of consumption. The average peak recorded by the VREG is around 3.15 kW, with a billed minimum of 2.5 kW. It removes the day/night distinction from the grid part of the bill: the useful move is no longer to consume at night, but to avoid running everything at once."
    de: "Flämischer Verteilungstarif, in Kraft seit Januar 2023, berechnet auf die monatliche Spitzenleistung statt auf die Verbrauchsstunde. Die von der VREG erfasste Durchschnittsspitze liegt bei etwa 3,15 kW, mit einem berechneten Minimum von 2,5 kW. Er lässt die Unterscheidung Tag/Nacht aus dem Netzteil der Rechnung verschwinden: Der nützliche Griff ist nicht mehr, nachts zu verbrauchen, sondern zu vermeiden, alles gleichzeitig laufen zu lassen."
    nl: "Vlaams distributietarief dat sinds januari 2023 van kracht is, berekend op het maandelijkse piekvermogen in plaats van op het uur van verbruik. De gemiddelde piek die de VREG optekent bedraagt ongeveer 3,15 kW, met een aangerekend minimum van 2,5 kW. Het doet het onderscheid dag/nacht uit het netgedeelte van de factuur verdwijnen: de nuttige zet is niet langer 's nachts verbruiken, maar vermijden dat alles tegelijk draait."
  alias:
    fr: ["terme capacitaire", "capacitaire"]
    en: ["capacity term"]
    de: ["Kapazitätsterm"]
    nl: ["capaciteitsterm"]

- slug: tarif-injection
  categorie: facturation
  tags: [injection, prix, surplus]
  source_nom: Test-Achats
  source_url: "https://www.test-achats.be/maison-energie/energie-renouvelable/news/cout-energie-solaire-injectee"
  terme:
    fr: "Tarif d'injection"
    en: "Injection tariff"
    de: "Einspeisetarif"
    nl: "Injectietarief"
  definition:
    fr: "Prix au kWh payé par un fournisseur pour l'électricité injectée sur le réseau ; non régulé en Belgique, il sert de plancher au prix de cession interne."
    en: "Price per kWh paid by a supplier for electricity injected into the grid; unregulated in Belgium, it acts as the floor for the internal transfer price."
    de: "Preis pro kWh, den ein Lieferant für den ins Netz eingespeisten Strom zahlt; in Belgien nicht reguliert, bildet er die Untergrenze für den internen Verrechnungspreis."
    nl: "Prijs per kWh die een leverancier betaalt voor elektriciteit die op het net wordt geïnjecteerd; niet gereguleerd in België en de ondergrens voor de interne overdrachtsprijs."
  alias:
    fr: ["prix de rachat", "tarif de rachat"]
    en: ["buyback tariff", "feed-in tariff"]
    de: ["Rückkauftarif"]
    nl: ["terugkooptarief", "terugleveringstarief"]

- slug: tarif-prosumer
  categorie: reseau
  tags: [tarif, reseau, photovoltaique, wallonie]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/compensation-avant-0101"
  terme:
    fr: "Tarif prosumer"
    en: "Prosumer tariff"
    de: "Prosumer-Tarif"
    nl: "Prosumententarief"
  definition:
    fr: "Contribution aux coûts de réseau due par les détenteurs d'une installation photovoltaïque en Wallonie, calculée sur la puissance nette développable — 80,98 €/kWe hors TVA sur la grille ORES 2026, soit 85,84 €/kWe TVA comprise. Elle ne s'applique sous forme forfaitaire qu'aux compteurs qui n'enregistrent pas les prélèvements bruts réels."
    en: "A contribution to network costs owed by owners of a photovoltaic installation in Wallonia, calculated on net deliverable capacity — €80.98/kWe excluding VAT on the ORES 2026 schedule, i.e. €85.84/kWe including VAT. It applies as a flat charge only to meters that do not record actual gross withdrawals."
    de: "Beitrag zu den Netzkosten, den Betreiber einer Photovoltaikanlage in Wallonien schulden, berechnet auf die netto verfügbare Leistung — 80,98 €/kWe ohne Mehrwertsteuer nach der ORES-Tarifliste 2026, also 85,84 €/kWe mit Mehrwertsteuer. Als Pauschale gilt er nur für Zähler, die die tatsächlichen Bruttoentnahmen nicht erfassen."
    nl: "Bijdrage in de netkosten die eigenaars van een fotovoltaïsche installatie in Wallonië verschuldigd zijn, berekend op het netto ontwikkelbaar vermogen — 80,98 €/kWe exclusief btw volgens de ORES-tarieflijst 2026, dus 85,84 €/kWe inclusief btw. Als forfait geldt hij enkel voor meters die de werkelijke bruto-afname niet registreren."
  alias:
    fr: ["redevance prosumer"]
    en: ["prosumer charge"]
    de: ["Prosumententarif"]
    nl: ["prosumertarief"]

- slug: tarif-reseau
  categorie: facturation
  tags: [reseau, cout, tarif]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/documents/download/2979"
  terme:
    fr: "Tarif réseau"
    en: "Grid tariff"
    de: "Netztarif"
    nl: "Nettarief"
  definition:
    fr: "Part de la facture couvrant l'utilisation des réseaux de transport et de distribution. Ces coûts restent dus sur l'électricité partagée : le partage agit sur la composante énergie, pas sur le réseau."
    en: "The share of the bill covering use of the transmission and distribution grids. These costs remain payable on shared electricity: sharing acts on the energy component, not on the network component."
    de: "Der Rechnungsanteil für die Nutzung der Übertragungs- und Verteilnetze. Diese Kosten bleiben auf geteiltem Strom geschuldet: Die Teilung wirkt auf die Energiekomponente, nicht auf das Netz."
    nl: "Het deel van de factuur voor het gebruik van het transmissie- en distributienet. Die kosten blijven verschuldigd op gedeelde elektriciteit: delen werkt op de energiecomponent, niet op het net."
  alias:
    fr: ["tarif de réseau"]
    en: ["network tariff"]
    de: ["Netzentgelt"]
    nl: ["distributietarief"]

- slug: tarif-social
  categorie: facturation
  tags: [aide, facture, belgique]
  source_nom: "SPF Economie"
  source_url: "https://economie.fgov.be/fr/themes/energie/energie-sociale/tarif-social-pour-lenergie"
  terme:
    fr: "Tarif social"
    en: "Social tariff"
    de: "Sozialtarif"
    nl: "Sociaal tarief"
  definition:
    fr: "Prix maximal pour l'électricité, le gaz ou la chaleur, réservé aux clients protégés. Il est fixé par la CREG chaque trimestre, publié au Moniteur belge et identique chez tous les fournisseurs : changer d'opérateur n'y change rien. Il couvre la composante énergie et la composante réseau, mais pas l'accise spéciale ni la redevance de raccordement."
    en: "A maximum price for electricity, gas or heat, reserved for protected customers. It is set by the CREG every quarter, published in the Belgian Official Gazette and identical across every supplier: switching operator changes nothing. It covers the energy and grid components, but not the special excise duty or the connection charge."
    de: "Höchstpreis für Strom, Gas oder Wärme, geschützten Kunden vorbehalten. Er wird von der CREG jedes Quartal festgelegt, im Belgischen Staatsblatt veröffentlicht und ist bei allen Anbietern identisch: Ein Anbieterwechsel ändert daran nichts. Er deckt die Energie- und die Netzkomponente ab, nicht aber die Sonderakzise oder die Anschlussgebühr."
    nl: "Maximumprijs voor elektriciteit, gas of warmte, voorbehouden aan beschermde klanten. De CREG legt hem elk kwartaal vast, hij wordt in het Belgisch Staatsblad gepubliceerd en is bij alle leveranciers identiek: van operator veranderen verandert er niets aan. Hij dekt de energie- en de netcomponent, maar niet de bijzondere accijns of de aansluitingsvergoeding."
  alias:
    fr: ["tarif social énergie"]
    en: ["social energy tariff"]
    de: ["Energiesozialtarif"]
    nl: ["sociaal energietarief"]

- slug: tarification-dynamique
  categorie: marche
  tags: [prix, contrat, flexibilite]
  source_nom: CREG
  source_url: "https://www.creg.be/fr/consommateurs/le-marche-de-lenergie"
  terme:
    fr: "Tarification dynamique"
    en: "Dynamic pricing"
    de: "Dynamische Tarifierung"
    nl: "Dynamische tarifering"
  definition:
    fr: "Contrat dont le prix de l'électricité suit les prix horaires du marché de gros : avantageux pour qui déplace réellement ses consommations, plus risqué sinon. Requiert un compteur communicant."
    en: "A contract whose electricity price follows hourly wholesale market prices: advantageous for anyone who genuinely shifts consumption, riskier otherwise. Requires a smart meter."
    de: "Vertrag, dessen Strompreis den Stundenpreisen des Großhandelsmarktes folgt: vorteilhaft für jene, die ihren Verbrauch wirklich verschieben, andernfalls riskanter. Erfordert einen intelligenten Zähler."
    nl: "Contract waarvan de elektriciteitsprijs de uurprijzen van de groothandelsmarkt volgt: voordelig voor wie zijn verbruik echt verschuift, anders risicovoller. Vereist een communicerende meter."
  alias:
    fr: ["tarif dynamique", "contrat dynamique"]
    en: ["dynamic tariff", "dynamic contract"]
    de: ["dynamischer Tarif", "dynamischer Vertrag"]
    nl: ["dynamisch tarief", "dynamisch contract"]

- slug: tarification-incitative
  categorie: reseau
  tags: [tarif, reseau, wallonie, flexibilite]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/documents-recents/communique-de-presse-tarifs-periodiques-de-distribution-delectricite-dores-resa"
  terme:
    fr: "Tarification incitative"
    en: "Incentive network pricing"
    de: "Anreiztarifierung"
    nl: "Incentiverende tarifering"
  definition:
    fr: "Structure de tarif de réseau wallonne disponible dès 2026, qui module le terme proportionnel selon des bandes horaires (ECO, MEDIUM, PIC) pour décourager les pointes de consommation. Optionnelle, réversible, réservée aux compteurs communicants — commercialisée par ORES sous le nom de tarif Impact."
    en: "The Walloon network tariff structure available from 2026, which varies the proportional term across time bands (ECO, MEDIUM, PIC) to discourage consumption peaks. Optional, reversible, restricted to smart meters — marketed by ORES as the Impact tariff."
    de: "Die ab 2026 verfügbare wallonische Netztarifstruktur, die den proportionalen Term nach Zeitbändern (ECO, MEDIUM, PIC) staffelt, um Verbrauchsspitzen zu vermeiden. Optional, umkehrbar, intelligenten Zählern vorbehalten — von ORES als Impact-Tarif vermarktet."
    nl: "Waalse nettariefstructuur die vanaf 2026 beschikbaar is en de proportionele term moduleert volgens uurblokken (ECO, MEDIUM, PIC) om verbruikspieken te ontraden. Optioneel, omkeerbaar, voorbehouden aan digitale meters — door ORES gecommercialiseerd als Impact-tarief."
  alias:
    fr: ["tarif Impact", "tarif incitatif"]
    en: ["Impact tariff"]
    de: ["Impact-Tarif"]
    nl: ["Impact-tarief"]

- slug: taux-d-autoconsommation
  categorie: autoconsommation
  tags: [kpi, production, consommation]
  source_nom: "Ministère de la Transition écologique"
  source_url: "https://www.ecologie.gouv.fr/politiques-publiques/systemes-dautoconsommation"
  terme:
    fr: "Taux d'autoconsommation"
    en: "Self-consumption rate"
    de: "Eigenverbrauchsquote"
    nl: "Zelfverbruiksgraad"
  definition:
    fr: "Part de la production locale consommée directement sur place plutôt qu'injectée sur le réseau. Exprimé en pourcentage, c'est l'indicateur qui mesure la performance économique d'une installation ou d'une clé de répartition."
    en: "Share of local generation consumed on site rather than fed into the grid. Expressed as a percentage, it is the indicator that measures the economic performance of an installation or an allocation key."
    de: "Anteil der lokalen Erzeugung, der direkt vor Ort verbraucht statt ins Netz eingespeist wird. In Prozent ausgedrückt misst diese Kennzahl die wirtschaftliche Leistung einer Anlage oder eines Aufteilungsschlüssels."
    nl: "Aandeel van de lokale productie dat ter plaatse wordt verbruikt in plaats van op het net geïnjecteerd. Uitgedrukt in procent meet deze indicator de economische prestatie van een installatie of verdeelsleutel."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: taux-de-partage
  categorie: kpi
  tags: [partage, performance, calcul]
  source_nom: OptimCE
  source_ref: about
  terme:
    fr: "Taux de partage"
    en: "Sharing rate"
    de: "Aufteilungsquote"
    nl: "Deelgraad"
  definition:
    fr: "Part de l'énergie produite qui est effectivement partagée entre participants plutôt qu'injectée sur le réseau. Avec le taux d'autoconsommation, c'est l'indicateur qui permet de comparer deux clés de répartition."
    en: "The share of generated energy actually distributed between participants rather than fed into the grid. Together with the self-consumption rate, it is the indicator used to compare two allocation keys."
    de: "Anteil der erzeugten Energie, der tatsächlich unter den Teilnehmern geteilt statt ins Netz eingespeist wird. Zusammen mit der Eigenverbrauchsquote ist dies die Kennzahl zum Vergleich zweier Aufteilungsschlüssel."
    nl: "Aandeel van de opgewekte energie dat effectief onder de deelnemers wordt verdeeld in plaats van op het net geïnjecteerd. Samen met de zelfverbruiksgraad is dit de indicator om twee verdeelsleutels te vergelijken."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: taxes
  categorie: facturation
  tags: [fiscalite, facture, belgique]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/documents/download/2979"
  terme:
    fr: "Taxes"
    en: "Taxes"
    de: "Steuern und Abgaben"
    nl: "Heffingen"
  definition:
    fr: "Prélèvements fiscaux appliqués sur la facture d'énergie selon le cadre local."
    en: "Tax levies applied to the energy bill according to the local framework."
    de: "Steuerliche Abgaben, die je nach lokalem Rahmen auf die Energierechnung erhoben werden."
    nl: "Fiscale heffingen die volgens het lokale kader op de energiefactuur worden toegepast."
  alias:
    fr: ["taxes et prélèvements"]
    en: ["levies"]
    de: ["Abgaben"]
    nl: ["belastingen", "taksen"]

- slug: terme-capacitaire
  categorie: reseau
  tags: [tarif, reseau, puissance, pointe]
  source_nom: Fluvius
  source_url: "https://www.fluvius.be/nl/factuur-en-tarieven/capaciteitstarief"
  terme:
    fr: "Terme capacitaire"
    en: "Capacity term"
    de: "Kapazitätsterm"
    nl: "Capaciteitstarief"
  definition:
    fr: "Part du tarif de réseau calculée sur la puissance appelée plutôt que sur les kWh consommés. En Flandre, il se base sur la pointe la plus élevée d'un quart d'heure du mois, avec un plancher de 2,5 kW ; à Bruxelles, il est lié à la puissance de raccordement."
    en: "The part of the network tariff calculated on the power drawn rather than on the kWh consumed. In Flanders it is based on the highest quarter-hour peak of the month, with a 2.5 kW floor; in Brussels it is tied to connection capacity."
    de: "Der Teil des Netztarifs, der auf die abgerufene Leistung statt auf die verbrauchten kWh berechnet wird. In Flandern beruht er auf der höchsten Viertelstundenspitze des Monats, mit einer Untergrenze von 2,5 kW; in Brüssel ist er an die Anschlussleistung gekoppelt."
    nl: "Het deel van het nettarief dat wordt berekend op het gevraagde vermogen in plaats van op de verbruikte kWh. In Vlaanderen vertrekt het van de hoogste kwartierpiek van de maand, met een ondergrens van 2,5 kW; in Brussel is het gekoppeld aan het aansluitvermogen."
  alias:
    fr: ["tarif capacitaire", "terme de puissance"]
    en: ["capacity tariff", "power term"]
    de: ["Kapazitätstarif", "Leistungsterm"]
    nl: ["capaciteitsterm", "vermogensterm"]

- slug: tuteur-energie
  categorie: reglementaire
  tags: [cpas, conseil, wallonie]
  source_nom: "Action sociale Wallonie"
  source_url: "http://actionsociale.wallonie.be/lutte-surendettement/tuteurs-energie"
  terme:
    fr: "Tuteur énergie"
    en: "Energy tutor"
    de: "Energietutor"
    nl: "Energietutor"
  definition:
    fr: "Conseiller employé par un CPAS wallon et subventionné par la Région depuis une décision du Gouvernement wallon du 28 août 2008. Il se rend chez le ménage, lit les factures avec lui, repère les usages coûteux et active les aides auxquelles il a droit sans le savoir. Son financement passe largement par les plans d'action préventive en matière d'énergie (PAPE)."
    en: "An adviser employed by a Walloon CPAS and subsidised by the Region since a Walloon Government decision of 28 August 2008. They visit the household, read the bills with it, spot costly usage and activate the support it is entitled to without knowing. Funding largely runs through the preventive energy action plans (PAPE)."
    de: "Berater, der von einem wallonischen ÖSHZ beschäftigt und seit einem Beschluss der Wallonischen Regierung vom 28. August 2008 von der Region bezuschusst wird. Er sucht den Haushalt auf, liest mit ihm die Rechnungen, erkennt kostspielige Gewohnheiten und aktiviert Ansprüche, von denen der Haushalt nichts wusste. Die Finanzierung läuft weitgehend über die Präventiven Energieaktionspläne (PAPE)."
    nl: "Adviseur in dienst van een Waals OCMW en gesubsidieerd door het Gewest sinds een beslissing van de Waalse Regering van 28 augustus 2008. Hij komt bij het gezin langs, leest samen met het gezin de facturen, spoort dure gewoonten op en activeert rechten waarvan het gezin het bestaan niet kende. De financiering verloopt grotendeels via de preventieve actieplannen inzake energie (PAPE)."
  alias:
    fr: ["tuteurs énergie"]
    en: ["energy tutors"]
    de: ["Energietutoren"]
    nl: ["energietutors"]

- slug: tva
  categorie: facturation
  tags: [fiscalite, facture, belgique]
  source_nom: "SPF Finances"
  source_url: "https://finances.belgium.be/fr/entreprises/tva"
  terme:
    fr: "TVA"
    en: "VAT"
    de: "MwSt."
    nl: "Btw"
  definition:
    fr: "Taxe sur la valeur ajoutée : 6 % pour un client particulier, 21 % pour un client professionnel ; due sur l'énergie partagée facturée par le représentant du partage."
    en: "Value-added tax: 6% for a residential customer, 21% for a professional customer; due on the shared energy invoiced by the sharing representative."
    de: "Mehrwertsteuer: 6 % für einen privaten Kunden, 21 % für einen gewerblichen Kunden; geschuldet auf die vom Vertreter der Energieteilung fakturierte geteilte Energie."
    nl: "Belasting over de toegevoegde waarde: 6 % voor een particuliere klant, 21 % voor een professionele klant; verschuldigd op de door de vertegenwoordiger van het energiedelen gefactureerde gedeelde energie."
  alias:
    fr: ["taxe sur la valeur ajoutée"]
    en: ["value-added tax", "value added tax"]
    de: ["Mehrwertsteuer", "MWST"]
    nl: ["belasting over de toegevoegde waarde", "BTW"]

- slug: va
  categorie: calcul
  tags: [repartition, partage, kpi, technique]
  source_nom: OptimCE
  source_ref: about
  terme:
    fr: "VA"
    en: "VA"
    de: "VA"
    nl: "VA"
  definition:
    fr: "Valeur allouée : part de la production attribuée à un participant, exprimée soit en valeur absolue soit en pourcentage selon la clé de répartition."
    en: "Allocated value: the share of generation assigned to a participant, expressed either as an absolute value or as a percentage depending on the allocation key."
    de: "Zugewiesener Wert: der einem Teilnehmer zugeteilte Erzeugungsanteil, je nach Aufteilungsschlüssel als absoluter Wert oder als Prozentsatz ausgedrückt."
    nl: "Toegewezen waarde: het aan een deelnemer toegekende productieaandeel, uitgedrukt als absolute waarde of als percentage afhankelijk van de verdeelsleutel."
  alias:
    fr: ["valeur allouée"]
    en: ["allocated value"]
    de: ["zugewiesener Wert"]
    nl: ["toegewezen waarde"]

- slug: vap
  categorie: calcul
  tags: [repartition, partage, pourcentage, technique]
  source_nom: OptimCE
  source_ref: about
  terme:
    fr: "VAP"
    en: "VAP"
    de: "VAP"
    nl: "VAP"
  definition:
    fr: "Valeur allouée en pourcentage : part de la production allouée exprimée en pourcentage de la clé de répartition."
    en: "Allocated value as a percentage: the allocated share of generation expressed as a percentage of the allocation key."
    de: "Zugewiesener Wert in Prozent: der zugeteilte Erzeugungsanteil, ausgedrückt als Prozentsatz des Aufteilungsschlüssels."
    nl: "Toegewezen waarde in percentage: het toegewezen productieaandeel uitgedrukt als percentage van de verdeelsleutel."
  alias:
    fr: ["valeur allouée pourcentage"]
    en: ["allocated value percentage"]
    de: ["zugewiesener Wert in Prozent"]
    nl: ["toegewezen waarde percentage"]

- slug: vreg
  categorie: regulateur
  tags: [flandre, regulation, belgique]
  source_nom: "Vlaamse Nutsregulator"
  source_url: "https://www.vlaamsenutsregulator.be"
  terme:
    fr: "VREG"
    en: "VREG"
    de: "VREG"
    nl: "VREG"
  definition:
    fr: "Régulateur flamand du marché de l'énergie, devenu « Vlaamse Nutsregulator » le 1er janvier 2025."
    en: "The Flemish energy-market regulator, renamed 'Vlaamse Nutsregulator' on 1 January 2025."
    de: "Flämische Regulierungsbehörde für den Energiemarkt, seit dem 1. Januar 2025 „Vlaamse Nutsregulator“."
