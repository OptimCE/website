    en: "The Walloon network tariff structure available from 2026, which varies the proportional term across time bands (ECO, MEDIUM, PIC) to discourage consumption peaks. Optional, reversible, restricted to smart meters — marketed by ORES as the Impact tariff."
    de: "Die ab 2026 verfügbare wallonische Netztarifstruktur, die den proportionalen Term nach Zeitbändern (ECO, MEDIUM, PIC) staffelt, um Verbrauchsspitzen zu vermeiden. Optional, umkehrbar, intelligenten Zählern vorbehalten — von ORES als Impact-Tarif vermarktet."
    nl: "Waalse nettariefstructuur die vanaf 2026 beschikbaar is en de proportionele term moduleert volgens uurblokken (ECO, MEDIUM, PIC) om verbruikspieken te ontraden. Optioneel, omkeerbaar, voorbehouden aan digitale meters — door ORES gecommercialiseerd als Impact-tarief."
