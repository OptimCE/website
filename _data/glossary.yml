- slug: membre
  categorie: gouvernance
  tags: [membres, participation, communaute]
  source_nom: ORES
  source_url: "https://www.ores.be/particulier/communautes-denergie"
  terme:
    fr: "Membre"
    en: "Member"
    de: "Mitglied"
    nl: "Lid"
  definition:
    fr: "Personne ou entité qui adhère à une communauté d'énergie et participe à sa gouvernance. Les directives européennes réservent le contrôle effectif aux personnes physiques, autorités locales et petites entreprises."
    en: "A person or entity that joins an energy community and takes part in its governance. The European directives reserve effective control to natural persons, local authorities and small enterprises."
    de: "Person oder Einrichtung, die einer Energiegemeinschaft beitritt und an ihrer Governance teilnimmt. Die europäischen Richtlinien behalten die tatsächliche Kontrolle natürlichen Personen, lokalen Behörden und Kleinunternehmen vor."
    nl: "Persoon of entiteit die toetreedt tot een energiegemeenschap en deelneemt aan haar bestuur. De Europese richtlijnen behouden de daadwerkelijke zeggenschap voor aan natuurlijke personen, lokale overheden en kleine ondernemingen."
  alias:
    fr: ["participant"]
    en: ["participant"]
    de: ["Teilnehmer"]
    nl: ["deelnemer"]

- slug: notification
  categorie: reglementaire
  tags: [conformite, declaration, belgique]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/secteur/communautes-partage-energie"
  terme:
    fr: "Notification"
    en: "Notification"
    de: "Meldung"
    nl: "Kennisgeving"
  definition:
    fr: "Déclaration préalable adressée au régulateur avant le démarrage d'une opération de partage. En Wallonie, la CWaPE en accuse réception, ce qui conditionne le lancement effectif du partage avec le GRD."
    en: "Prior declaration filed with the regulator before a sharing operation starts. In Wallonia, CWaPE acknowledges receipt, and that acknowledgement conditions the actual launch of sharing with the grid operator."
    de: "Vorherige Meldung an den Regulator vor dem Start einer Teilungsoperation. In der Wallonie bestätigt die CWaPE den Eingang; diese Bestätigung ist Voraussetzung für den tatsächlichen Start der Teilung mit dem Netzbetreiber."
    nl: "Voorafgaande melding aan de regulator vóór de start van een deelactie. In Wallonië bevestigt de CWaPE de ontvangst, en die bevestiging is voorwaarde voor de effectieve start van het delen met de netbeheerder."
  alias:
    fr: []
    en: []
    de: []
    nl: []

- slug: partage-d-energie
  categorie: partage
  tags: [partage, communaute, collectif]
  source_nom: CWaPE
  source_url: "https://www.cwape.be/node/6092"
  terme:
    fr: "Partage d'énergie"
    en: "Energy sharing"
    de: "Energieteilung"
    nl: "Energiedeling"
  definition:
    fr: "Répartition de l'électricité produite localement entre les participants d'une communauté ou d'un même bâtiment. C'est une opération administrative et tarifaire : les électrons continuent de circuler normalement sur le réseau."
    en: "Splitting locally generated electricity between the participants of a community or a single building. It is an administrative and tariff operation: the electrons keep flowing across the grid exactly as before."
    de: "Aufteilung des lokal erzeugten Stroms unter den Teilnehmern einer Gemeinschaft oder eines Gebäudes. Es handelt sich um einen administrativen und tariflichen Vorgang: Die Elektronen fließen weiterhin normal über das Netz."
    nl: "Verdeling van lokaal opgewekte elektriciteit onder de deelnemers van een gemeenschap of één gebouw. Het is een administratieve en tarifaire operatie: de elektronen blijven gewoon over het net stromen."
  alias:
    fr: []
    en: []
    de: []
    nl: []

