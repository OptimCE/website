    fr: "Gestionnaire du réseau de distribution : l'entreprise responsable du réseau basse et moyenne tension jusqu'au compteur. C'est lui qui relève les données au quart d'heure et applique la clé de répartition."
    en: "Distribution system operator: the company responsible for the low- and medium-voltage grid up to the meter. It collects the quarter-hourly data and applies the allocation key."
    de: "Verteilnetzbetreiber: das Unternehmen, das für das Nieder- und Mittelspannungsnetz bis zum Zähler zuständig ist. Er erhebt die viertelstündlichen Messwerte und wendet den Aufteilungsschlüssel an."
    nl: "Distributienetbeheerder: het bedrijf dat verantwoordelijk is voor het laag- en middenspanningsnet tot aan de meter. Hij leest de kwartierwaarden uit en past de verdeelsleutel toe."
