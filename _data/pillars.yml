# ==================================================================
# Guide pillars — one entry per thematic hub under /guides/.
# ------------------------------------------------------------------
# A guide joins a pillar with `pillar: <key>` in its front matter. The pillar
# page itself (guides/<slug>.md and its translations, `layout: pillar`) carries
# the introduction and the ordered sections; this file carries what every page
# needs about a pillar without loading it:
#
# - label            short name for badges and breadcrumbs, per language
# - cta_communaute   show the "join an energy community" block at the end of
#                    the pillar's guides (_includes/cta-communaute.html)
# - tags             legacy ?tag= values that now redirect to this pillar
# - categories       glossary categories whose terms fall back to this pillar
#                    when no guide of any pillar cites them
# ==================================================================

- key: communautes-energie
  label:
    fr: "Communautés d'énergie"
    en: "Energy communities"
    de: "Energiegemeinschaften"
    nl: "Energiegemeenschappen"
  cta_communaute: true
  tags: [community, administrative]
  categories: [gouvernance, juridique, modele, partage, regulateur, territoire, reglementaire]

