# Hero Section
hero:
  title: "The open source platform for managing your energy community"
  subtitle: >-
    OptimCE simplifies the management of members, meters and energy sharing
    within your renewable energy community.
  cta_primary: "Get started now"
  cta_secondary: "View on GitHub"

# Features Section
features:
  title: "Features"
  subtitle: "Everything you need to manage your energy community"
  items:
    - icon: "users"
      title: "Member management"
      description: >-
        Onboarding, roles, community-user links.
        Easily manage all participants in your community.
    - icon: "meter"
      title: "Meter management"
      description: >-
        Track each member's energy meters
        and centralise consumption and production data.
    - icon: "key"
      title: "Allocation keys"
      description: >-
        Configure allocation keys and sharing operations
        to distribute energy among members.
    - icon: "building"
      title: "Multi-community"
      description: >-
        A single instance for multiple energy communities.
        Built-in multi-tenant architecture.
    - icon: "puzzle"
      title: "Extensible modules"
      description: >-
        Event-driven integration (SQS) allowing you to connect
        third-party tools such as an energy management system.
    - icon: "open-source"
      title: "Open source"
      description: >-
        Open and transparent source code. Contribute, audit
        and adapt the platform to your needs.

# Why OptimCE
why:
  title: "Why OptimCE?"
  subtitle: "A solution designed for European energy communities"
  points:
    - title: "Open source and transparent"
      description: >-
        Open, auditable and modifiable source code.
        No vendor lock-in.
    - title: "Designed for the European framework"
      description: >-
        Compliant with European directives on renewable energy
        communities and citizen energy communities.
    - title: "Easy to deploy"
      description: >-
        Quick installation. Multilingual interface (FR, EN, NL, DE)
        and scalable architecture.

# Commitment
commitment:
  title: "Free, open, and built to stay that way"
  subtitle: >-
    OptimCE is in alpha and part of an active research project.
    Here is what we commit to, today and long-term.
  cards:
    - icon: "rocket"
      label: "Today"
      title: "Free during alpha"
      description: >-
        The hosted SaaS at app.optimce.be is free to use while we are in alpha.
        Like many open source projects, the hosted version may move to paid plans
        later — if so, you will know well in advance. Self-hosting stays free regardless.
    - icon: "code"
      label: "Forever"
      title: "Open source, always"
      description: >-
        The full source code is released under Apache 2.0 and will stay open.
        Audit it, fork it, contribute — no proprietary core, no rug pull.
    - icon: "server"
      label: "Forever"
      title: "Self-hosting always free"
      description: >-
        Run OptimCE on your own infrastructure with zero restrictions.
        The open source core stays fully featured — no paid tiers, no feature gating.
        We may offer paid support or services on top, but never as a gate on the OSS itself.

# For Developers
developers:
  title: "For developers"
  subtitle: "Built with modern, open technologies"
  description: >-
    Angular frontend, Node.js/TypeScript and FastAPI backend,
