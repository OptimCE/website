# Hero (_includes/hero.html) and the quarter-hour grid
# (_includes/quarter-hour-grid.html). In grid strings, assets/js/main.js fills
# {time} {n} {kwh} {members} {date}; {h}/{hh} = hour, {m} = minutes.
hero:
  title: "Your energy community, managed to the quarter-hour"
  subtitle: >-
    OptimCE is the open source platform that brings together your community's
    members, meters, allocation keys and billing. Use it online or host it
    yourself.
  oss_note: "Free software under the Apache 2.0 licence, on GitHub"
  grid:
    legend_label: "Energy shared per quarter-hour"
    legend_none: "none"
    legend_more: "a lot"
    readout_static: "Each square is a quarter-hour: 96 a day."
    readout_day: "It is {time}: quarter-hour {n} of 96. In this example, {kwh} kWh is shared between {members} households."
    readout_idle: "It is {time}: quarter-hour {n} of 96. Not enough sun to share: the grid takes over."
    tooltip: "{date}, {time}: {kwh} kWh shared"
    time_format: "{hh}:{m}"
    hour_format: "{hh}:00"
    aria_label: "Grid of 28 days by 96 quarter-hours: energy shared in the example, from the oldest day at the top to today at the bottom."
    poster_alt: "Grid of 28 days by 96 quarter-hours: energy shared in the example, in June."
    caption: >-
      Example: a 24 kWp roof and 12 households in Namur. Generation computed
      with PVGIS and the 2023 weather on the same dates; consumption from a
      typical profile of 3,500 kWh per household per year.
    table_summary: "Show the figures for these 28 days"
    table_day: "Day"
    table_shared: "Energy shared"
    table_best: "Best quarter-hour"
    table_best_format: "{kwh} kWh at {time}"

# Features: title and link kept for the modules section and the features page
features:
  title: "Features"
  subtitle: "Everything you need to manage your energy community"
  see_all: "See all features"

# How it works (_includes/how-it-works.html)
how:
  title: "How it works"
  subtitle: "Three steps, from registering members to the invoice."
  steps:
    - title: "Register members and their meters"
      text: >-
        Each member joins the community with their meter. OptimCE brings its
        readings together, quarter-hour by quarter-hour.
    - title: "Choose the allocation key"
      text: >-
        Build it in a grid or step by step, then compare scenarios on your own
        data with the simulation.
    - title: "Bill and report"
      text: >-
        For each billing period, OptimCE bills each member for the shared
        energy and prepares the filings for the Walloon regulator (CWaPE).

# Application modules (_includes/modules.html)
modules:
  title: "What the app does"
  subtitle: "OptimCE's modules, from the member register to the filings for the regulator."
  groups:
    - name: "Community"
      items:
        - title: "Members"
          text: "Memberships, roles, bank details and documents for each member."
        - title: "Meters and map"
          text: "Every meter with its quarter-hour readings, as a list or on the map."
        - title: "Public directory"
          text: "Present your community so that new members can find it."
    - name: "Sharing"
      items:
        - title: "Allocation keys"
          text: "In a grid or with a step-by-step wizard."
        - title: "Simulation"
          text: "Self-consumption, surplus and sharing rate of several scenarios, side by side."
        - title: "Live data"
          text: "Generation and power read from smart meters."
    - name: "Management"
      items:
        - title: "Billing"
          text: "Tariffs, billing runs, credit notes and payment tracking."
        - title: "CWaPE filings"
          text: "Deadlines, timeline and generated forms for the Walloon regulator."
        - title: "News and polls"
          text: "Keep members informed and consult them in the app."
  note: >-
    One installation can host several communities, and third-party tools plug
    into its events (NATS).
  shot_alt: "A manager's dashboard in OptimCE, with the things to check and the energy shared."
  shot_caption: "A manager's dashboard in the alpha version, with test data."

