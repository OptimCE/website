hero:
  title: "Uw energiegemeenschap, beheerd tot op het kwartier"
  subtitle: >-
    OptimCE is het open source platform dat de leden, meters, verdeelsleutels
    en facturatie van uw gemeenschap samenbrengt. Gebruik het online of host
    het zelf.
  oss_note: "Vrije software onder de Apache 2.0-licentie, op GitHub"
