# How it works (_includes/how-it-works.html)
how:
  title: "Hoe het werkt"
  subtitle: "Drie stappen, van de inschrijving van de leden tot de factuur."
  steps:
    - title: "Schrijf de leden en hun meters in"
      text: >-
        Elk lid sluit zich met zijn meter aan bij de gemeenschap. OptimCE
        brengt de meetgegevens samen, kwartier per kwartier.
    - title: "Kies de verdeelsleutel"
      text: >-
        Stel hem op in een tabel of stap voor stap en vergelijk met de
        simulatie meerdere scenario's op uw eigen gegevens.
    - title: "Factureer en rapporteer"
      text: >-
        Voor elke facturatieperiode factureert OptimCE de gedeelde energie aan
        elk lid en bereidt het de dossiers voor de Waalse regulator (CWaPE)
        voor.

# Application modules (_includes/modules.html)
modules:
  title: "Wat de app doet"
  subtitle: "De modules van OptimCE, van het ledenregister tot de dossiers voor de CWaPE."
  groups:
    - name: "Gemeenschap"
      items:
        - title: "Leden"
          text: "Lidmaatschappen, rollen, bankgegevens en documenten van elk lid."
        - title: "Meters en kaart"
          text: "Elke meter met zijn kwartierwaarden, als lijst of op de kaart."
        - title: "Openbare gids"
          text: "Stel uw gemeenschap voor, zodat nieuwe leden haar vinden."
    - name: "Delen"
      items:
        - title: "Verdeelsleutels"
          text: "In een tabel of met een stapsgewijze assistent."
        - title: "Simulatie"
          text: "Zelfverbruik, overschot en deelgraad van meerdere scenario's naast elkaar."
        - title: "Realtime gegevens"
          text: "Productie en vermogen, uitgelezen van digitale meters."
    - name: "Beheer"
      items:
        - title: "Facturatie"
          text: "Tarieven, facturatierondes, creditnota's en opvolging van betalingen."
        - title: "CWaPE-dossiers"
          text: "Termijnen, tijdlijn en gegenereerde formulieren voor de Waalse regulator."
        - title: "Nieuws en peilingen"
          text: "Informeer uw leden en raadpleeg hen in de app."
  note: >-
    Eén installatie kan meerdere gemeenschappen herbergen, en tools van derden
    koppelen aan haar gebeurtenissen (NATS).
  shot_alt: "Het dashboard van een beheerder in OptimCE, met de aandachtspunten en de gedeelde energie."
  shot_caption: "Het dashboard van een beheerder in de alphaversie, met testgegevens (Engelstalige interface)."

