# Hero Section
hero:
  title: "Het open source platform voor het beheer van uw energiegemeenschap"
  subtitle: >-
    OptimCE vereenvoudigt het beheer van leden, meters en energiedeling
    binnen uw hernieuwbare-energiegemeenschap.
  cta_primary: "Nu beginnen"
  cta_secondary: "Bekijk op GitHub"

# Features Section
features:
  title: "Functies"
  subtitle: "Alles wat u nodig heeft om uw energiegemeenschap te beheren"
  items:
    - icon: "users"
      title: "Ledenbeheer"
      description: >-
        Onboarding, rollen, gemeenschap-gebruiker koppelingen.
        Beheer eenvoudig alle deelnemers van uw gemeenschap.
    - icon: "meter"
      title: "Meterbeheer"
      description: >-
        Volg de energiemeters van elk lid
        en centraliseer verbruiks- en productiegegevens.
    - icon: "key"
      title: "Verdeelsleutels"
      description: >-
        Configureer verdeelsleutels en deeloperaties
        om energie onder de leden te verdelen.
    - icon: "building"
      title: "Multi-gemeenschap"
      description: >-
        Eén instantie voor meerdere energiegemeenschappen.
        Ingebouwde multi-tenant architectuur.
    - icon: "puzzle"
      title: "Uitbreidbare modules"
      description: >-
        Gebeurtenisgestuurde integratie (SQS) waarmee u
        tools van derden kunt aansluiten, zoals een energiebeheersysteem.
    - icon: "open-source"
      title: "Open source"
      description: >-
        Open en transparante broncode. Draag bij, controleer
        en pas het platform aan uw behoeften aan.

# Why OptimCE
why:
  title: "Waarom OptimCE?"
  subtitle: "Een oplossing ontworpen voor Europese energiegemeenschappen"
  points:
    - title: "Open source en transparant"
      description: >-
        Open, controleerbare en aanpasbare broncode.
        Geen vendor lock-in.
    - title: "Ontworpen voor het Europese kader"
      description: >-
        In overeenstemming met de Europese richtlijnen voor hernieuwbare-energiegemeenschappen
        en burgerenergiegemeenschappen.
    - title: "Eenvoudig te implementeren"
      description: >-
        Snelle installatie. Meertalige interface (FR, EN, NL, DE)
        en schaalbare architectuur.

# Commitment
commitment:
  title: "Gratis, open, en gebouwd om dat te blijven"
  subtitle: >-
    OptimCE bevindt zich in de alpha-fase en maakt deel uit van een lopend onderzoeksproject.
    Dit zijn onze toezeggingen, vandaag en op lange termijn.
  cards:
    - icon: "rocket"
      label: "Vandaag"
      title: "Gratis tijdens de alpha"
      description: >-
        De gehoste SaaS op app.optimce.be is gratis te gebruiken tijdens de alpha-fase.
        Zoals bij veel open source projecten, kan de gehoste versie later overstappen
        op betaalde plannen — u wordt ruim van tevoren op de hoogte gesteld.
        Self-hosting blijft hoe dan ook gratis.
    - icon: "code"
      label: "Voor altijd"
      title: "Altijd open source"
      description: >-
        De volledige broncode is uitgebracht onder Apache 2.0 en blijft open.
        Controleer, fork, draag bij — geen propriëtaire kern, geen ommezwaai.
    - icon: "server"
      label: "Voor altijd"
      title: "Self-hosting altijd gratis"
      description: >-
        Draai OptimCE op uw eigen infrastructuur zonder enige beperking.
        De open source kern blijft volledig — geen betaalde niveaus, geen functionaliteiten op slot.
        Betaalde ondersteuning of diensten kunnen er los van bestaan, maar nooit als slot op de open source zelf.

