hero:
  title: "Uw energiegemeenschap, beheerd tot op het kwartier"
  subtitle: >-
    OptimCE is het open source platform dat de leden, meters, verdeelsleutels
    en facturatie van uw gemeenschap samenbrengt. Gebruik het online of host
    het zelf.
  oss_note: "Vrije software onder de Apache 2.0-licentie, op GitHub"
  grid:
    legend_label: "Gedeelde energie per kwartier"
    legend_none: "geen"
    legend_more: "veel"
    readout_static: "Elk vakje is een kwartier: 96 per dag."
    readout_day: "Het is {time}: kwartier {n} van 96. In dit voorbeeld wordt {kwh} kWh gedeeld tussen {members} gezinnen."
    readout_idle: "Het is {time}: kwartier {n} van 96. Te weinig zon om te delen: het net neemt het over."
    tooltip: "{date}, {time}: {kwh} kWh gedeeld"
    time_format: "{h}.{m} uur"
    hour_format: "{h} uur"
    aria_label: "Raster van 28 dagen op 96 kwartieren: de in het voorbeeld gedeelde energie, van de oudste dag bovenaan tot vandaag onderaan."
    poster_alt: "Raster van 28 dagen op 96 kwartieren: de in het voorbeeld gedeelde energie, in juni."
    caption: >-
      Voorbeeld: een dak van 24 kWp en 12 gezinnen in Namen. Productie
      berekend met PVGIS en het weer van 2023 op dezelfde data; verbruik
      volgens een typisch profiel van 3 500 kWh per gezin per jaar.
    table_summary: "Toon de cijfers van deze 28 dagen"
    table_day: "Dag"
    table_shared: "Gedeelde energie"
    table_best: "Beste kwartier"
    table_best_format: "{kwh} kWh om {time}"

# Features: title and link kept for the modules section and the features page
