# About
about:
  title: "Over OptimCE"
  subtitle: "Onze missie en onze visie"
  mission_title: "Onze missie"
  mission_text: >-
    OptimCE helpt energiegemeenschappen hun leden, meters en energiedeling te
    beheren zonder te verdrinken in administratieve complexiteit.
    Onze missie is om het beheer van een energiegemeenschap zo eenvoudig en
    toegankelijk mogelijk te maken, via een open source platform dat transparant
    en performant is — of u het nu zelf host of het beheer aan ons overlaat.
  why_title: "Waarom OptimCE?"
  why_text: >-
    Energiegemeenschappen spelen een groeiende rol in de Europese energietransitie.
    Toch zijn de beschikbare beheertools vaak propriëtair, duur of niet aangepast
    aan de specifieke behoeften van deze structuren.
    OptimCE beantwoordt deze behoefte met een open oplossing, specifiek ontworpen
    voor de Europese regelgevingscontext — zonder leveranciersafhankelijkheid en
    zonder verborgen kosten.
  offering_title: "Twee manieren om OptimCE te gebruiken"
  offering_intro: >-
    Of u nu een technisch team bent of een kant-en-klare oplossing verkiest,
    OptimCE past zich aan uw situatie aan.
  selfhost_badge: "Open source"
  selfhost_title: "Zelf gehost"
  selfhost_text: >-
    Implementeer OptimCE op uw eigen infrastructuur, gratis en zonder beperking,
    onder de Apache 2.0-licentie. U behoudt volledige controle over uw gegevens,
    maar zorgt zelf voor hosting, updates en beschikbaarheid — er wordt geen
    servicegarantie (SLA) geboden.
  selfhost_cta: "Bekijk op GitHub"
  cloud_badge: "Alpha — gratis"
  cloud_title: "OptimCE Cloud"
  cloud_text: >-
    De gehoste, beheerde versie, klaar voor gebruik: geen installatie, geen
    onderhoud. OptimCE Cloud bevindt zich momenteel in alpha en is volledig gratis
    — probeer het nu. Een betaald aanbod komt eraan naarmate het product rijpt;
    alpha-gebruikers worden ruim op tijd op de hoogte gebracht.
  cloud_cta: "Nu starten"
  origin_title: "Ontstaan uit een onderzoeksproject"
  origin_text: >-
    OptimCE is voortgekomen uit Locomotrice, een Waals onderzoeksproject (2023–2026)
    gefinancierd door het Win2Wal-programma van het Waalse Gewest. Onder leiding van de
    Universiteit Luik (BEMS-laboratorium) en het onderzoekscentrum CECOTEPE, in
    samenwerking met burgerenergiecoöperaties, wil Locomotrice open source software
    ontwikkelen voor het beheer van energiegemeenschappen, samen ontworpen met de mensen
    op het terrein.
  origin_text2: >-
    Die academische en coöperatieve oorsprong vormt OptimCE: een tool die is afgestemd op
    de werkelijke behoeften van energiegemeenschappen, getest in de praktijk en open van opzet.
  origin_facts:
    - label: "Programma"
      text: "Win2Wal — Waals Gewest"
    - label: "Leiding"
      text: "Universiteit Luik — BEMS-laboratorium"
    - label: "Onderzoekspartner"
      text: "CECOTEPE"
    - label: "Praktijkpartners"
      text: "burgerenergiecoöperaties"
    - label: "Periode"
      text: "2023–2026"
  contribute_title: "Bijdragen"
  contribute_text: >-
    OptimCE is een open source project en bijdragen zijn welkom.
    Of u nu ontwikkelaar, designer, vertaler bent of gewoon gepassioneerd
    door energiegemeenschappen, u kunt op vele manieren bijdragen.
  contribute_cta: "Bekijk het project op GitHub"
  author_intro: "De gidsen en het nieuws op deze site worden geschreven door"

