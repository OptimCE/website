# Hero Section
hero:
  title: "Die Open-Source-Plattform zur Verwaltung Ihrer Energiegemeinschaft"
  subtitle: >-
    OptimCE vereinfacht die Verwaltung von Mitgliedern, Zählern und der
    Energieverteilung in Ihrer Erneuerbare-Energien-Gemeinschaft.
  cta_primary: "Jetzt starten"
  cta_secondary: "Auf GitHub ansehen"

# Features Section
features:
  title: "Funktionen"
  subtitle: "Alles, was Sie zur Verwaltung Ihrer Energiegemeinschaft brauchen"
  items:
    - icon: "users"
      title: "Mitgliederverwaltung"
      description: >-
        Onboarding, Rollen, Gemeinschaft-Nutzer-Verknüpfungen.
        Verwalten Sie alle Teilnehmer Ihrer Gemeinschaft einfach.
    - icon: "meter"
      title: "Zählerverwaltung"
      description: >-
        Verfolgen Sie die Energiezähler jedes Mitglieds
        und zentralisieren Sie Verbrauchs- und Produktionsdaten.
    - icon: "key"
      title: "Aufteilungsschlüssel"
      description: >-
        Konfigurieren Sie Aufteilungsschlüssel und Sharing-Operationen,
        um Energie unter den Mitgliedern zu verteilen.
    - icon: "building"
      title: "Multi-Gemeinschaft"
      description: >-
        Eine einzige Instanz für mehrere Energiegemeinschaften.
        Integrierte Multi-Tenant-Architektur.
    - icon: "puzzle"
      title: "Erweiterbare Module"
      description: >-
        Ereignisgesteuerte Integration (NATS) zum Anschluss von
        Drittanbieter-Tools wie einem Energiemanagementsystem.
    - icon: "open-source"
      title: "Open Source"
      description: >-
        Offener und transparenter Quellcode. Tragen Sie bei, prüfen Sie
        und passen Sie die Plattform an Ihre Bedürfnisse an.

# Why OptimCE
why:
  title: "Warum OptimCE?"
  subtitle: "Eine Lösung für europäische Energiegemeinschaften"
  points:
    - title: "Open Source und transparent"
      description: >-
        Offener, überprüfbarer und anpassbarer Quellcode.
        Kein Vendor-Lock-in.
    - title: "Für den europäischen Rahmen konzipiert"
      description: >-
        Konform mit den europäischen Richtlinien zu Erneuerbare-Energien-Gemeinschaften
        und Bürgerenergiegemeinschaften.
    - title: "Einfach bereitzustellen"
      description: >-
        Schnelle Installation. Mehrsprachige Oberfläche (FR, EN, NL, DE)
        und skalierbare Architektur.

# Commitment
commitment:
  title: "Kostenlos, offen — und dafür gebaut, es zu bleiben"
  subtitle: >-
    OptimCE befindet sich in der Alpha-Phase und ist Teil eines laufenden Forschungsprojekts.
    Das sind unsere Zusagen, heute und langfristig.
  cards:
    - icon: "rocket"
      label: "Heute"
      title: "Während der Alpha kostenlos"
      description: >-
        Die gehostete SaaS unter app.optimce.be ist während der Alpha-Phase kostenlos nutzbar.
        Wie bei vielen Open-Source-Projekten kann die gehostete Version später auf bezahlte
        Tarife umstellen — Sie werden frühzeitig informiert. Self-Hosting bleibt in jedem Fall kostenlos.
    - icon: "code"
      label: "Für immer"
      title: "Open Source, immer"
      description: >-
        Der gesamte Quellcode wird unter Apache 2.0 veröffentlicht und bleibt offen.
        Prüfen, forken, beitragen — kein proprietärer Kern, kein Wortbruch.
    - icon: "server"
      label: "Für immer"
      title: "Self-Hosting immer kostenlos"
      description: >-
        Betreiben Sie OptimCE auf Ihrer eigenen Infrastruktur ohne jede Einschränkung.
        Der Open-Source-Kern bleibt vollständig — keine bezahlten Stufen, keine gesperrten Funktionen.
        Bezahlter Support oder Services können separat existieren, aber niemals als Sperre für den Open-Source-Kern selbst.

