# About
about:
  title: "Über OptimCE"
  subtitle: "Unsere Mission und unsere Vision"
  mission_title: "Unsere Mission"
  mission_text: >-
    OptimCE hilft Energiegemeinschaften, ihre Mitglieder, Zähler und ihre
    Energieverteilung zu verwalten, ohne in administrativer Komplexität zu versinken.
    Unsere Mission ist es, die Verwaltung einer Energiegemeinschaft so einfach und
    zugänglich wie möglich zu machen — über eine transparente und leistungsfähige
    Open-Source-Plattform, ganz gleich, ob Sie sie selbst hosten oder uns die
    Verwaltung überlassen.
  why_title: "Warum OptimCE?"
  why_text: >-
    Energiegemeinschaften spielen eine wachsende Rolle bei der europäischen
    Energiewende. Dennoch sind die verfügbaren Verwaltungstools oft proprietär,
    teuer oder nicht an die Besonderheiten dieser Strukturen angepasst.
    OptimCE beantwortet diesen Bedarf mit einer offenen Lösung, die speziell für
    den europäischen Rechtsrahmen konzipiert wurde — ohne Anbieterbindung und ohne
    versteckte Kosten.
  offering_title: "Zwei Wege, OptimCE zu nutzen"
  offering_intro: >-
    Ob technisches Team oder lieber eine schlüsselfertige Lösung — OptimCE passt
    sich Ihrer Situation an.
  selfhost_badge: "Open Source"
  selfhost_title: "Selbst gehostet"
  selfhost_text: >-
    Betreiben Sie OptimCE auf Ihrer eigenen Infrastruktur, kostenlos und ohne
    Einschränkung, unter der Apache-2.0-Lizenz. Sie behalten die volle Kontrolle
    über Ihre Daten, kümmern sich aber selbst um Hosting, Updates und Verfügbarkeit
    — es wird keine Dienstgütevereinbarung (SLA) gewährt.
  selfhost_cta: "Auf GitHub ansehen"
  cloud_badge: "Alpha — kostenlos"
  cloud_title: "OptimCE Cloud"
  cloud_text: >-
    Die gehostete, verwaltete Version, sofort einsatzbereit: keine Installation,
    keine Wartung. OptimCE Cloud befindet sich derzeit in der Alpha-Phase und ist
    völlig kostenlos — testen Sie es jetzt. Ein kostenpflichtiges Angebot wird
    folgen, sobald das Produkt reift; Alpha-Nutzer werden rechtzeitig informiert.
  cloud_cta: "Jetzt starten"
  origin_title: "Aus einem Forschungsprojekt entstanden"
  origin_text: >-
    OptimCE ist aus Locomotrice hervorgegangen, einem wallonischen Forschungsprojekt
    (2023–2026), das vom Programm Win2Wal der Wallonischen Region finanziert wird. Unter
    der Leitung der Universität Lüttich (Labor BEMS) und des Forschungszentrums CECOTEPE,
    in Zusammenarbeit mit bürgerschaftlichen Energiegenossenschaften, will Locomotrice eine
    Open-Source-Software zur Verwaltung von Energiegemeinschaften entwickeln — gemeinsam
    mit den Akteuren vor Ort gestaltet.
  origin_text2: >-
    Dieser akademische und bürgerschaftliche Ursprung prägt OptimCE: ein Werkzeug, das auf
    die realen Bedürfnisse von Energiegemeinschaften ausgerichtet ist, im Feld erprobt und
    von Grund auf quelloffen.
  origin_facts:
    - label: "Programm"
      text: "Win2Wal — Wallonische Region"
    - label: "Leitung"
      text: "Universität Lüttich — Labor BEMS"
    - label: "Forschungspartner"
      text: "CECOTEPE"
    - label: "Praxispartner"
      text: "bürgerschaftliche Energiegenossenschaften"
    - label: "Zeitraum"
      text: "2023–2026"
  contribute_title: "Beitragen"
  contribute_text: >-
    OptimCE ist ein Open-Source-Projekt und Beiträge sind willkommen.
    Ob Entwickler, Designer, Übersetzer oder einfach begeistert
    von Energiegemeinschaften — Sie können auf vielfältige Weise beitragen.
  contribute_cta: "Projekt auf GitHub ansehen"
  author_intro: "Die Ratgeber und Neuigkeiten dieser Website schreibt"

