# How it works (_includes/how-it-works.html)
how:
  title: "So funktioniert es"
  subtitle: "Drei Schritte, von der Anmeldung der Mitglieder bis zur Rechnung."
  steps:
    - title: "Mitglieder und Zähler erfassen"
      text: >-
        Jedes Mitglied tritt der Gemeinschaft mit seinem Zähler bei. OptimCE
        führt die Messwerte zusammen, Viertelstunde für Viertelstunde.
    - title: "Den Aufteilungsschlüssel wählen"
      text: >-
        Legen Sie ihn in einer Tabelle oder Schritt für Schritt an und
        vergleichen Sie mit der Simulation mehrere Szenarien auf Ihren eigenen
        Daten.
    - title: "Abrechnen und berichten"
      text: >-
        Für jeden Abrechnungszeitraum rechnet OptimCE die geteilte Energie mit
        jedem Mitglied ab und bereitet die Unterlagen für die wallonische
        Regulierungsbehörde (CWaPE) vor.

# Application modules (_includes/modules.html)
modules:
  title: "Was die App kann"
  subtitle: "Die Module von OptimCE, vom Mitgliederverzeichnis bis zu den Unterlagen für die CWaPE."
  groups:
    - name: "Gemeinschaft"
      items:
        - title: "Mitglieder"
          text: "Mitgliedschaften, Rollen, Bankdaten und Dokumente jedes Mitglieds."
        - title: "Zähler und Karte"
          text: "Jeder Zähler mit seinen Viertelstundenwerten, als Liste oder auf der Karte."
        - title: "Öffentliches Verzeichnis"
          text: "Stellen Sie Ihre Gemeinschaft vor, damit neue Mitglieder sie finden."
    - name: "Teilen"
      items:
        - title: "Aufteilungsschlüssel"
          text: "In einer Tabelle oder mit einem Schritt-für-Schritt-Assistenten."
        - title: "Simulation"
          text: "Eigenverbrauch, Überschuss und Teilungsquote mehrerer Szenarien im Vergleich."
        - title: "Echtzeitdaten"
          text: "Erzeugung und Leistung, von intelligenten Zählern ausgelesen."
    - name: "Verwaltung"
      items:
        - title: "Abrechnung"
          text: "Tarife, Abrechnungsläufe, Gutschriften und Zahlungsverfolgung."
        - title: "CWaPE-Unterlagen"
          text: "Fristen, Zeitleiste und erzeugte Formulare für die wallonische Regulierungsbehörde."
        - title: "Neuigkeiten und Umfragen"
          text: "Informieren Sie Ihre Mitglieder und befragen Sie sie in der App."
  note: >-
    Eine Installation kann mehrere Gemeinschaften beherbergen, und
    Drittanbieter-Tools docken an ihre Ereignisse an (NATS).
  shot_alt: "Das Dashboard einer Verwaltung in OptimCE, mit den zu prüfenden Punkten und der geteilten Energie."
  shot_caption: "Das Dashboard einer Verwaltung in der Alpha-Version, mit Testdaten (englische Oberfläche)."

