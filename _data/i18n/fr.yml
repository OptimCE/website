# Hero (_includes/hero.html) and the quarter-hour grid
# (_includes/quarter-hour-grid.html). In grid strings, assets/js/main.js fills
# {time} {n} {kwh} {members} {date}; {h}/{hh} = hour, {m} = minutes.
hero:
  title: "Votre communauté d'énergie, gérée au quart d'heure près"
  subtitle: >-
    OptimCE est la plateforme open source qui réunit les membres, les
    compteurs, les clés de répartition et la facturation de votre communauté.
    Utilisez-la en ligne ou hébergez-la chez vous.
  oss_note: "Logiciel libre sous licence Apache 2.0, sur GitHub"
  grid:
    legend_label: "Énergie partagée par quart d'heure"
    legend_none: "aucune"
    legend_more: "beaucoup"
    readout_static: "Chaque case est un quart d'heure : 96 par jour."
    readout_day: "Il est {time} : quart d'heure n° {n} sur 96. Dans cet exemple, les {members} foyers s'y partagent {kwh} kWh."
    readout_idle: "Il est {time} : quart d'heure n° {n} sur 96. Pas assez de soleil pour partager : le réseau prend le relais."
    tooltip: "{date}, {time} : {kwh} kWh partagés"
    time_format: "{h} h {m}"
    hour_format: "{h} h"
    aria_label: "Grille de 28 jours sur 96 quarts d'heure : l'énergie partagée dans l'exemple, du jour le plus ancien, en haut, à aujourd'hui, en bas."
    poster_alt: "Grille de 28 jours sur 96 quarts d'heure : l'énergie partagée dans l'exemple, en juin."
    caption: >-
      Exemple : une toiture de 24 kWc et 12 foyers à Namur. Production
      calculée avec PVGIS et la météo de 2023 aux mêmes dates ; consommation
      selon un profil type de 3 500 kWh par foyer et par an.
    table_summary: "Voir les chiffres de ces 28 jours"
    table_day: "Jour"
    table_shared: "Énergie partagée"
    table_best: "Meilleur quart d'heure"
    table_best_format: "{kwh} kWh à {time}"

