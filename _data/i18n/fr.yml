# How it works (_includes/how-it-works.html)
how:
  title: "Comment ça marche"
  subtitle: "Trois étapes, de l'inscription des membres à la facture."
  steps:
    - title: "Inscrivez les membres et leurs compteurs"
      text: >-
        Chaque membre rejoint la communauté avec son compteur. OptimCE
        centralise ses relevés, quart d'heure par quart d'heure.
    - title: "Choisissez la clé de répartition"
      text: >-
        Créez-la dans une grille ou pas à pas, puis comparez plusieurs
        scénarios sur vos propres données grâce à la simulation.
    - title: "Facturez et rendez compte"
      text: >-
        Pour chaque période, OptimCE facture l'énergie partagée à chaque
        membre et prépare les dossiers à déposer à la CWaPE.

# Application modules (_includes/modules.html)
modules:
  title: "Ce que fait l'application"
  subtitle: "Les modules d'OptimCE, du registre des membres aux dossiers pour la CWaPE."
  groups:
    - name: "Communauté"
      items:
        - title: "Membres"
          text: "Adhésions, rôles, coordonnées bancaires et documents de chaque membre."
        - title: "Compteurs et carte"
          text: "Chaque compteur et ses relevés au quart d'heure, en liste ou sur la carte."
        - title: "Annuaire public"
          text: "Présentez votre communauté pour que de nouveaux membres la trouvent."
    - name: "Partage"
      items:
        - title: "Clés de répartition"
          text: "Dans une grille ou avec un assistant, étape par étape."
        - title: "Simulation"
          text: "Autoconsommation, surplus et taux de partage de plusieurs scénarios, côte à côte."
        - title: "Données en temps réel"
          text: "La production et la puissance lues sur les compteurs communicants."
    - name: "Gestion"
      items:
        - title: "Facturation"
          text: "Tarifs, campagnes de facturation, notes de crédit et suivi des paiements."
        - title: "Dossiers CWaPE"
          text: "Échéances, chronologie et formulaires générés pour le régulateur wallon."
        - title: "Actualités et sondages"
          text: "Informez vos membres et consultez-les dans l'application."
  note: >-
    Une même installation peut accueillir plusieurs communautés, et des outils
    tiers se branchent sur ses événements (NATS).
  shot_alt: "Le tableau de bord d'un gestionnaire dans OptimCE : points à vérifier, énergie partagée, opérations de partage, arrivées de membres et activité récente."
  shot_caption: "Le tableau de bord d'un gestionnaire, dans la version alpha, avec des données de test."

