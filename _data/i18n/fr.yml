# About
about:
  title: "À propos d'OptimCE"
  subtitle: "Notre mission et notre vision"
  mission_title: "Notre mission"
  mission_text: >-
    OptimCE aide les communautés d'énergie à gérer leurs membres, leurs compteurs
    et leur partage d'énergie sans se noyer dans la complexité administrative.
    Notre mission : rendre la gestion d'une communauté d'énergie aussi simple et
    accessible que possible, grâce à une plateforme open source, transparente et
    performante — que vous l'hébergiez vous-même ou que vous nous laissiez nous en occuper.
  why_title: "Pourquoi OptimCE ?"
  why_text: >-
    Les communautés d'énergie jouent un rôle croissant dans la transition
    énergétique européenne. Pourtant, les outils de gestion disponibles sont
    souvent propriétaires, coûteux ou inadaptés aux spécificités de ces structures.
    OptimCE répond à ce besoin avec une solution ouverte, conçue spécifiquement
    pour le contexte réglementaire européen — sans verrouillage fournisseur ni coûts cachés.
  offering_title: "Deux façons d'utiliser OptimCE"
  offering_intro: >-
    Que vous soyez une équipe technique ou que vous préfériez une solution clé en
    main, OptimCE s'adapte à votre situation.
  selfhost_badge: "Open source"
  selfhost_title: "Auto-hébergé"
  selfhost_text: >-
    Déployez OptimCE sur votre propre infrastructure, gratuitement et sans
    restriction, sous licence Apache 2.0. Vous gardez la maîtrise totale de vos
    données, mais vous assurez vous-même l'hébergement, les mises à jour et la
    disponibilité — aucune garantie de service (SLA) n'est fournie.
  selfhost_cta: "Voir sur GitHub"
  cloud_badge: "Alpha — gratuit"
  cloud_title: "OptimCE Cloud"
  cloud_text: >-
    La version hébergée et gérée, prête à l'emploi : aucune installation, aucune
    maintenance. OptimCE Cloud est actuellement en alpha et entièrement gratuit —
    profitez-en dès maintenant. Une offre payante verra le jour à mesure que le
    produit mûrit ; les utilisateurs de l'alpha seront prévenus bien à l'avance.
  cloud_cta: "Démarrer maintenant"
  origin_title: "Né d'un projet de recherche"
  origin_text: >-
    OptimCE est né de Locomotrice, un projet de recherche wallon (2023–2026) financé
    par le programme Win2Wal de la Région wallonne. Porté par l'Université de Liège
    (laboratoire BEMS) et le centre de recherche CECOTEPE, en collaboration avec des
    coopératives citoyennes d'énergie, Locomotrice vise à développer un logiciel open
    source de gestion des communautés d'énergie, co-construit avec les acteurs de terrain.
  origin_text2: >-
    Cette origine académique et citoyenne façonne OptimCE : un outil pensé pour les
    besoins réels des communautés d'énergie, validé sur le terrain et ouvert par conception.
  origin_facts:
    - label: "Programme"
      text: "Win2Wal — Région wallonne"
    - label: "Porteur"
      text: "Université de Liège — laboratoire BEMS"
    - label: "Partenaire recherche"
      text: "CECOTEPE"
    - label: "Terrain"
      text: "coopératives citoyennes d'énergie"
    - label: "Période"
      text: "2023–2026"
  contribute_title: "Contribuer"
  contribute_text: >-
    OptimCE est un projet open source et les contributions sont les bienvenues.
    Que vous soyez développeur, designer, traducteur ou simplement passionné
    par les communautés d'énergie, vous pouvez contribuer de nombreuses façons.
  contribute_cta: "Voir le projet sur GitHub"
  author_intro: "Les guides et les actualités de ce site sont rédigés par"

