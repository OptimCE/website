---
layout: default
---
<article class="page">
  <header class="page__header">
    <div class="container container--narrow">
      <h1 class="page__title">{{ page.title | fr_spacing: page.lang }}</h1>
      {% if page.subtitle %}
        <p class="page__subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </header>
  <div class="page__content">
    <div class="container container--narrow">
      {{ content | fr_spacing: page.lang }}
    </div>
  </div>
</article>
