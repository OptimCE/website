<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
<title id="t">Moving house: what to do, and when</title><desc id="d">Timeline of a move in Wallonia, in six steps. Ten weeks before: if you are in an energy community, tell its representative. One month before: find the DSO, the EAN code and a contract for the new home. Fourteen days before: tell your supplier in writing. On handover day: read and photograph the meters and sign the takeover document at each address. Within a month: send the readings, within the deadline your supplier publishes. Six weeks after the contract ends: closing bill to compare with the signed document.</desc>
<rect width="800" height="500" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="28" y="46" font-size="21" fill="#212529" font-weight="700" text-anchor="start">Moving house: what to do, and when</text>
<text x="28" y="72" font-size="13.5" fill="#495057" font-weight="400" text-anchor="start">Electricity and gas, in Wallonia</text>
<line x1="60" y1="264" x2="740" y2="264" stroke="#DEE2E6" stroke-width="4" stroke-linecap="round"/>
<line x1="130" y1="232" x2="130" y2="255" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="28" y="138" width="204" height="94" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M28 148 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="42" y="161" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">10 weeks before</text>
<text x="42" y="194" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">In an energy community: tell</text>
<text x="42" y="213" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">its representative</text>
<circle cx="130" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<line x1="238" y1="273" x2="238" y2="296" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="136" y="296" width="204" height="94" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M136 306 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="150" y="319" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">1 month before</text>
<text x="150" y="352" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">DSO, EAN code and contract</text>
<text x="150" y="371" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">for the new home</text>
<circle cx="238" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<line x1="346" y1="232" x2="346" y2="255" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="244" y="157" width="204" height="75" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M244 167 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="258" y="180" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">14 days before</text>
<text x="258" y="213" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Tell your supplier, in writing</text>
<circle cx="346" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<line x1="454" y1="273" x2="454" y2="296" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="352" y="296" width="204" height="113" rx="10" fill="#FFFFFF" stroke="#2e7d32" stroke-width="2"/>
<path d="M352 306 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#2e7d32"/>
<text x="366" y="319" font-size="14.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Handover day</text>
<text x="366" y="352" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Meters read and</text>
<text x="366" y="371" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">photographed, document</text>
<text x="366" y="390" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">signed, at both addresses</text>
<circle cx="454" cy="264" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
<line x1="562" y1="232" x2="562" y2="255" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="460" y="138" width="204" height="94" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M460 148 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="474" y="161" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">Within a month</text>
<text x="474" y="194" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Send the readings, within</text>
<text x="474" y="213" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">your supplier's own deadline</text>
<circle cx="562" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<line x1="670" y1="273" x2="670" y2="296" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="568" y="296" width="204" height="94" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M568 306 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="582" y="319" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">6 weeks after</text>
<text x="582" y="352" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Closing bill: compare it with</text>
<text x="582" y="371" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">the signed document</text>
<circle cx="670" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<text x="28" y="470" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Without a contract at the new address, the DSO can cut the supply at the end of the procedure, even in winter.</text>
</g></svg>
