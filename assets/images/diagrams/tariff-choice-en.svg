<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d">
<title id="t">Four routes, four parts of the bill</title><desc id="d">Comparative diagram of the four Belgian tariff routes: the social tariff acts on both energy and grid costs but depends on a status, the night-rate tariff acts on the grid tariff and varies by region, the dynamic contract acts on the energy component alone and requires a smart meter, and the energy community acts on the energy component of shared kilowatt-hours and stacks with both contract formulas.</desc>
<rect width="800" height="560" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="52" font-size="22" fill="#212529" font-weight="700">Four routes, four parts of the bill</text>
<text x="60" y="78" font-size="15" fill="#495057" font-weight="400">Which blocks of the bill each formula actually acts on</text>

<text x="299" y="116" font-size="12" fill="#ADB5BD" font-weight="600" text-anchor="middle">Energy 38.5%</text>
<text x="422" y="116" font-size="12" fill="#ADB5BD" font-weight="600" text-anchor="middle">Grid 29.7%</text>
<text x="523" y="116" font-size="12" fill="#ADB5BD" font-weight="600" text-anchor="middle">Taxes 26.1%</text>
<text x="580" y="116" font-size="11" fill="#ADB5BD" font-weight="600" text-anchor="middle">VAT</text>

<text x="60" y="147" font-size="15" fill="#212529" font-weight="400">Social tariff</text>
<rect x="230" y="128" width="136.6" height="28" rx="3" fill="#2e7d32"/>
<rect x="368.6" y="128" width="104.9" height="28" rx="3" fill="#2e7d32"/>
<rect x="475.5" y="128" width="92.0" height="28" rx="3" fill="#a5d6a7"/>
<rect x="569.5" y="128" width="20.5" height="28" rx="3" fill="#E9ECEF"/>
<text x="740" y="147" font-size="13" fill="#212529" font-weight="600" text-anchor="end">≈ €400/year</text>

<text x="60" y="205" font-size="15" fill="#212529" font-weight="400">Night-rate tariff</text>
<rect x="230" y="186" width="136.6" height="28" rx="3" fill="#a5d6a7"/>
<rect x="368.6" y="186" width="104.9" height="28" rx="3" fill="#2e7d32"/>
<rect x="475.5" y="186" width="92.0" height="28" rx="3" fill="#E9ECEF"/>
<rect x="569.5" y="186" width="20.5" height="28" rx="3" fill="#E9ECEF"/>
<text x="740" y="205" font-size="13" fill="#212529" font-weight="600" text-anchor="end">≈ €124 per appliance</text>

<text x="60" y="263" font-size="15" fill="#212529" font-weight="400">Dynamic contract</text>
<rect x="230" y="244" width="136.6" height="28" rx="3" fill="#2e7d32"/>
<rect x="368.6" y="244" width="104.9" height="28" rx="3" fill="#E9ECEF"/>
<rect x="475.5" y="244" width="92.0" height="28" rx="3" fill="#E9ECEF"/>
<rect x="569.5" y="244" width="20.5" height="28" rx="3" fill="#E9ECEF"/>
<text x="740" y="263" font-size="13" fill="#212529" font-weight="600" text-anchor="end">+€62 or −15%</text>

<text x="60" y="321" font-size="15" fill="#212529" font-weight="400">Energy community</text>
<rect x="230" y="302" width="136.6" height="28" rx="3" fill="#a5d6a7"/>
<rect x="368.6" y="302" width="104.9" height="28" rx="3" fill="#E9ECEF"/>
<rect x="475.5" y="302" width="92.0" height="28" rx="3" fill="#E9ECEF"/>
<rect x="569.5" y="302" width="20.5" height="28" rx="3" fill="#E9ECEF"/>
<text x="740" y="321" font-size="13" fill="#212529" font-weight="600" text-anchor="end">≈ €145 / 500 kWh</text>

<line x1="60" y1="352" x2="740" y2="352" stroke="#DEE2E6" stroke-width="1"/>
<rect x="60" y="368" width="14" height="14" rx="3" fill="#2e7d32" stroke="#DEE2E6"/>
<text x="82" y="380" font-size="14" fill="#212529" font-weight="400">Acts on this block</text>
<rect x="230" y="368" width="14" height="14" rx="3" fill="#a5d6a7" stroke="#DEE2E6"/>
<text x="252" y="380" font-size="14" fill="#212529" font-weight="400">Acts partially</text>
<rect x="410" y="368" width="14" height="14" rx="3" fill="#E9ECEF" stroke="#DEE2E6"/>
<text x="432" y="380" font-size="14" fill="#212529" font-weight="400">No effect</text>

<rect x="60" y="404" width="680" height="64" rx="6" fill="#e8f5e9"/>
<text x="80" y="430" font-size="14" fill="#1b5e20" font-weight="600">The energy community is the only route that stacks with the others:</text>
<text x="80" y="452" font-size="14" fill="#212529" font-weight="400">no supplier change, no building works, no income or flexibility condition.</text>

<text x="60" y="536" font-size="12" fill="#ADB5BD" font-weight="400">Bill shares: CREG monthly dashboard, June 2026 (3,500 kWh/year, single rate) — stacking conditions: CWaPE</text>
</g>
</svg>
