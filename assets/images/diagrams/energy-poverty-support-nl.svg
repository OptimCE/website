<text x="80" y="514" font-size="14" fill="#1b5e20" font-weight="600">37,5 % van de Waalse gezinnen verwarmt op stookolie, tegenover 7,5 % in Brussel.</text>
<text x="80" y="536" font-size="14" fill="#212529" font-weight="400">De enige brandstof zonder sociaal tarief — het Verwarmingsfonds stopt bij 300 €/jaar.</text>

<text x="60" y="592" font-size="12" fill="#ADB5BD" font-weight="400">Barometer energiearmoede 2024 (KBS) — SPW Énergie — Sociaal Verwarmingsfonds — situatie op 8 augustus 2026</text>
