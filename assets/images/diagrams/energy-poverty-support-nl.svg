<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Welke steun dekt welke brandstof in Wallonië?</title><desc id="d">Tabel van de zes belangrijkste energiesteunmaatregelen in Wallonië — sociaal tarief, Sociaal Verwarmingsfonds, MEBAR-premie, Gas-Elektriciteitsfonds, energietutor en gewaarborgde minimumlevering — afgezet tegen de drie verwarmingsbrandstoffen. De kolom stookolie is grotendeels ongedekt, terwijl 37,5 % van de Waalse gezinnen op die brandstof verwarmt, tegenover 7,5 % in Brussel.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="52" font-size="22" fill="#212529" font-weight="700">Het sociale energievangnet in Wallonië</text>
<text x="60" y="78" font-size="15" fill="#495057" font-weight="400">Zes maatregelen — en één brandstof die geen sociaal tarief dekt</text>

