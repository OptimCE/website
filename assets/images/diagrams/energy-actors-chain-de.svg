<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Wer macht was, vom Kraftwerk bis zum Zähler</title><desc id="d">Schema in zwei Reihen. Die erste folgt dem Strom: die Erzeugung (Kraftwerke, Windräder, Solaranlagen), die Übertragung durch Elia auf Hochspannung (Fluxys beim Gas), die Verteilung durch Ihren Netzbetreiber (ORES, RESA, Sibelga, Fluvius…), den Ihre Adresse bestimmt, dann Ihre Wohnung mit Zähler und EAN-Code. Die zweite folgt dem Vertrag und dem Geld: Sie zahlen eine einzige Rechnung an den Lieferanten, den Sie wählen; er behält die Energie und seine Marge, gibt die Netzkosten an den Netzbetreiber und Elia weiter, Steuern und MwSt. an die öffentliche Hand. Der Netzbetreiber liest Ihren Zähler ab und übermittelt Ihre Mengen an den Lieferanten. Ein Band nennt die Regulierungsbehörden: die CREG für die Übertragung auf föderaler Ebene; CWaPE, BRUGEL und VREG für die Verteilung in den Regionen.</desc>
