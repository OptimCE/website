<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">De levenscyclus van een administratief dossier in Wallonië</title><desc id="d">Schema van de levenscyclus van een administratief dossier van een energiegemeenschap in Wallonië: de bij de CWaPE ingediende kennisgeving opent een termijn van tien werkdagen waarin de regulator nagaat of het dossier volledig is; een volledig dossier ontvangt een ontvangstbevestiging die als bewijs van kennisgeving geldt, terwijl een onvolledig dossier binnen maximaal zes maanden vanaf de eerste ontvangstbevestiging moet worden vervolledigd, zo niet vervalt de kennisgeving. Voor de opgerichte gemeenschap gelden daarna twee terugkerende verplichtingen: elke wijziging van de oprichtingsvoorwaarden moet binnen vijftien werkdagen worden gemeld, en de jaarlijkse rapportering moet elk jaar uiterlijk op 1 september worden ingediend.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#ADB5BD"/></marker></defs>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="46" font-size="22" fill="#212529" font-weight="700">De levenscyclus van een administratief dossier</text>
<text x="60" y="70" font-size="15" fill="#495057" font-weight="400">Vier termijnen, twee bestemmelingen — en een verval zonder waarschuwing</text>

<text x="60" y="104" font-size="12" fill="#495057" font-weight="700">HET KENNISGEVINGSDOSSIER</text>
<line x1="60" y1="112" x2="740" y2="112" stroke="#DEE2E6" stroke-width="1"/>

<rect x="60" y="124" width="320" height="46" rx="4" fill="#2e7d32"/>
<text x="80" y="153" font-size="14" fill="#FFFFFF" font-weight="600">Kennisgeving ingediend bij de CWaPE</text>

<line x1="200" y1="170" x2="200" y2="192" stroke="#ADB5BD" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="216" y="187" font-size="12.5" fill="#495057" font-weight="600">10 werkdagen</text>

<rect x="60" y="196" width="320" height="46" rx="4" fill="#a5d6a7"/>
<text x="80" y="225" font-size="13.5" fill="#1b5e20" font-weight="600">Volledigheidscontrole</text>

<line x1="200" y1="242" x2="200" y2="258" stroke="#ADB5BD" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="60" y="262" width="320" height="64" rx="4" fill="#FFFFFF" stroke="#2e7d32" stroke-width="1.5"/>
<text x="80" y="288" font-size="14" fill="#1b5e20" font-weight="700">Dossier volledig</text>
<text x="80" y="309" font-size="11.5" fill="#495057" font-weight="400">Ontvangstbevestiging — bewijs van kennisgeving</text>

<rect x="420" y="262" width="320" height="64" rx="4" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<text x="440" y="288" font-size="14" fill="#495057" font-weight="700">Dossier onvolledig</text>
<text x="440" y="309" font-size="11.5" fill="#495057" font-weight="400">Max. 6 maanden vanaf de eerste bevestiging</text>

<line x1="580" y1="326" x2="580" y2="342" stroke="#ADB5BD" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="500" y="346" width="160" height="36" rx="4" fill="#E9ECEF"/>
<text x="580" y="369" font-size="12.5" fill="#495057" font-weight="700" text-anchor="middle">Kennisgeving vervalt</text>

<text x="60" y="418" font-size="12" fill="#495057" font-weight="700">DAARNA, ELK JAAR EN BIJ ELKE WIJZIGING</text>
<line x1="60" y1="426" x2="740" y2="426" stroke="#DEE2E6" stroke-width="1"/>

<text x="60" y="456" font-size="14" fill="#212529" font-weight="400">Wijziging van de oprichtingsvoorwaarden</text>
<rect x="395" y="438" width="170" height="26" rx="4" fill="#a5d6a7"/>
<text x="480" y="456" font-size="12" fill="#1b5e20" font-weight="600" text-anchor="middle">15 werkdagen</text>
<text x="740" y="456" font-size="12.5" fill="#495057" font-weight="600" text-anchor="end">CWaPE</text>

<text x="60" y="490" font-size="14" fill="#212529" font-weight="400">Jaarlijkse rapportering</text>
<rect x="395" y="472" width="170" height="26" rx="4" fill="#2e7d32"/>
<text x="480" y="490" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">1 september</text>
<text x="740" y="490" font-size="12.5" fill="#495057" font-weight="600" text-anchor="end">CWaPE</text>

<text x="60" y="524" font-size="14" fill="#212529" font-weight="400">Delen: formulieren, bijlagen, overeenkomst</text>
<text x="480" y="524" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="middle">geen vaste termijn</text>
<text x="740" y="524" font-size="12.5" fill="#495057" font-weight="600" text-anchor="end">Netbeheerder</text>

<rect x="60" y="544" width="680" height="52" rx="6" fill="#e8f5e9"/>
<text x="80" y="567" font-size="13" fill="#1b5e20" font-weight="600">Sinds 25 juni 2026 worden de kennisgeving, de wijzigingen ervan en de jaarlijkse</text>
<text x="80" y="586" font-size="13" fill="#212529" font-weight="400">rapportering ingediend via monespace.wallonie.be. Energiedelen blijft een bestand.</text>

<text x="60" y="612" font-size="12" fill="#ADB5BD" font-weight="400">CWaPE — kennisgevingsprocedure en bericht van 25 juni 2026 — situatie op 12 augustus 2026</text>
</g>
</svg>
