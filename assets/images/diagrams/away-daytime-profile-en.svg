<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Your output peaks while the house is empty</title><desc id="d">Chart overlaying three pieces of information across a twenty-four hour day. In the background, two horizontal bands show the Walloon tariff windows in force since 1 January 2026: off-peak hours run from 22:00 to 07:00 and from 11:00 to 17:00, peak hours from 07:00 to 11:00 and from 17:00 to 22:00. In the foreground, a bell curve shows the average output of a 4 kilowatt-peak south-facing photovoltaic system in Wallonia: it starts around 06:00, passes one thousand watts around 10:00, peaks at roughly 1,590 watts between 12:00 and 14:00, then falls away and dies out around 20:00. A shaded vertical band marks the household's absence window, from 09:00 to 17:00, and covers almost the entire area under the curve: 85.8 per cent of annual output falls inside it. Two narrow blocks at either end mark the hours when the household is home, before 09:00 in the morning and after 17:00 in the evening; under the curve those two blocks together hold only 14.2 per cent of output, of which 5.6 per cent after 18:00 and 0.3 per cent before 08:00. An annotation states that the 11:00 to 17:00 off-peak window introduced on 1 January 2026 captures 71.4 per cent of annual output on its own, against 28.8 per cent under the previous split, which placed off-peak hours at night on weekdays and across the whole weekend.</desc>
