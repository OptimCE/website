<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">De perimeter van een hernieuwbare-energiegemeenschap in Wallonië</title><desc id="d">Vergelijking van de twee nabijheidscriteria die de perimeter van een hernieuwbare-energiegemeenschap in Wallonië bepalen. Links het eerste criterium: alle productie-installaties waarvan de elektriciteit wordt gedeeld en alle deelnemers aan de deling bevinden zich op het grondgebied van één en dezelfde gemeente. Het schema toont een gemeentegrens met daarbinnen een school met zonnepanelen, een sporthal, een gebouw van het openbaar centrum voor maatschappelijk welzijn, het gemeentehuis en particuliere woningen. De gemeente moet niets aantonen: zij wijst haar eigen kaart aan, en de administratieve grens geldt als wettelijke perimeter, zonder enige controle bij de netbeheerder. Rechts het tweede criterium: alle aansluitingspunten van de deelnemers en van de productie-installaties moeten stroomafwaarts van hetzelfde hoogspanningsstation van de lokale transmissienetbeheerder liggen, beoordeeld op het moment van de vergunningsaanvraag. Het schema toont een elektrische boom die vertrekt van een hoogspanningsstation en zich vertakt naar drie groepen aansluitingspunten, aangevuld met een vierde losstaande groep die in dezelfde gemeente ligt maar op een ander station is aangesloten en daardoor is uitgesloten. Dit tweede criterium staat op geen enkele publieke kaart: het vereist een controle bij de netbeheerder en kan een straat in twee snijden. Een balk onderaan het schema herinnert eraan dat de twee criteria alternatief zijn, dat aan één ervan voldoen volstaat, en dat Wallonië de enige van de drie Belgische gewesten is waar de wetgever de perimeter zelf heeft getrokken in plaats van de leden hem in hun statuten te laten bepalen.</desc>
