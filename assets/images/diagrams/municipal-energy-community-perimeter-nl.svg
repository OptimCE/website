<text x="400" y="530" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle">De twee criteria zijn alternatief: aan één ervan voldoen volstaat.</text>
<text x="400" y="550" font-size="11" fill="#495057" font-weight="400" text-anchor="middle">Wallonië is de enige van de drie regio's waar de wetgever de perimeter zelf heeft getrokken — langs de gemeentegrens.</text>
