<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">The life cycle of an administrative dossier in Wallonia</title><desc id="d">Diagram of the life cycle of an energy community's administrative dossier in Wallonia: a notification filed with the CWaPE opens a ten-working-day window during which the regulator checks whether the dossier is complete; a complete dossier receives an acknowledgment that counts as proof of notification, while an incomplete dossier must be completed within a maximum of six months from the first acknowledgment, failing which the notification lapses. Two recurring obligations then apply to the constituted community: any change to the conditions of constitution must be notified within fifteen working days, and the annual report must be filed every year by 1 September at the latest.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#ADB5BD"/></marker></defs>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="46" font-size="22" fill="#212529" font-weight="700">The life cycle of an administrative dossier</text>
<text x="60" y="70" font-size="15" fill="#495057" font-weight="400">Four deadlines, two recipients — and a lapse that gives no warning</text>

<text x="60" y="104" font-size="12" fill="#495057" font-weight="700">THE NOTIFICATION DOSSIER</text>
<line x1="60" y1="112" x2="740" y2="112" stroke="#DEE2E6" stroke-width="1"/>

<rect x="60" y="124" width="320" height="46" rx="4" fill="#2e7d32"/>
<text x="80" y="153" font-size="14" fill="#FFFFFF" font-weight="600">Notification filed with the CWaPE</text>

<line x1="200" y1="170" x2="200" y2="192" stroke="#ADB5BD" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="216" y="187" font-size="12.5" fill="#495057" font-weight="600">10 working days</text>

<rect x="60" y="196" width="320" height="46" rx="4" fill="#a5d6a7"/>
<text x="80" y="225" font-size="13.5" fill="#1b5e20" font-weight="600">Completeness check</text>

<line x1="200" y1="242" x2="200" y2="258" stroke="#ADB5BD" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="60" y="262" width="320" height="64" rx="4" fill="#FFFFFF" stroke="#2e7d32" stroke-width="1.5"/>
<text x="80" y="288" font-size="14" fill="#1b5e20" font-weight="700">Dossier complete</text>
<text x="80" y="309" font-size="11.5" fill="#495057" font-weight="400">Acknowledgment — proof of notification</text>

<rect x="420" y="262" width="320" height="64" rx="4" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<text x="440" y="288" font-size="14" fill="#495057" font-weight="700">Dossier incomplete</text>
<text x="440" y="309" font-size="11.5" fill="#495057" font-weight="400">6 months max. from the first acknowledgment</text>

<line x1="580" y1="326" x2="580" y2="342" stroke="#ADB5BD" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="500" y="346" width="160" height="36" rx="4" fill="#E9ECEF"/>
<text x="580" y="369" font-size="12.5" fill="#495057" font-weight="700" text-anchor="middle">Notification lapses</text>

<text x="60" y="418" font-size="12" fill="#495057" font-weight="700">THEN, EVERY YEAR AND ON EVERY CHANGE</text>
<line x1="60" y1="426" x2="740" y2="426" stroke="#DEE2E6" stroke-width="1"/>

<text x="60" y="456" font-size="14" fill="#212529" font-weight="400">Change to the constitution</text>
<rect x="395" y="438" width="170" height="26" rx="4" fill="#a5d6a7"/>
<text x="480" y="456" font-size="12" fill="#1b5e20" font-weight="600" text-anchor="middle">15 working days</text>
<text x="740" y="456" font-size="12.5" fill="#495057" font-weight="600" text-anchor="end">CWaPE</text>

<text x="60" y="490" font-size="14" fill="#212529" font-weight="400">Annual report</text>
<rect x="395" y="472" width="170" height="26" rx="4" fill="#2e7d32"/>
<text x="480" y="490" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">1 September</text>
<text x="740" y="490" font-size="12.5" fill="#495057" font-weight="600" text-anchor="end">CWaPE</text>

<text x="60" y="524" font-size="14" fill="#212529" font-weight="400">Sharing: forms, annexes, agreement</text>
<text x="480" y="524" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="middle">no fixed deadline</text>
<text x="740" y="524" font-size="12.5" fill="#495057" font-weight="600" text-anchor="end">Grid operator</text>

<rect x="60" y="544" width="680" height="52" rx="6" fill="#e8f5e9"/>
<text x="80" y="567" font-size="13" fill="#1b5e20" font-weight="600">Since 25 June 2026, the notification, its changes and the annual report</text>
<text x="80" y="586" font-size="13" fill="#212529" font-weight="400">are filed on monespace.wallonie.be. Sharing remains a file you transmit yourself.</text>

<text x="60" y="612" font-size="12" fill="#ADB5BD" font-weight="400">CWaPE — notification procedure and notice of 25 June 2026 — as of 12 August 2026</text>
</g>
</svg>
