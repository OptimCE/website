<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">What a solar kilowatt-hour is worth in Wallonia in 2026</title><desc id="d">Diagram of the value of a solar kilowatt-hour in Wallonia in 2026: the installation first splits according to its commissioning date, before or after 1 January 2024, then each kilowatt-hour produced follows one of four destinations — self-consumed immediately for about 37 cents, stored in a battery and self-consumed later for the same value but at the cost of an investment, shared with other participants for 3 to 14 cents, or injected into the grid for only 1 to 5 cents.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="44" font-size="22" fill="#212529" font-weight="700">What a kilowatt-hour is worth, in Wallonia, in 2026</text>
<text x="60" y="70" font-size="15" fill="#495057" font-weight="400">Two regimes, four possible destinations — and a gap of 1 to 12</text>

<rect x="60" y="96" width="330" height="82" rx="6" fill="#e8f5e9"/>
<text x="80" y="122" font-size="14" fill="#1b5e20" font-weight="700">Commissioned before 01/01/2024</text>
<text x="80" y="144" font-size="12.5" fill="#212529" font-weight="400">Compensation secured until 31/12/2030.</text>
<text x="80" y="163" font-size="12.5" fill="#212529" font-weight="400">Sharing means giving it up: do the maths.</text>

<rect x="410" y="96" width="330" height="82" rx="6" fill="#2e7d32"/>
<text x="430" y="122" font-size="14" fill="#FFFFFF" font-weight="700">Commissioned from 01/01/2024</text>
<text x="430" y="144" font-size="12.5" fill="#c8e6c9" font-weight="400">No compensation, dual-flow meter.</text>
<text x="430" y="163" font-size="12.5" fill="#FFFFFF" font-weight="400">Nothing to lose: sharing is a net gain.</text>

<text x="60" y="214" font-size="15" fill="#212529" font-weight="700">Value of one kilowatt-hour produced, by destination</text>

<text x="60" y="250" font-size="14" fill="#212529" font-weight="400">Self-consumed on site</text>
<text x="60" y="267" font-size="11" fill="#495057" font-weight="400">37.8% of production, 86.5% of revenue</text>
<rect x="310" y="232" width="435" height="40" rx="4" fill="#2e7d32"/>
<text x="731" y="257" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="end">36.94 c€</text>

<text x="60" y="318" font-size="14" fill="#212529" font-weight="400">Stored, then self-consumed</text>
<text x="60" y="335" font-size="11" fill="#495057" font-weight="400">€4,000 to €10,000, 10 to 13-year payback</text>
<rect x="310" y="300" width="435" height="40" rx="4" fill="#a5d6a7"/>
<text x="731" y="325" font-size="14" fill="#1b5e20" font-weight="700" text-anchor="end">36.94 c€</text>

<text x="60" y="386" font-size="14" fill="#212529" font-weight="400">Shared with others</text>
<text x="60" y="403" font-size="11" fill="#495057" font-weight="400">no investment, price set by agreement</text>
<rect x="310" y="368" width="165" height="40" rx="4" fill="#66bb6a"/>
<text x="487" y="393" font-size="14" fill="#1b5e20" font-weight="700">3 to 14 c€</text>

<text x="60" y="454" font-size="14" fill="#212529" font-weight="400">Injected into the grid</text>
<text x="60" y="471" font-size="11" fill="#495057" font-weight="400">62.2% of production, 13.5% of revenue</text>
<rect x="310" y="436" width="58" height="40" rx="4" fill="#E9ECEF" stroke="#DEE2E6"/>
<text x="380" y="461" font-size="14" fill="#495057" font-weight="700">0.94 to 4.90 c€</text>

<line x1="60" y1="504" x2="740" y2="504" stroke="#DEE2E6" stroke-width="1"/>

<rect x="60" y="518" width="680" height="64" rx="6" fill="#e8f5e9"/>
<text x="80" y="544" font-size="14" fill="#1b5e20" font-weight="600">Sharing is the only lever that raises the value of the surplus without investment.</text>
<text x="80" y="566" font-size="14" fill="#212529" font-weight="400">On the 62% of production you do not absorb, it is the only free action available.</text>

<text x="60" y="604" font-size="12" fill="#ADB5BD" font-weight="400">CREG dashboard, June 2026 — Test-Achats, 28 May 2026 — ORES 2026 schedule — illustrative 4 kWp case described in the article</text>
</g>
</svg>
