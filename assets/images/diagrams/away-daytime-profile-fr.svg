<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Votre production tombe quand la maison est vide</title><desc id="d">Graphique superposant trois informations sur une journée de vingt-quatre heures. En arrière-plan, deux bandes horizontales représentent les plages tarifaires wallonnes en vigueur depuis le 1er janvier 2026 : les heures creuses couvrent 22 h à 7 h et 11 h à 17 h, les heures pleines couvrent 7 h à 11 h et 17 h à 22 h. Au premier plan, une courbe en cloche figure la production moyenne d'une installation photovoltaïque de 4 kilowatts-crête orientée plein sud en Wallonie : elle démarre vers 6 h, franchit mille watts vers 10 h, culmine à environ 1 590 watts entre 12 h et 14 h, puis redescend et s'éteint vers 20 h. Une zone grisée verticale marque la fenêtre d'absence du ménage, de 9 h à 17 h, et recouvre la quasi-totalité de la surface sous la courbe : 85,8 pour cent de la production annuelle s'y trouve. Deux blocs étroits aux extrémités matérialisent les heures de présence du ménage, le matin avant 9 h et le soir après 17 h ; sous la courbe, ces deux blocs ne rassemblent que 14,2 pour cent de la production, dont 5,6 pour cent après 18 h et 0,3 pour cent avant 8 h. Une annotation indique que la plage creuse de 11 h à 17 h, entrée en vigueur le 1er janvier 2026, capte à elle seule 71,4 pour cent de la production annuelle, contre 28,8 pour cent pour l'ancien découpage qui plaçait les heures creuses la nuit en semaine et durant tout le week-end.</desc>
