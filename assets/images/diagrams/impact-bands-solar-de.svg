<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Der Impact-Tarif folgt der Sonne</title><desc id="d">Ein 24-Stunden-Band mit den drei Zeitfenstern des Impact-Tarifs, an allen Wochentagen gleich: ECO von 1 bis 7 Uhr und von 11 bis 17 Uhr, MEDIUM von 7 bis 11 Uhr und von 22 bis 1 Uhr, PIC von 17 bis 22 Uhr, mit den ORES-Verteilnetztarifen 2026 von 2,71, 8,13 und 13,54 Cent pro Kilowattstunde ohne MwSt. Über dem Band zwei stündliche Kurven, berechnet über das Jahr 2023 für ein Solardach in Namur: die Solarproduktion, von der 70 Prozent in das ECO-Fenster fallen, 20 Prozent in MEDIUM und 10 Prozent in PIC, und der zwischen zwölf Haushalten geteilte Strom, von dem 59 Prozent in ECO fallen, 24 Prozent in MEDIUM und 17 Prozent in PIC.</desc>
