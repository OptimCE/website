<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">Deux factures coexistent</title><desc id="d">Deux cartes côte à côte : la facture du fournisseur et la facture du représentant du partage, avec ce que chacune contient.</desc>
<rect width="800" height="400" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="46" y="50" font-size="22" fill="#212529" font-weight="700" text-anchor="start">Deux factures coexistent</text>
<text x="46" y="76" font-size="14" fill="#495057" font-weight="400" text-anchor="start">Dans un partage d'énergie, chaque flux a son émetteur</text><rect x="46" y="104" width="336" height="230" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M46 114 a10 10 0 0 1 10 -10 h316 a10 10 0 0 1 10 10 v34 h-336 z" fill="#2e7d32"/><text x="62" y="133" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Facture du fournisseur</text><text x="62" y="170" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Émise par votre fournisseur d'énergie</text><circle cx="66" cy="200" r="3" fill="#2e7d32"/><text x="80" y="205" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Électricité résiduelle du réseau</text><circle cx="66" cy="230" r="3" fill="#2e7d32"/><text x="80" y="235" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Coûts de réseau et taxes</text><circle cx="66" cy="260" r="3" fill="#2e7d32"/><text x="80" y="265" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Accises et TVA</text><rect x="414" y="104" width="336" height="230" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M414 114 a10 10 0 0 1 10 -10 h316 a10 10 0 0 1 10 10 v34 h-336 z" fill="#66bb6a"/><text x="430" y="133" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Facture du partage</text><text x="430" y="170" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Émise par le représentant du partage</text><circle cx="434" cy="200" r="3" fill="#66bb6a"/><text x="448" y="205" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">kWh partagés au prix interne</text><circle cx="434" cy="230" r="3" fill="#66bb6a"/><text x="448" y="235" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Frais de gestion éventuels</text><circle cx="434" cy="260" r="3" fill="#66bb6a"/><text x="448" y="265" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Mentions légales obligatoires</text><text x="46" y="366" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Les coûts de réseau et les taxes restent dus sur l'électricité partagée.</text><text x="46" y="388" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="start">Cadres CWaPE, BRUGEL et VREG</text></g>
</svg>
