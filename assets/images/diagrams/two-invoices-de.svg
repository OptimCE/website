<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">Zwei Rechnungen nebeneinander</title><desc id="d">Zwei Karten nebeneinander: die Rechnung des Lieferanten und die des Vertreters der Teilung, mit ihren jeweiligen Bestandteilen.</desc>
<rect width="800" height="400" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="46" y="50" font-size="22" fill="#212529" font-weight="700" text-anchor="start">Zwei Rechnungen nebeneinander</text>
<text x="46" y="76" font-size="14" fill="#495057" font-weight="400" text-anchor="start">Bei der Energieteilung hat jeder Fluss seinen eigenen Aussteller</text><rect x="46" y="104" width="336" height="230" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M46 114 a10 10 0 0 1 10 -10 h316 a10 10 0 0 1 10 10 v34 h-336 z" fill="#2e7d32"/><text x="62" y="133" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Rechnung des Lieferanten</text><text x="62" y="170" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Ausgestellt von Ihrem Energielieferanten</text><circle cx="66" cy="200" r="3" fill="#2e7d32"/><text x="80" y="205" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Reststrom aus dem Netz</text><circle cx="66" cy="230" r="3" fill="#2e7d32"/><text x="80" y="235" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Netzkosten und Steuern</text><circle cx="66" cy="260" r="3" fill="#2e7d32"/><text x="80" y="265" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Akzisen und MwSt.</text><rect x="414" y="104" width="336" height="230" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M414 114 a10 10 0 0 1 10 -10 h316 a10 10 0 0 1 10 10 v34 h-336 z" fill="#66bb6a"/><text x="430" y="133" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Rechnung der Teilung</text><text x="430" y="170" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Ausgestellt vom Vertreter der Teilung</text><circle cx="434" cy="200" r="3" fill="#66bb6a"/><text x="448" y="205" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Geteilte kWh zum internen Preis</text><circle cx="434" cy="230" r="3" fill="#66bb6a"/><text x="448" y="235" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Etwaige Verwaltungsgebühren</text><circle cx="434" cy="260" r="3" fill="#66bb6a"/><text x="448" y="265" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Gesetzliche Pflichtangaben</text><text x="46" y="366" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Netzkosten und Steuern bleiben auf geteiltem Strom geschuldet.</text><text x="46" y="388" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="start">Rahmen von CWaPE, BRUGEL und VREG</text></g>
</svg>
