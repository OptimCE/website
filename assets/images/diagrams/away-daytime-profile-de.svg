<title id="t">Ihr Strom entsteht, wenn niemand zu Hause ist</title><desc id="d">Diagramm, das drei Informationen über einen Tag von vierundzwanzig Stunden überlagert. Im Hintergrund zeigen zwei waagerechte Bänder die seit dem 1. Januar 2026 geltenden wallonischen Tarifzeiten: die Schwachlastzeiten reichen von 22 bis 7 Uhr und von 11 bis 17 Uhr, die Hochlastzeiten von 7 bis 11 Uhr und von 17 bis 22 Uhr. Im Vordergrund zeigt eine Glockenkurve die mittlere Leistung einer nach Süden ausgerichteten Photovoltaikanlage von 4 Kilowatt-Peak in Wallonien: sie beginnt gegen 6 Uhr, überschreitet gegen 10 Uhr tausend Watt, erreicht zwischen 12 und 14 Uhr etwa 1 590 Watt und fällt danach bis gegen 20 Uhr auf null. Ein grau hinterlegter senkrechter Bereich markiert das Abwesenheitsfenster des Haushalts von 9 bis 17 Uhr und deckt nahezu die gesamte Fläche unter der Kurve ab: 85,8 Prozent der Jahresproduktion liegen darin. Zwei schmale Blöcke an den Rändern kennzeichnen die Anwesenheitszeiten des Haushalts, morgens vor 9 Uhr und abends nach 17 Uhr; unter der Kurve fassen diese beiden Blöcke zusammen nur 14,2 Prozent der Produktion, davon 5,6 Prozent nach 18 Uhr und 0,3 Prozent vor 8 Uhr. Eine Anmerkung hält fest, dass das am 1. Januar 2026 eingeführte Schwachlastfenster von 11 bis 17 Uhr allein 71,4 Prozent der Jahresproduktion erfasst, gegenüber 28,8 Prozent nach der früheren Einteilung, die die Schwachlastzeiten werktags in die Nacht und auf das gesamte Wochenende legte.</desc>
