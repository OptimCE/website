<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Wat u van uw meter noteert</title><desc id="d">Schema van vijf meters en wat u noteert. Enkelvoudige meter: één telwerk, u noteert 25003 zonder de decimaal. Tweevoudige meter: twee standen, piekuren (zon, I) 52002 en daluren (maan, II) 25003; daluren van 11 tot 17 uur en van 22 tot 7 uur. Exclusief nacht: een aparte meter, één stand, op de uren van de netbeheerder. Elektronische meter: één scherm waarop de registers elke 7 à 8 seconden wisselen, 1.8.1 piekuren, 1.8.2 daluren, 2.8.1 en 2.8.2 injectie. Digitale meter: elke dag op afstand uitgelezen, niets door te geven tenzij de netbeheerder erom vraagt.</desc>
