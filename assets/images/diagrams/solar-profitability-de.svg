<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Was eine Solarkilowattstunde in Wallonien 2026 wert ist</title><desc id="d">Schema des Werts einer Solarkilowattstunde in Wallonien 2026: Die Anlage teilt sich zunächst nach ihrem Inbetriebnahmedatum, vor oder nach dem 1. Januar 2024, dann folgt jede erzeugte Kilowattstunde einem von vier Wegen — sofort selbst verbraucht für etwa 37 Cent, in einer Batterie gespeichert und später selbst verbraucht zum gleichen Wert, aber um den Preis einer Investition, mit anderen Teilnehmern geteilt für 3 bis 14 Cent, oder ins Netz eingespeist für lediglich 1 bis 5 Cent.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="44" font-size="22" fill="#212529" font-weight="700">Was eine Kilowattstunde 2026 in Wallonien wert ist</text>
<text x="60" y="70" font-size="15" fill="#495057" font-weight="400">Zwei Regelungen, vier mögliche Wege — und ein Abstand von 1 zu 12</text>

<rect x="60" y="96" width="330" height="82" rx="6" fill="#e8f5e9"/>
<text x="80" y="122" font-size="14" fill="#1b5e20" font-weight="700">Inbetriebnahme vor dem 01.01.2024</text>
<text x="80" y="144" font-size="12.5" fill="#212529" font-weight="400">Kompensation gesichert bis 31.12.2030.</text>
<text x="80" y="163" font-size="12.5" fill="#212529" font-weight="400">Teilen heißt verzichten: nachrechnen.</text>

<rect x="410" y="96" width="330" height="82" rx="6" fill="#2e7d32"/>
<text x="430" y="122" font-size="14" fill="#FFFFFF" font-weight="700">Inbetriebnahme ab dem 01.01.2024</text>
<text x="430" y="144" font-size="12.5" fill="#c8e6c9" font-weight="400">Keine Kompensation, Zweirichtungszähler.</text>
<text x="430" y="163" font-size="12.5" fill="#FFFFFF" font-weight="400">Nichts zu verlieren: Teilen bringt netto.</text>

<text x="60" y="214" font-size="15" fill="#212529" font-weight="700">Wert einer erzeugten Kilowattstunde, je nach Verwendung</text>

<text x="60" y="250" font-size="14" fill="#212529" font-weight="400">Vor Ort selbst verbraucht</text>
<text x="60" y="267" font-size="11" fill="#495057" font-weight="400">37,8 % der Erzeugung, 86,5 % des Ertrags</text>
<rect x="310" y="232" width="435" height="40" rx="4" fill="#2e7d32"/>
<text x="731" y="257" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="end">36,94 c€</text>

<text x="60" y="318" font-size="14" fill="#212529" font-weight="400">Gespeichert, dann verbraucht</text>
<text x="60" y="335" font-size="11" fill="#495057" font-weight="400">4.000 bis 10.000 €, 10 bis 13 Jahre</text>
<rect x="310" y="300" width="435" height="40" rx="4" fill="#a5d6a7"/>
<text x="731" y="325" font-size="14" fill="#1b5e20" font-weight="700" text-anchor="end">36,94 c€</text>

<text x="60" y="386" font-size="14" fill="#212529" font-weight="400">Mit anderen geteilt</text>
<text x="60" y="403" font-size="11" fill="#495057" font-weight="400">keine Investition, Preis nach Vereinbarung</text>
<rect x="310" y="368" width="165" height="40" rx="4" fill="#66bb6a"/>
<text x="487" y="393" font-size="14" fill="#1b5e20" font-weight="700">3 bis 14 c€</text>

<text x="60" y="454" font-size="14" fill="#212529" font-weight="400">Ins Netz eingespeist</text>
<text x="60" y="471" font-size="11" fill="#495057" font-weight="400">62,2 % der Erzeugung, 13,5 % des Ertrags</text>
<rect x="310" y="436" width="58" height="40" rx="4" fill="#E9ECEF" stroke="#DEE2E6"/>
<text x="380" y="461" font-size="14" fill="#495057" font-weight="700">0,94 bis 4,90 c€</text>

<line x1="60" y1="504" x2="740" y2="504" stroke="#DEE2E6" stroke-width="1"/>

<rect x="60" y="518" width="680" height="64" rx="6" fill="#e8f5e9"/>
<text x="80" y="544" font-size="14" fill="#1b5e20" font-weight="600">Teilen ist der einzige Hebel, der den Überschuss ohne Investition aufwertet.</text>
<text x="80" y="566" font-size="14" fill="#212529" font-weight="400">Bei den 62 % der Erzeugung, die Sie nicht aufnehmen, ist es die einzige Gratis-Option.</text>

<text x="60" y="604" font-size="12" fill="#ADB5BD" font-weight="400">CREG-Dashboard Juni 2026 — Test-Achats, 28. Mai 2026 — ORES-Tarifliste 2026 — illustrativer Fall von 4 kWp aus dem Artikel</text>
</g>
</svg>
