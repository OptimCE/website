<title id="t">Une journée de partage, quart d'heure par quart d'heure</title><desc id="d">Graphique d'une journée de partage, le mardi 13 juin 2023, pour une communauté de référence : une toiture solaire de 24 kilowatts-crête à Namur et douze ménages qui consomment chacun 3 500 kilowattheures par an. L'axe horizontal couvre les 96 quarts d'heure de la journée, de 0 h à 24 h ; l'axe vertical donne l'énergie de chaque quart d'heure, de 0 à 5 kilowattheures. La production de la toiture, nulle la nuit, commence vers 5 h 15, culmine à 4,72 kilowattheures dans le quart d'heure de 13 h et s'éteint vers 22 h : 152,9 kilowattheures sur la journée. La consommation des douze ménages varie entre 0,68 et 1,73 kilowattheure par quart d'heure, avec une pointe vers 7 h 15 et une plus forte vers 18 h 45 : 93,9 kilowattheures. La zone verte, l'énergie partagée, vaut à chaque quart d'heure le plus petit des deux volumes : 50,6 kilowattheures. De 8 h 15 à 18 h 30, la production dépasse la consommation, et le surplus, 102,3 kilowattheures en ambre, part sur le réseau. Le matin et le soir, c'est l'inverse : le complément, 43,3 kilowattheures en gris, vient du fournisseur de chaque ménage. Trois repères marquent 7 h 00, 12 h 30 et 19 h 00, les quarts d'heure détaillés dans le tableau de l'article. Une note rappelle qu'un kilowattheure consommé en un quart d'heure correspond à 4 kilowatts de puissance moyenne. Sources : PVGIS pour la production, profil synthétique de consommation, qui n'est pas un profil Synergrid.</desc>
