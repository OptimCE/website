<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d">
<title id="t">Le même ménage, cinq factures de réseau</title><desc id="d">Graphique en barres : pour le même ménage de 3 408 kWh par an, la distribution coûte en 2026, TVA comprise, 334 € chez l'AIEG, 349 € chez RESA, 361 € chez ORES, 389 € chez le REW et 410 € chez l'AIESH en bihoraire sans rien changer, et 283 € chez l'AIEG, 293 € chez RESA, 313 € chez ORES, 329 € chez le REW et 353 € chez l'AIESH au tarif Impact en déplaçant une partie de la consommation.</desc>
