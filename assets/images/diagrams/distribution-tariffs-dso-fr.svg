<text x="82" y="116" font-size="14" fill="#212529">Bihoraire, sans rien changer</text>
<rect x="380" y="104" width="14" height="14" rx="3" fill="#2E7D32"/>
<text x="402" y="116" font-size="14" fill="#212529">Tarif Impact, consommation déplacée</text>
