<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Ce que coûte l'absorption d'un kilowattheure de surplus</title><desc id="d">Échelle des cinq options de valorisation d'un surplus solaire en Belgique en 2026 : le ballon d'eau chaude absorbe 800 à 1 400 kWh par an pour 400 à 900 euros d'investissement, la recharge de voiture électrique 300 à 1 500 kWh pour 0 à 2 500 euros, le partage d'énergie la totalité du surplus pour zéro euro mais à 3 à 14 centimes le kilowattheure, l'injection le solde pour zéro euro à 1 à 5 centimes, et la batterie domestique environ 1 400 kWh pour 7 000 à 12 000 euros.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="44" font-size="22" fill="#212529" font-weight="700">Ce que coûte l'absorption d'un kilowattheure de surplus</text>
<text x="60" y="70" font-size="13.5" fill="#495057" font-weight="400">Investissement par kWh absorbé chaque année — plus la barre est longue, plus il coûte cher</text>
<text x="60" y="108" font-size="11.5" fill="#495057" font-weight="700">Option et valeur d'un kWh</text>
<text x="300" y="108" font-size="11.5" fill="#495057" font-weight="700">Investissement par kWh absorbé et par an</text>
<text x="740" y="108" font-size="11.5" fill="#495057" font-weight="700" text-anchor="end">Volume absorbable</text>
<line x1="60" y1="118" x2="740" y2="118" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="152" font-size="14" fill="#212529" font-weight="700">Partager</text>
<text x="60" y="170" font-size="11" fill="#495057" font-weight="400">3 à 14 c€/kWh</text>
<rect x="300" y="138" width="6" height="32" rx="4" fill="#2e7d32"/>
<text x="316" y="159" font-size="13.5" fill="#1b5e20" font-weight="700">0 €</text>
<text x="740" y="159" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">tout le surplus</text>
<line x1="60" y1="186" x2="740" y2="186" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="224" font-size="14" fill="#212529" font-weight="700">Injecter</text>
<text x="60" y="242" font-size="11" fill="#495057" font-weight="400">1 à 5 c€/kWh</text>
<rect x="300" y="210" width="6" height="32" rx="4" fill="#2e7d32"/>
<text x="316" y="231" font-size="13.5" fill="#1b5e20" font-weight="700">0 €</text>
<text x="740" y="231" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">le solde</text>
<line x1="60" y1="258" x2="740" y2="258" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="296" font-size="14" fill="#212529" font-weight="700">Ballon d'eau chaude</text>
<text x="60" y="314" font-size="11" fill="#495057" font-weight="400">20 à 37 c€/kWh</text>
<rect x="300" y="282" width="39" height="32" rx="4" fill="#2e7d32"/>
<text x="349" y="303" font-size="13.5" fill="#1b5e20" font-weight="700">≈ 0,65 €</text>
<text x="740" y="303" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">800 à 1 400 kWh</text>
<line x1="60" y1="330" x2="740" y2="330" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="368" font-size="14" fill="#212529" font-weight="700">Voiture électrique</text>
<text x="60" y="386" font-size="11" fill="#495057" font-weight="400">20 à 30 c€/kWh</text>
<rect x="300" y="354" width="131" height="32" rx="4" fill="#2e7d32"/>
<text x="419" y="375" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="end">0 à 2,17 €</text>
<text x="740" y="375" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">300 à 1 500 kWh</text>
<line x1="60" y1="402" x2="740" y2="402" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="440" font-size="14" fill="#212529" font-weight="700">Batterie domestique</text>
<text x="60" y="458" font-size="11" fill="#495057" font-weight="400">27 à 34 c€/kWh</text>
<rect x="300" y="426" width="340" height="32" rx="4" fill="#2e7d32"/>
<text x="628" y="447" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="end">≈ 5,65 €</text>
<text x="740" y="447" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">≈ 1 400 kWh</text>
<text x="60" y="500" font-size="11.5" fill="#495057" font-weight="400">Les deux options gratuites valorisent moins le kilowattheure : elles complètent l'absorption sur place, elles ne la remplacent pas.</text>
<text x="60" y="534" font-size="14" fill="#212529" font-weight="700">L'ordre rationnel de dépense</text>
<rect x="60" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="112" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1 Décaler</text>
<rect x="173" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="225" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2 Ballon</text>
<rect x="286" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="338" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3 Voiture</text>
<rect x="399" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="451" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4 Partager</text>
<rect x="512" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="564" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5 Injecter</text>
<rect x="625" y="550" width="105" height="40" rx="6" fill="#e8f5e9"/>
<text x="677" y="575" font-size="11.5" fill="#1b5e20" font-weight="700" text-anchor="middle">6 Batterie</text>
</g>
</svg>
