<path d="M28 148 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="42" y="161" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">10 Wochen vorher</text>
<text x="42" y="194" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">In einer Energiegemeinschaft:</text>
<text x="42" y="213" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">den Vertreter informieren</text>
<circle cx="130" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<line x1="238" y1="273" x2="238" y2="296" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="136" y="296" width="204" height="113" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M136 306 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="150" y="319" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">1 Monat vorher</text>
<text x="150" y="352" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Netzbetreiber, EAN-Code</text>
<text x="150" y="371" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">und Vertrag der neuen</text>
<text x="150" y="390" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Wohnung</text>
<circle cx="238" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<line x1="346" y1="232" x2="346" y2="255" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="244" y="138" width="204" height="94" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M244 148 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="258" y="161" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">14 Tage vorher</text>
<text x="258" y="194" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Den Lieferanten schriftlich</text>
<text x="258" y="213" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">informieren</text>
<circle cx="346" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<line x1="454" y1="273" x2="454" y2="296" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="352" y="296" width="204" height="132" rx="10" fill="#FFFFFF" stroke="#2e7d32" stroke-width="2"/>
<path d="M352 306 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#2e7d32"/>
<text x="366" y="319" font-size="14.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Schlüsselübergabe</text>
<text x="366" y="352" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Zähler ablesen und</text>
<text x="366" y="371" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">fotografieren, Dokument an</text>
<text x="366" y="390" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">beiden Adressen</text>
<text x="366" y="409" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">unterzeichnen</text>
<circle cx="454" cy="264" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
<line x1="562" y1="232" x2="562" y2="255" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="460" y="138" width="204" height="94" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M460 148 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="474" y="161" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">Binnen eines Monats</text>
<text x="474" y="194" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Zählerstände senden, in der</text>
<text x="474" y="213" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Frist des Lieferanten</text>
<circle cx="562" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<line x1="670" y1="273" x2="670" y2="296" stroke="#2e7d32" stroke-width="1.5"/>
<rect x="568" y="296" width="204" height="94" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M568 306 a10 10 0 0 1 10 -10 h184 a10 10 0 0 1 10 10 v24 h-204 z" fill="#E8F5E9"/>
<text x="582" y="319" font-size="14.5" fill="#2e7d32" font-weight="700" text-anchor="start">6 Wochen danach</text>
<text x="582" y="352" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Schlussrechnung: mit dem</text>
<text x="582" y="371" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Dokument vergleichen</text>
<circle cx="670" cy="264" r="8" fill="#2e7d32" stroke="#FFFFFF" stroke-width="2"/>
<text x="28" y="470" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Ohne Vertrag an der neuen Adresse kann der Netzbetreiber am Ende des Verfahrens sperren, auch im Winter.</text>
</g></svg>
