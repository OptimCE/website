<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
<title id="t">Umziehen: was wann zu tun ist</title><desc id="d">Zeitleiste eines Umzugs in der Wallonie, in sechs Schritten. Zehn Wochen vorher: Wer in einer Energiegemeinschaft ist, informiert deren Vertreter. Einen Monat vorher: Netzbetreiber, EAN-Code und Vertrag der neuen Wohnung klären. Vierzehn Tage vorher: den Lieferanten schriftlich informieren. Am Tag der Schlüsselübergabe: Zähler ablesen und fotografieren, an jeder Adresse das Übergabedokument unterzeichnen. Binnen eines Monats: die Zählerstände senden, in der vom Lieferanten veröffentlichten Frist. Sechs Wochen nach Vertragsende: die Schlussrechnung mit dem unterschriebenen Dokument vergleichen.</desc>
<rect width="800" height="500" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="28" y="46" font-size="21" fill="#212529" font-weight="700" text-anchor="start">Umziehen: was wann zu tun ist</text>
<text x="28" y="72" font-size="13.5" fill="#495057" font-weight="400" text-anchor="start">Strom und Gas, in der Wallonie</text>
<line x1="60" y1="264" x2="740" y2="264" stroke="#DEE2E6" stroke-width="4" stroke-linecap="round"/>
<line x1="130" y1="232" x2="130" y2="255" stroke="#2e7d32" stroke-width="1.5"/>
