<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
<title id="t">Du relevé à la clé appliquée</title><desc id="d">Schéma en cinq étapes : données au quart d'heure, génération ou simulation, clé candidate, validation par les membres, transmission au gestionnaire de réseau.</desc>
<rect width="800" height="330" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="30" y="50" font-size="22" fill="#212529" font-weight="700" text-anchor="start">Du relevé à la clé appliquée</text>
<text x="30" y="76" font-size="14" fill="#495057" font-weight="400" text-anchor="start">Le parcours d'une clé de répartition, étape par étape</text><rect x="30" y="120" width="132" height="100" rx="9" fill="#e8f5e9" stroke="#DEE2E6"/><text x="42" y="146" font-size="12" fill="#1b5e20" font-weight="700" text-anchor="start">1</text><text x="96" y="172" font-size="13" fill="#212529" font-weight="600" text-anchor="middle">Données réelles</text><text x="96" y="189" font-size="13" fill="#212529" font-weight="600" text-anchor="middle">au quart d'heure</text><path d="M168 170 h4" stroke="#ADB5BD" stroke-width="2"/><path d="M172 170 l-6 -4 v8 z" fill="#ADB5BD"/><rect x="180" y="120" width="132" height="100" rx="9" fill="#c8e6c9" stroke="#DEE2E6"/><text x="192" y="146" font-size="12" fill="#1b5e20" font-weight="700" text-anchor="start">2</text><text x="246" y="172" font-size="13" fill="#212529" font-weight="600" text-anchor="middle">Génération</text><text x="246" y="189" font-size="13" fill="#212529" font-weight="600" text-anchor="middle">ou simulation</text><path d="M318 170 h4" stroke="#ADB5BD" stroke-width="2"/><path d="M322 170 l-6 -4 v8 z" fill="#ADB5BD"/><rect x="330" y="120" width="132" height="100" rx="9" fill="#81c784" stroke="#DEE2E6"/><text x="342" y="146" font-size="12" fill="#1b5e20" font-weight="700" text-anchor="start">3</text><text x="396" y="172" font-size="13" fill="#212529" font-weight="600" text-anchor="middle">Clé candidate</text><text x="396" y="189" font-size="13" fill="#212529" font-weight="600" text-anchor="middle">et performance</text><path d="M468 170 h4" stroke="#ADB5BD" stroke-width="2"/><path d="M472 170 l-6 -4 v8 z" fill="#ADB5BD"/><rect x="480" y="120" width="132" height="100" rx="9" fill="#43a047" stroke="#DEE2E6"/><text x="492" y="146" font-size="12" fill="#c8e6c9" font-weight="700" text-anchor="start">4</text><text x="546" y="172" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Validation par</text><text x="546" y="189" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">les membres</text><path d="M618 170 h4" stroke="#ADB5BD" stroke-width="2"/><path d="M622 170 l-6 -4 v8 z" fill="#ADB5BD"/><rect x="630" y="120" width="132" height="100" rx="9" fill="#1b5e20" stroke="#DEE2E6"/><text x="642" y="146" font-size="12" fill="#c8e6c9" font-weight="700" text-anchor="start">5</text><text x="696" y="172" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Transmission</text><text x="696" y="189" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">au GRD</text><text x="30" y="264" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Le module propose ; la communauté décide. L'avenant et la transmission restent des étapes distinctes.</text><text x="30" y="312" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="start">Modules « Clés de répartition » et « Génération » d'OptimCE</text></g>
</svg>
