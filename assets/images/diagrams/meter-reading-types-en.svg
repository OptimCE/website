<rect x="430" y="184" width="19" height="30" rx="3" fill="#212529"/>
<text x="439.5" y="205.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="453" y="210" font-size="18" fill="#212529" font-weight="700" text-anchor="start">,</text>
<rect x="461" y="184" width="19" height="30" rx="3" fill="#c62828"/>
<text x="470.5" y="205.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="304" y="238" font-size="14" fill="#2e7d32" font-weight="700" text-anchor="start">Note: both readings</text>
<text x="304" y="260" font-size="12.5" fill="#495057" font-weight="400" text-anchor="start">Off-peak: 11:00–17:00</text>
<text x="304" y="277" font-size="12.5" fill="#495057" font-weight="400" text-anchor="start">and 22:00–07:00, every day</text>
<rect x="530" y="96" width="224" height="190" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M530 106 a10 10 0 0 1 10 -10 h204 a10 10 0 0 1 10 10 v24 h-224 z" fill="#2e7d32"/>
