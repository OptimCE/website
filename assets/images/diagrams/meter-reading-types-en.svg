<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">What to note on your meter</title><desc id="d">Diagram of five meters and what to note. Single rate: one register, note 25003 without the decimal. Dual rate: two readings, peak (sun, I) 52002 and off-peak (moon, II) 25003; off-peak from 11:00 to 17:00 and from 22:00 to 07:00. Exclusive night: a separate meter, one reading, at hours set by the DSO. Electronic: one screen where the registers change every 7 to 8 seconds, 1.8.1 peak, 1.8.2 off-peak, 2.8.1 and 2.8.2 injection. Smart meter: read remotely every day, nothing to send unless the DSO asks.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="46" y="46" font-size="21" fill="#212529" font-weight="700" text-anchor="start">What to note on your meter</text>
<text x="46" y="72" font-size="13.5" fill="#495057" font-weight="400" text-anchor="start">Five meters: never note the digits after the decimal separator</text>
