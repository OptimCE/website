<text x="58" y="327" font-size="14.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Electronic</text>
<rect x="62" y="352" width="118" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="72" y="370" font-size="12" fill="#1b5e20" font-weight="700" text-anchor="start">1.8.1</text>
<text x="72" y="398" font-size="17" fill="#212529" font-weight="700" text-anchor="start" font-family="ui-monospace,Consolas,'Courier New',monospace">003202,2</text>
<text x="62" y="432" font-size="14" fill="#2e7d32" font-weight="700" text-anchor="start">Note: 3202</text>
<text x="192" y="364" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="start">1.8.1</text>
<text x="230" y="364" font-size="12" fill="#212529" font-weight="400" text-anchor="start">peak, consumed</text>
<text x="192" y="383" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="start">1.8.2</text>
<text x="230" y="383" font-size="12" fill="#212529" font-weight="400" text-anchor="start">off-peak, consumed</text>
<text x="192" y="402" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="start">2.8.1</text>
<text x="230" y="402" font-size="12" fill="#212529" font-weight="400" text-anchor="start">peak, injected</text>
<text x="192" y="421" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="start">2.8.2</text>
<text x="230" y="421" font-size="12" fill="#212529" font-weight="400" text-anchor="start">off-peak, injected</text>
<text x="62" y="458" font-size="12" fill="#495057" font-weight="400" text-anchor="start">A new register every 7 to 8 s: wait for the right code</text>
<rect x="409" y="304" width="345" height="170" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
<path d="M409 314 a10 10 0 0 1 10 -10 h325 a10 10 0 0 1 10 10 v24 h-345 z" fill="#1b5e20"/>
<text x="421" y="327" font-size="14.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Smart meter</text>
<rect x="425" y="352" width="160" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="435" y="370" font-size="12" fill="#1b5e20" font-weight="700" text-anchor="start">1.8.1</text>
<text x="435" y="398" font-size="17" fill="#212529" font-weight="700" text-anchor="start" font-family="ui-monospace,Consolas,'Courier New',monospace">000011.155</text>
<text x="575" y="398" font-size="12" fill="#495057" font-weight="400" text-anchor="end">kWh</text>
<text x="599" y="370" font-size="13" fill="#2e7d32" font-weight="700" text-anchor="start">Nothing to send</text>
<text x="599" y="390" font-size="12" fill="#212529" font-weight="400" text-anchor="start">Read remotely,</text>
<text x="599" y="406" font-size="12" fill="#212529" font-weight="400" text-anchor="start">every day</text>
<text x="425" y="432" font-size="12.5" fill="#495057" font-weight="700" text-anchor="start">Unless the DSO asks:</text>
<text x="425" y="450" font-size="12.5" fill="#495057" font-weight="400" text-anchor="start">1.8.1 and 1.8.2, plus 2.8.x</text>
<text x="425" y="466" font-size="12.5" fill="#495057" font-weight="400" text-anchor="start">if you inject</text>
<text x="46" y="503" font-size="11.5" fill="#868E96" font-weight="400" text-anchor="start">Sources: ORES meter-reading brochure (August 2026); AIEG; REW; CWaPE, 2026 dual-rate hours.</text>
