<text x="242" y="301" font-size="14.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Le fournisseur</text>
<text x="242" y="334" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Choisi par vous</text>
<text x="242" y="353" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Contrat et prix de l'énergie</text>
<text x="242" y="372" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Encaisse toute la facture</text>
<path d="M450 338 H462 M462 300 V376" fill="none" stroke="#868E96" stroke-width="1.6"/>
<path d="M462 300 H476 m-6 -5 l6 5 l-6 5" fill="none" stroke="#868E96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="480" y="284" width="274" height="32" rx="6" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
<text x="492" y="305" font-size="12.5" fill="#212529" font-weight="400" text-anchor="start">Énergie et marge : il les garde</text>
<path d="M462 338 H476 m-6 -5 l6 5 l-6 5" fill="none" stroke="#868E96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="480" y="322" width="274" height="32" rx="6" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
<text x="492" y="343" font-size="12.5" fill="#212529" font-weight="400" text-anchor="start">Frais de réseau : reversés au GRD et à Elia</text>
<path d="M462 376 H476 m-6 -5 l6 5 l-6 5" fill="none" stroke="#868E96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="480" y="360" width="274" height="32" rx="6" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
<text x="492" y="381" font-size="12.5" fill="#212529" font-weight="400" text-anchor="start">Taxes et TVA : reversées aux pouvoirs publics</text>
<text x="46" y="428" font-size="12.5" fill="#495057" font-weight="400" text-anchor="start">Le GRD relève votre compteur et transmet vos volumes au fournisseur, qui les facture.</text>
<rect x="46" y="452" width="708" height="34" rx="8" fill="#E8F5E9"/>
<text x="58" y="474" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="start">Contrôle : CREG pour le transport (fédéral) · CWaPE, Brugel, VREG pour la distribution (régions)</text>
<text x="46" y="508" font-size="11.5" fill="#868E96" font-weight="400" text-anchor="start">Sources : CWaPE, CREG, ORES, Fluxys</text>
</g>
</svg>
