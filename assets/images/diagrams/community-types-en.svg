<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">REC, CEC and LEC</title><desc id="d">Comparison of the three energy community statuses — REC, CEC and LEC — with their proximity and scope constraints.</desc>
<rect width="800" height="450" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="46" y="52" font-size="22" fill="#212529" font-weight="700" text-anchor="start">REC, CEC and LEC</text>
<text x="46" y="78" font-size="14" fill="#495057" font-weight="400" text-anchor="start">Three statuses, three logics of proximity and scope</text><rect x="46" y="104" width="232" height="288" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M46 114 a10 10 0 0 1 10 -10 h212 a10 10 0 0 1 10 10 v40 h-232 z" fill="#2e7d32"/><text x="162" y="136" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">CER</text><text x="162" y="178" font-size="13" fill="#495057" font-weight="400" text-anchor="middle">Renewable energy</text><text x="162" y="195" font-size="13" fill="#495057" font-weight="400" text-anchor="middle">community</text><circle cx="68" cy="233" r="3" fill="#2e7d32"/><text x="82" y="238" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Renewable only</text><circle cx="68" cy="266" r="3" fill="#2e7d32"/><text x="82" y="271" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Proximity required</text><circle cx="68" cy="299" r="3" fill="#2e7d32"/><text x="82" y="304" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Electricity</text><text x="82" y="321" font-size="13" fill="#212529" font-weight="400" text-anchor="start">and heat</text><rect x="292" y="104" width="232" height="288" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M292 114 a10 10 0 0 1 10 -10 h212 a10 10 0 0 1 10 10 v40 h-232 z" fill="#66bb6a"/><text x="408" y="136" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">CEC</text><text x="408" y="178" font-size="13" fill="#495057" font-weight="400" text-anchor="middle">Citizen energy</text><text x="408" y="195" font-size="13" fill="#495057" font-weight="400" text-anchor="middle">community</text><circle cx="314" cy="233" r="3" fill="#66bb6a"/><text x="328" y="238" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Technology-</text><text x="328" y="255" font-size="13" fill="#212529" font-weight="400" text-anchor="start">neutral</text><circle cx="314" cy="283" r="3" fill="#66bb6a"/><text x="328" y="288" font-size="13" fill="#212529" font-weight="400" text-anchor="start">No proximity</text><text x="328" y="305" font-size="13" fill="#212529" font-weight="400" text-anchor="start">requirement</text><circle cx="314" cy="333" r="3" fill="#66bb6a"/><text x="328" y="338" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Electricity only</text><rect x="538" y="104" width="232" height="288" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M538 114 a10 10 0 0 1 10 -10 h212 a10 10 0 0 1 10 10 v40 h-232 z" fill="#81c784"/><text x="654" y="136" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">CEL</text><text x="654" y="178" font-size="13" fill="#495057" font-weight="400" text-anchor="middle">Local energy</text><text x="654" y="195" font-size="13" fill="#495057" font-weight="400" text-anchor="middle">community</text><circle cx="560" cy="233" r="3" fill="#81c784"/><text x="574" y="238" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Brussels framework</text><circle cx="560" cy="266" r="3" fill="#81c784"/><text x="574" y="271" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Defined local</text><text x="574" y="288" font-size="13" fill="#212529" font-weight="400" text-anchor="start">perimeter</text><circle cx="560" cy="316" r="3" fill="#81c784"/><text x="574" y="321" font-size="13" fill="#212529" font-weight="400" text-anchor="start">BRUGEL</text><text x="574" y="338" font-size="13" fill="#212529" font-weight="400" text-anchor="start">supervision</text><text x="46" y="428" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="start">Directives (EU) 2018/2001 and (EU) 2019/944, transposed per region</text></g>
</svg>
