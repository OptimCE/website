<text x="286" y="551" text-anchor="end" font-size="12" fill="#495057">Hauptwohnsitz — 9 Jahre</text>
<rect x="300" y="534" width="300" height="24" rx="4" fill="#e8f5e9" stroke="#DEE2E6"/>
<rect x="300" y="534" width="8" height="24" rx="4" fill="#2e7d32"/>
<text x="614" y="551" font-size="12" font-weight="700" fill="#2e7d32">ein Sechsunddreißigstel</text>
<text x="400" y="596" text-anchor="middle" font-size="11.5" fill="#868E96">Auch die Kündigungsfrist des Mieters beträgt drei Monate.</text>
