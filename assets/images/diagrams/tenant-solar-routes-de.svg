<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Was ein Mieter tatsächlich besitzt</title>
<desc id="d">Dreispaltiges Schaubild mit dem Titel „Was ein Mieter tatsächlich besitzt“. Die linke, durchgestrichene Spalte führt auf, was dem Eigentümer gehört: das Dach, die Fassade, das Gebäude, die Investitionsprämien und die Stimme in der Eigentümerversammlung. Die hervorgehobene mittlere Spalte führt die beiden Vermögenswerte des Mieters auf: zum einen den EAN-Code der Entnahmestelle, also den Zähler auf seinen Namen, zum anderen seit dem 17. April 2025 ein mobiles Plug-and-Play-Photovoltaikset, das in eine Steckdose gesteckt und wieder abgebaut werden kann. Ein Pfeil führt vom Set zu einem mittigen Kasten mit der Aufschrift „kommunizierender Zähler, kostenlos und automatisch gesetzt“, ein zweiter Pfeil von diesem Kasten zur rechten Spalte. Die rechte Spalte zeigt die beiden Wege: den direkten Eigenverbrauch des Sets, bewertet mit 36,94 Eurocent je Kilowattstunde, und das Teilen von Strom, beziffert auf etwa 145 Euro im Jahr für 500 bezogene Kilowattstunden ohne jede Investition. Am unteren Rand zeigt ein waagerechtes Band den Zeitversatz: ein Balken von drei Monaten steht für die rund sechzig Werktage bis zum Beitritt zu einer Teilung, verglichen mit drei Mietdauern, einem Jahr beim Studentenmietvertrag, drei Jahren beim Kurzzeitvertrag und neun Jahren beim Hauptwohnsitzvertrag. Ein Hinweis ergänzt, dass auch die Kündigungsfrist des Mieters drei Monate beträgt.</desc>
