<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">The perimeter of a renewable energy community in Wallonia</title><desc id="d">Comparison of the two proximity criteria that define the perimeter of a renewable energy community in Wallonia. On the left, the first criterion: every generation installation whose electricity is shared and every participant in the sharing sit within one single and same municipal territory. The diagram shows a municipal boundary containing a school fitted with photovoltaic panels, a sports hall, a public welfare centre building, the town hall and private homes. The municipality has nothing to demonstrate: it points at its own map, and the administrative boundary serves as the legal perimeter, with no check needed from the network operator. On the right, the second criterion: all connection points of participants and of generation installations must sit downstream of the same high-voltage substation of the local transmission network operator, assessed at the time of the authorisation request. The diagram shows an electrical tree starting from a high-voltage substation and branching towards three groups of connection points, plus a fourth detached group located in the same municipality but connected to a different substation, and therefore excluded. This second criterion appears on no public map: it requires a check with the network operator and can cut a street in two. A band at the bottom of the diagram recalls that the two criteria are alternative, that satisfying one is enough, and that Wallonia is the only one of the three Belgian regions where the legislator drew the perimeter itself rather than leaving members to define it in their own articles of association.</desc>
