<text x="574.0" y="411" font-size="12.5" fill="#495057" font-weight="700" text-anchor="middle">Mandatory check with the</text>
<text x="574.0" y="427" font-size="12.5" fill="#495057" font-weight="700" text-anchor="middle">distribution system operator</text>
<text x="574.0" y="458" font-size="10" fill="#6c757d" font-weight="400" text-anchor="middle">Shown on no public map</text>
<rect x="60" y="506" width="680" height="62" rx="8" fill="#e8f5e9"/>
<text x="400" y="530" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle">The two criteria are alternative: satisfying one of them is enough.</text>
<text x="400" y="550" font-size="11" fill="#495057" font-weight="400" text-anchor="middle">Wallonia is the only one of the three regions where the legislator drew the perimeter itself — along the municipal boundary.</text>
