<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Wie doet wat, van centrale tot meter</title><desc id="d">Schema in twee rijen. De eerste volgt de stroom: de productie (centrales, windturbines, zonnepanelen), de transmissie door Elia op hoogspanning (Fluxys voor aardgas), de distributie door uw netbeheerder (Fluvius, Sibelga, ORES, RESA…), bepaald door uw adres, en dan uw woning, met meter en EAN-code. De tweede volgt het contract en het geld: u betaalt één factuur aan de leverancier, die u kiest; hij houdt de energie en zijn marge, stort de nettarieven door aan de netbeheerder en Elia, en de belastingen en btw aan de overheid. De netbeheerder leest uw meter af en bezorgt uw volumes aan de leverancier. Een band toont de regulatoren: de CREG voor de transmissie, op federaal niveau; de VREG, BRUGEL en de CWaPE voor de distributie, in de gewesten.</desc>
