<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">What it costs to absorb one kilowatt-hour of surplus</title><desc id="d">Ladder of the five ways to use a solar surplus in Belgium in 2026: the hot-water tank absorbs 800 to 1,400 kWh a year for 400 to 900 euros of investment, electric-car charging 300 to 1,500 kWh for 0 to 2,500 euros, energy sharing the entire surplus for zero euros but at 3 to 14 cents per kilowatt-hour, export the remainder for zero euros at 1 to 5 cents, and a home battery around 1,400 kWh for 7,000 to 12,000 euros.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="44" font-size="22" fill="#212529" font-weight="700">What it costs to absorb one kilowatt-hour of surplus</text>
<text x="60" y="70" font-size="13.5" fill="#495057" font-weight="400">Investment per kWh absorbed each year — the longer the bar, the dearer that kilowatt-hour</text>
<text x="60" y="108" font-size="11.5" fill="#495057" font-weight="700">Option and value of a kWh</text>
<text x="300" y="108" font-size="11.5" fill="#495057" font-weight="700">Investment per kWh absorbed, per year</text>
<text x="740" y="108" font-size="11.5" fill="#495057" font-weight="700" text-anchor="end">Absorbable volume</text>
<line x1="60" y1="118" x2="740" y2="118" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="152" font-size="14" fill="#212529" font-weight="700">Share</text>
<text x="60" y="170" font-size="11" fill="#495057" font-weight="400">3 to 14 c€/kWh</text>
<rect x="300" y="138" width="6" height="32" rx="4" fill="#2e7d32"/>
<text x="316" y="159" font-size="13.5" fill="#1b5e20" font-weight="700">€0</text>
<text x="740" y="159" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">the whole surplus</text>
<line x1="60" y1="186" x2="740" y2="186" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="224" font-size="14" fill="#212529" font-weight="700">Export</text>
<text x="60" y="242" font-size="11" fill="#495057" font-weight="400">1 to 5 c€/kWh</text>
<rect x="300" y="210" width="6" height="32" rx="4" fill="#2e7d32"/>
<text x="316" y="231" font-size="13.5" fill="#1b5e20" font-weight="700">€0</text>
<text x="740" y="231" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">the remainder</text>
<line x1="60" y1="258" x2="740" y2="258" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="296" font-size="14" fill="#212529" font-weight="700">Hot-water tank</text>
<text x="60" y="314" font-size="11" fill="#495057" font-weight="400">20 to 37 c€/kWh</text>
<rect x="300" y="282" width="39" height="32" rx="4" fill="#2e7d32"/>
<text x="349" y="303" font-size="13.5" fill="#1b5e20" font-weight="700">≈ €0.65</text>
<text x="740" y="303" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">800 to 1,400 kWh</text>
<line x1="60" y1="330" x2="740" y2="330" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="368" font-size="14" fill="#212529" font-weight="700">Electric car</text>
<text x="60" y="386" font-size="11" fill="#495057" font-weight="400">20 to 30 c€/kWh</text>
<rect x="300" y="354" width="131" height="32" rx="4" fill="#2e7d32"/>
<text x="419" y="375" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="end">€0 to €2.17</text>
<text x="740" y="375" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">300 to 1,500 kWh</text>
<line x1="60" y1="402" x2="740" y2="402" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="440" font-size="14" fill="#212529" font-weight="700">Home battery</text>
<text x="60" y="458" font-size="11" fill="#495057" font-weight="400">27 to 34 c€/kWh</text>
<rect x="300" y="426" width="340" height="32" rx="4" fill="#2e7d32"/>
<text x="628" y="447" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="end">≈ €5.65</text>
<text x="740" y="447" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">≈ 1,400 kWh</text>
<text x="60" y="500" font-size="11.5" fill="#495057" font-weight="400">The two free options value the kilowatt-hour less: they complete absorption on site, they do not replace it.</text>
<text x="60" y="534" font-size="14" fill="#212529" font-weight="700">The rational order of spending</text>
<rect x="60" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="112" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1 Shift</text>
<rect x="173" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="225" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2 Tank</text>
<rect x="286" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="338" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3 Car</text>
<rect x="399" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="451" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4 Share</text>
<rect x="512" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="564" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5 Export</text>
<rect x="625" y="550" width="105" height="40" rx="6" fill="#e8f5e9"/>
<text x="677" y="575" font-size="11.5" fill="#1b5e20" font-weight="700" text-anchor="middle">6 Battery</text>
</g>
</svg>
