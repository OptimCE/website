<title id="t">Uw productie valt terwijl het huis leeg staat</title><desc id="d">Grafiek die drie gegevens over een dag van vierentwintig uur op elkaar legt. Op de achtergrond tonen twee horizontale banden de Waalse tariefvensters die sinds 1 januari 2026 gelden: de daluren lopen van 22 tot 7 uur en van 11 tot 17 uur, de piekuren van 7 tot 11 uur en van 17 tot 22 uur. Op de voorgrond toont een klokvormige curve het gemiddelde vermogen van een op het zuiden gerichte fotovoltaïsche installatie van 4 kilowattpiek in Wallonië: ze begint rond 6 uur, passeert duizend watt rond 10 uur, bereikt tussen 12 en 14 uur ongeveer 1 590 watt en daalt daarna tot ze rond 20 uur uitdooft. Een grijs gearceerde verticale zone markeert het afwezigheidsvenster van het gezin, van 9 tot 17 uur, en bedekt nagenoeg de volledige oppervlakte onder de curve: 85,8 procent van de jaarproductie valt erbinnen. Twee smalle blokken aan de uiteinden markeren de uren waarop het gezin thuis is, 's ochtends voor 9 uur en 's avonds na 17 uur; onder de curve bevatten die twee blokken samen slechts 14,2 procent van de productie, waarvan 5,6 procent na 18 uur en 0,3 procent voor 8 uur. Een annotatie vermeldt dat het dalvenster van 11 tot 17 uur, ingevoerd op 1 januari 2026, op zichzelf 71,4 procent van de jaarproductie opvangt, tegenover 28,8 procent met de vroegere indeling die de daluren 's nachts op weekdagen en tijdens het hele weekend plaatste.</desc>
