<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">Two invoices coexist</title><desc id="d">Two cards side by side: the supplier invoice and the sharing representative's invoice, with what each one contains.</desc>
<rect width="800" height="400" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="46" y="50" font-size="22" fill="#212529" font-weight="700" text-anchor="start">Two invoices coexist</text>
<text x="46" y="76" font-size="14" fill="#495057" font-weight="400" text-anchor="start">In energy sharing, each flow has its own issuer</text><rect x="46" y="104" width="336" height="230" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M46 114 a10 10 0 0 1 10 -10 h316 a10 10 0 0 1 10 10 v34 h-336 z" fill="#2e7d32"/><text x="62" y="133" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Supplier invoice</text><text x="62" y="170" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Issued by your energy supplier</text><circle cx="66" cy="200" r="3" fill="#2e7d32"/><text x="80" y="205" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Residual electricity from the grid</text><circle cx="66" cy="230" r="3" fill="#2e7d32"/><text x="80" y="235" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Network costs and taxes</text><circle cx="66" cy="260" r="3" fill="#2e7d32"/><text x="80" y="265" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Excise duties and VAT</text><rect x="414" y="104" width="336" height="230" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M414 114 a10 10 0 0 1 10 -10 h316 a10 10 0 0 1 10 10 v34 h-336 z" fill="#66bb6a"/><text x="430" y="133" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Sharing invoice</text><text x="430" y="170" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Issued by the sharing representative</text><circle cx="434" cy="200" r="3" fill="#66bb6a"/><text x="448" y="205" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Shared kWh at the internal price</text><circle cx="434" cy="230" r="3" fill="#66bb6a"/><text x="448" y="235" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Any management fees</text><circle cx="434" cy="260" r="3" fill="#66bb6a"/><text x="448" y="265" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Mandatory legal mentions</text><text x="46" y="366" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Network costs and taxes remain payable on shared electricity.</text><text x="46" y="388" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="start">CWaPE, BRUGEL and VREG frameworks</text></g>
</svg>
