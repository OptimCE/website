<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Wat het kost om één kilowattuur overschot op te nemen</title><desc id="d">Ladder van de vijf manieren om een zonne-overschot te valoriseren in België in 2026: de warmwaterboiler neemt 800 tot 1.400 kWh per jaar op voor 400 tot 900 euro investering, het laden van een elektrische auto 300 tot 1.500 kWh voor 0 tot 2.500 euro, energiedelen het volledige overschot voor nul euro maar aan 3 tot 14 cent per kilowattuur, injectie het saldo voor nul euro aan 1 tot 5 cent, en een thuisbatterij ongeveer 1.400 kWh voor 7.000 tot 12.000 euro.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="44" font-size="22" fill="#212529" font-weight="700">Wat het kost om één kilowattuur overschot op te nemen</text>
<text x="60" y="70" font-size="13.5" fill="#495057" font-weight="400">Investering per kWh die jaarlijks wordt opgenomen — hoe langer de balk, hoe duurder</text>
<text x="60" y="108" font-size="11.5" fill="#495057" font-weight="700">Optie en waarde van een kWh</text>
<text x="300" y="108" font-size="11.5" fill="#495057" font-weight="700">Investering per kWh opgenomen, per jaar</text>
<text x="740" y="108" font-size="11.5" fill="#495057" font-weight="700" text-anchor="end">Opneembaar volume</text>
<line x1="60" y1="118" x2="740" y2="118" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="152" font-size="14" fill="#212529" font-weight="700">Delen</text>
<text x="60" y="170" font-size="11" fill="#495057" font-weight="400">3 tot 14 c€/kWh</text>
<rect x="300" y="138" width="6" height="32" rx="4" fill="#2e7d32"/>
<text x="316" y="159" font-size="13.5" fill="#1b5e20" font-weight="700">0 €</text>
<text x="740" y="159" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">het hele overschot</text>
<line x1="60" y1="186" x2="740" y2="186" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="224" font-size="14" fill="#212529" font-weight="700">Injecteren</text>
<text x="60" y="242" font-size="11" fill="#495057" font-weight="400">1 tot 5 c€/kWh</text>
<rect x="300" y="210" width="6" height="32" rx="4" fill="#2e7d32"/>
<text x="316" y="231" font-size="13.5" fill="#1b5e20" font-weight="700">0 €</text>
<text x="740" y="231" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">het saldo</text>
<line x1="60" y1="258" x2="740" y2="258" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="296" font-size="14" fill="#212529" font-weight="700">Warmwaterboiler</text>
<text x="60" y="314" font-size="11" fill="#495057" font-weight="400">20 tot 37 c€/kWh</text>
<rect x="300" y="282" width="39" height="32" rx="4" fill="#2e7d32"/>
<text x="349" y="303" font-size="13.5" fill="#1b5e20" font-weight="700">≈ 0,65 €</text>
<text x="740" y="303" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">800 tot 1.400 kWh</text>
<line x1="60" y1="330" x2="740" y2="330" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="368" font-size="14" fill="#212529" font-weight="700">Elektrische auto</text>
<text x="60" y="386" font-size="11" fill="#495057" font-weight="400">20 tot 30 c€/kWh</text>
<rect x="300" y="354" width="131" height="32" rx="4" fill="#2e7d32"/>
<text x="419" y="375" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="end">0 tot 2,17 €</text>
<text x="740" y="375" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">300 tot 1.500 kWh</text>
<line x1="60" y1="402" x2="740" y2="402" stroke="#DEE2E6" stroke-width="1"/>
<text x="60" y="440" font-size="14" fill="#212529" font-weight="700">Thuisbatterij</text>
<text x="60" y="458" font-size="11" fill="#495057" font-weight="400">27 tot 34 c€/kWh</text>
<rect x="300" y="426" width="340" height="32" rx="4" fill="#2e7d32"/>
<text x="628" y="447" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="end">≈ 5,65 €</text>
<text x="740" y="447" font-size="12.5" fill="#212529" font-weight="400" text-anchor="end">≈ 1.400 kWh</text>
<text x="60" y="500" font-size="11.5" fill="#495057" font-weight="400">De twee gratis opties waarderen de kilowattuur lager: ze vullen de opname ter plaatse aan, ze vervangen die niet.</text>
<text x="60" y="534" font-size="14" fill="#212529" font-weight="700">De rationele uitgavenvolgorde</text>
<rect x="60" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="112" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1 Verschuiven</text>
<rect x="173" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="225" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2 Boiler</text>
<rect x="286" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="338" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3 Auto</text>
<rect x="399" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="451" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4 Delen</text>
<rect x="512" y="550" width="105" height="40" rx="6" fill="#2e7d32"/>
<text x="564" y="575" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5 Injecteren</text>
<rect x="625" y="550" width="105" height="40" rx="6" fill="#e8f5e9"/>
<text x="677" y="575" font-size="11.5" fill="#1b5e20" font-weight="700" text-anchor="middle">6 Batterij</text>
</g>
</svg>
