<text x="595" y="207" font-size="13" fill="#495057" font-weight="600" text-anchor="middle">non</text>
<rect x="647" y="184" width="93" height="36" rx="4" fill="#2e7d32"/>
<text x="694" y="207" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">oui</text>

<text x="60" y="259" font-size="14" fill="#212529" font-weight="400">Prime MEBAR</text>
<text x="250" y="259" font-size="13" fill="#212529" font-weight="600">max 2 000 €</text>
<rect x="455" y="236" width="88" height="36" rx="4" fill="#2e7d32"/>
<text x="499" y="259" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">oui</text>
