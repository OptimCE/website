<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Quelles aides couvrent quel chauffage en Wallonie ?</title><desc id="d">Tableau des six principaux dispositifs d'aide énergie en Wallonie — tarif social, Fonds social chauffage, prime MEBAR, Fonds Gaz-Électricité, tuteur énergie et fourniture minimale garantie — croisés avec les trois vecteurs de chauffage. La colonne mazout est majoritairement non couverte, alors que 37,5 % des ménages wallons se chauffent à ce combustible, contre 7,5 % à Bruxelles.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="52" font-size="22" fill="#212529" font-weight="700">Le filet social énergie en Wallonie</text>
<text x="60" y="78" font-size="15" fill="#495057" font-weight="400">Six dispositifs — et un vecteur de chauffage qu'aucun tarif social ne couvre</text>

<text x="250" y="114" font-size="13" fill="#495057" font-weight="700">Montant / portée</text>
<text x="499" y="114" font-size="13" fill="#495057" font-weight="700" text-anchor="middle">Élec.</text>
<text x="595" y="114" font-size="13" fill="#495057" font-weight="700" text-anchor="middle">Gaz</text>
<text x="694" y="114" font-size="13" fill="#495057" font-weight="700" text-anchor="middle">Mazout</text>

<text x="60" y="155" font-size="14" fill="#212529" font-weight="400">Tarif social</text>
<text x="250" y="155" font-size="13" fill="#212529" font-weight="600">≈ 400 €/an</text>
<rect x="455" y="132" width="88" height="36" rx="4" fill="#2e7d32"/>
<text x="499" y="155" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">oui</text>
<rect x="551" y="132" width="88" height="36" rx="4" fill="#2e7d32"/>
<text x="595" y="155" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">oui</text>
<rect x="647" y="132" width="93" height="36" rx="4" fill="#E9ECEF"/>
<text x="694" y="155" font-size="13" fill="#495057" font-weight="600" text-anchor="middle">non</text>

<text x="60" y="207" font-size="14" fill="#212529" font-weight="400">Fonds social chauffage</text>
<text x="250" y="207" font-size="13" fill="#212529" font-weight="600">max 300 €/an</text>
<rect x="455" y="184" width="88" height="36" rx="4" fill="#E9ECEF"/>
<text x="499" y="207" font-size="13" fill="#495057" font-weight="600" text-anchor="middle">non</text>
