<text x="595" y="415" font-size="13" fill="#1b5e20" font-weight="600" text-anchor="middle">hiver</text>
<rect x="647" y="392" width="93" height="36" rx="4" fill="#E9ECEF"/>
<text x="694" y="415" font-size="13" fill="#495057" font-weight="600" text-anchor="middle">non</text>

<line x1="60" y1="440" x2="740" y2="440" stroke="#DEE2E6" stroke-width="1"/>
<rect x="60" y="454" width="14" height="14" rx="3" fill="#2e7d32" stroke="#DEE2E6"/>
<text x="82" y="466" font-size="14" fill="#212529" font-weight="400">Couvert</text>
<rect x="230" y="454" width="14" height="14" rx="3" fill="#a5d6a7" stroke="#DEE2E6"/>
<text x="252" y="466" font-size="14" fill="#212529" font-weight="400">Partiel</text>
<rect x="410" y="454" width="14" height="14" rx="3" fill="#E9ECEF" stroke="#DEE2E6"/>
