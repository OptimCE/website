<rect x="60" y="488" width="680" height="64" rx="6" fill="#e8f5e9"/>
<text x="80" y="514" font-size="14" fill="#1b5e20" font-weight="600">37,5 % des ménages wallons se chauffent au mazout, contre 7,5 % à Bruxelles.</text>
<text x="80" y="536" font-size="14" fill="#212529" font-weight="400">C'est le seul vecteur sans tarif social — le Fonds chauffage y plafonne à 300 €/an.</text>

<text x="60" y="592" font-size="12" fill="#ADB5BD" font-weight="400">Baromètre de la précarité énergétique 2024 (FRB) — SPW Énergie — Fonds social chauffage — situation au 8 août 2026</text>
</g>
