<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Ce que vaut un kilowattheure photovoltaïque en Wallonie en 2026</title><desc id="d">Schéma de la valeur d'un kilowattheure photovoltaïque en Wallonie en 2026 : l'installation se sépare d'abord selon sa date de mise en service, avant ou après le 1er janvier 2024, puis chaque kilowattheure produit suit l'un de quatre destins — autoconsommé immédiatement pour environ 37 centimes, stocké en batterie puis autoconsommé plus tard pour la même valeur mais au prix d'un investissement, partagé avec d'autres participants pour 3 à 14 centimes, ou injecté sur le réseau pour 1 à 5 centimes seulement.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="44" font-size="22" fill="#212529" font-weight="700">Ce que vaut un kilowattheure, en Wallonie, en 2026</text>
<text x="60" y="70" font-size="15" fill="#495057" font-weight="400">Deux régimes, quatre destins possibles — et un écart de 1 à 12</text>

<rect x="60" y="96" width="330" height="82" rx="6" fill="#e8f5e9"/>
<text x="80" y="122" font-size="14" fill="#1b5e20" font-weight="700">Mise en service avant le 01/01/2024</text>
<text x="80" y="144" font-size="12.5" fill="#212529" font-weight="400">Compensation acquise jusqu'au 31/12/2030.</text>
<text x="80" y="163" font-size="12.5" fill="#212529" font-weight="400">Partager oblige à y renoncer : à calculer.</text>

<rect x="410" y="96" width="330" height="82" rx="6" fill="#2e7d32"/>
<text x="430" y="122" font-size="14" fill="#FFFFFF" font-weight="700">Mise en service à partir du 01/01/2024</text>
<text x="430" y="144" font-size="12.5" fill="#c8e6c9" font-weight="400">Aucune compensation, compteur double flux.</text>
<text x="430" y="163" font-size="12.5" fill="#FFFFFF" font-weight="400">Rien à perdre : le partage est un gain net.</text>

<text x="60" y="214" font-size="15" fill="#212529" font-weight="700">Valeur d'un kilowattheure produit, selon ce qu'il devient</text>

<text x="60" y="250" font-size="14" fill="#212529" font-weight="400">Autoconsommé sur place</text>
<text x="60" y="267" font-size="11" fill="#495057" font-weight="400">37,8 % de la production, 86,5 % du revenu</text>
<rect x="310" y="232" width="435" height="40" rx="4" fill="#2e7d32"/>
<text x="731" y="257" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="end">36,94 c€</text>

<text x="60" y="318" font-size="14" fill="#212529" font-weight="400">Stocké puis autoconsommé</text>
<text x="60" y="335" font-size="11" fill="#495057" font-weight="400">4 000 à 10 000 €, retour 10 à 13 ans</text>
<rect x="310" y="300" width="435" height="40" rx="4" fill="#a5d6a7"/>
<text x="731" y="325" font-size="14" fill="#1b5e20" font-weight="700" text-anchor="end">36,94 c€</text>

<text x="60" y="386" font-size="14" fill="#212529" font-weight="400">Partagé avec d'autres</text>
<text x="60" y="403" font-size="11" fill="#495057" font-weight="400">aucun investissement, prix de convention</text>
<rect x="310" y="368" width="165" height="40" rx="4" fill="#66bb6a"/>
<text x="487" y="393" font-size="14" fill="#1b5e20" font-weight="700">3 à 14 c€</text>

<text x="60" y="454" font-size="14" fill="#212529" font-weight="400">Injecté sur le réseau</text>
<text x="60" y="471" font-size="11" fill="#495057" font-weight="400">62,2 % de la production, 13,5 % du revenu</text>
<rect x="310" y="436" width="58" height="40" rx="4" fill="#E9ECEF" stroke="#DEE2E6"/>
<text x="380" y="461" font-size="14" fill="#495057" font-weight="700">0,94 à 4,90 c€</text>

<line x1="60" y1="504" x2="740" y2="504" stroke="#DEE2E6" stroke-width="1"/>

<rect x="60" y="518" width="680" height="64" rx="6" fill="#e8f5e9"/>
<text x="80" y="544" font-size="14" fill="#1b5e20" font-weight="600">Le partage est le seul levier qui augmente la valeur du surplus sans investissement.</text>
<text x="80" y="566" font-size="14" fill="#212529" font-weight="400">Sur les 62 % de production que vous n'absorbez pas, c'est la seule action gratuite.</text>

<text x="60" y="604" font-size="12" fill="#ADB5BD" font-weight="400">CREG, tableau de bord juin 2026 — Test-Achats, 28 mai 2026 — grille ORES 2026 — cas illustratif de 4 kWc décrit dans l'article</text>
</g>
</svg>
