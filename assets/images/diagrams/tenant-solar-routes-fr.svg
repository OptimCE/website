<text x="659" y="226" text-anchor="middle" font-size="11.5" fill="#495057">≈ 145 €/an pour 500 kWh</text>
<text x="659" y="243" text-anchor="middle" font-size="11.5" fill="#495057">sans rien investir</text>
<rect x="262" y="296" width="518" height="66" rx="8" fill="#2e7d32"/>
<text x="521" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Compteur communicant</text>
