<line x1="20" y1="392" x2="780" y2="392" stroke="#DEE2E6"/>
<text x="20" y="418" font-size="13.5" font-weight="700" fill="#212529">Le décalage des horloges : rejoindre un partage prend environ 3 mois</text>
<text x="286" y="463" text-anchor="end" font-size="12" fill="#495057">Bail étudiant — 1 an</text>
