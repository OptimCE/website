<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Ce qu'un locataire possède réellement</title>
<desc id="d">Schéma en trois colonnes intitulé « Ce qu'un locataire possède réellement ». La colonne de gauche, barrée, rassemble ce qui appartient au propriétaire : la toiture, la façade, le bâtiment, les primes à l'investissement et le vote en assemblée générale. La colonne centrale, mise en avant, rassemble les deux actifs du locataire : d'une part le code EAN du point de fourniture, c'est-à-dire le compteur à son nom, d'autre part depuis le 17 avril 2025 un kit photovoltaïque mobile de type Plug and Play, qui se branche sur une prise et se démonte. Une flèche part du kit vers un encadré central marqué « compteur communicant, pose gratuite et systématique », et une seconde flèche repart de cet encadré vers la colonne de droite. La colonne de droite présente les deux débouchés : à gauche l'autoconsommation directe du kit, valorisée à 36,94 centimes d'euro par kilowattheure, et à droite le partage d'énergie, chiffré à environ 145 euros par an pour 500 kilowattheures reçus et ne demandant aucun investissement. En bas du schéma, une bande horizontale figure le décalage des horloges : une barre de trois mois représente le délai d'environ soixante jours ouvrables pour rejoindre un partage, comparée à trois durées de bail, un an pour le bail étudiant, trois ans pour le bail de courte durée et neuf ans pour le bail de résidence principale. Une mention indique que le préavis du preneur est également de trois mois.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect width="800" height="620" fill="#FFFFFF"/>
