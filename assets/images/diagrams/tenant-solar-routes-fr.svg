<text x="388" y="145" text-anchor="middle" font-size="11.5" fill="#495057">le compteur à votre nom</text>
<rect x="278" y="180" width="220" height="68" rx="6" fill="#FFFFFF" stroke="#2e7d32"/>
<text x="388" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#212529">Un kit Plug &amp; Play</text>
<text x="388" y="229" text-anchor="middle" font-size="11.5" fill="#495057">mobile, depuis le 17/04/2025</text>
<rect x="538" y="58" width="242" height="212" rx="8" fill="#fdf0e3" stroke="#DEE2E6"/>
<text x="659" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#495057">Deux débouchés</text>
