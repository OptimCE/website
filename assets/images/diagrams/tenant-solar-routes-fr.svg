<rect x="300" y="446" width="75" height="24" rx="4" fill="#2e7d32"/>
<text x="614" y="463" font-size="12" font-weight="700" fill="#2e7d32">un quart du bail</text>
<text x="286" y="507" text-anchor="end" font-size="12" fill="#495057">Courte durée — 3 ans</text>
<rect x="300" y="490" width="300" height="24" rx="4" fill="#e8f5e9" stroke="#DEE2E6"/>
<rect x="300" y="490" width="25" height="24" rx="4" fill="#2e7d32"/>
<text x="614" y="507" font-size="12" font-weight="700" fill="#2e7d32">un douzième</text>
<text x="286" y="551" text-anchor="end" font-size="12" fill="#495057">Résidence principale — 9 ans</text>
<rect x="300" y="534" width="300" height="24" rx="4" fill="#e8f5e9" stroke="#DEE2E6"/>
<rect x="300" y="534" width="8" height="24" rx="4" fill="#2e7d32"/>
<text x="614" y="551" font-size="12" font-weight="700" fill="#2e7d32">un trente-sixième</text>
<text x="400" y="596" text-anchor="middle" font-size="11.5" fill="#868E96">Le préavis du preneur est lui aussi de trois mois.</text>
