<path d="M115.0 218 v11" stroke="#FFFFFF" stroke-width="1" opacity="0.75"/>
<path d="M124.0 218 v11" stroke="#FFFFFF" stroke-width="1" opacity="0.75"/>
<rect x="74" y="392" width="304" height="44" rx="6" fill="#e8f5e9" stroke="#DEE2E6" stroke-width="1"/>
<text x="226.0" y="411" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle">La commune désigne</text>
<text x="226.0" y="427" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle">sa propre carte</text>
<text x="226.0" y="458" font-size="10" fill="#6c757d" font-weight="400" text-anchor="middle">Aucune vérification réseau nécessaire</text>
<text x="422" y="122" font-size="10" fill="#6c757d" font-weight="700">CRITÈRE 2</text>
<text x="422" y="144" font-size="13.5" fill="#212529" font-weight="700">En aval du même poste de</text>
<text x="422" y="160" font-size="13.5" fill="#212529" font-weight="700">transformation à haute tension</text>
<text x="422" y="180" font-size="10" fill="#6c757d" font-weight="400">Apprécié au moment de la demande</text>
<text x="422" y="193" font-size="10" fill="#6c757d" font-weight="400">d'autorisation de partage</text>
