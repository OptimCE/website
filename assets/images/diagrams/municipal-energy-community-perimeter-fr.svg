<path d="M672.0 266 V288" stroke="#adb5bd" stroke-width="1.5" fill="none"/>
<rect x="623.0" y="288" width="98" height="28" rx="6" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
<text x="476.0" y="306" font-size="10.5" fill="#212529" font-weight="400" text-anchor="middle">Rue A</text>
<text x="574.0" y="306" font-size="10.5" fill="#212529" font-weight="400" text-anchor="middle">Rue B</text>
<text x="672.0" y="306" font-size="10.5" fill="#212529" font-weight="400" text-anchor="middle">Zoning</text>
<path d="M428.0 336 H720.0" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
<rect x="455.0" y="348" width="238" height="30" rx="6" fill="#F1F3F5" stroke="#adb5bd" stroke-width="1" stroke-dasharray="5 4"/>
<text x="574.0" y="367" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="middle">Même commune, autre poste → exclu</text>
<rect x="422" y="392" width="304" height="44" rx="6" fill="#F1F3F5" stroke="#DEE2E6" stroke-width="1"/>
<text x="574.0" y="411" font-size="12.5" fill="#495057" font-weight="700" text-anchor="middle">Vérification obligatoire</text>
<text x="574.0" y="427" font-size="12.5" fill="#495057" font-weight="700" text-anchor="middle">auprès du gestionnaire de réseau</text>
<text x="574.0" y="458" font-size="10" fill="#6c757d" font-weight="400" text-anchor="middle">Ne figure sur aucune carte publique</text>
<rect x="60" y="506" width="680" height="62" rx="8" fill="#e8f5e9"/>
<text x="400" y="530" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle">Les deux critères sont alternatifs : il suffit d'en satisfaire un seul.</text>
<text x="400" y="550" font-size="11" fill="#495057" font-weight="400" text-anchor="middle">La Wallonie est la seule des trois régions où le législateur a tracé lui-même le périmètre — par la limite communale.</text>
</g></svg>
