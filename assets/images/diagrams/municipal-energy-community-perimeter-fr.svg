<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Le périmètre d'une communauté d'énergie renouvelable en Wallonie</title><desc id="d">Comparaison des deux critères de proximité qui définissent le périmètre d'une communauté d'énergie renouvelable en Wallonie. À gauche, le premier critère : toutes les installations de production dont l'électricité est partagée et tous les participants au partage se situent sur le territoire d'une seule et même commune. Le schéma montre une limite communale à l'intérieur de laquelle figurent une école équipée de panneaux photovoltaïques, un hall sportif, un bâtiment du centre public d'action sociale, l'administration communale et des habitations privées. La commune n'a rien à démontrer : elle désigne sa propre carte, et la limite administrative fait office de périmètre légal, sans aucune vérification auprès du gestionnaire de réseau. À droite, le second critère : tous les points de raccordement des participants et des installations de production doivent se situer en aval du même poste de transformation à haute tension du gestionnaire de réseau de transport local, apprécié au moment de la demande d'autorisation. Le schéma représente un arbre électrique partant d'un poste à haute tension et se ramifiant vers trois groupes de points de raccordement, auxquels s'ajoute un quatrième groupe détaché, situé dans la même commune mais rattaché à un autre poste, et donc exclu. Ce second critère ne se lit sur aucune carte publique : il exige une vérification auprès du gestionnaire de réseau et peut couper une rue en deux. Une bande en bas du schéma rappelle que les deux critères sont alternatifs, qu'il suffit d'en satisfaire un seul, et que la Wallonie est la seule des trois régions belges où le législateur a lui-même tracé le périmètre plutôt que de laisser les membres le définir dans leurs statuts.</desc>
