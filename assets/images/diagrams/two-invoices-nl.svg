<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">Twee facturen naast elkaar</title><desc id="d">Twee kaarten naast elkaar: de factuur van de leverancier en die van de vertegenwoordiger van het delen, met hun inhoud.</desc>
<rect width="800" height="400" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="46" y="50" font-size="22" fill="#212529" font-weight="700" text-anchor="start">Twee facturen naast elkaar</text>
<text x="46" y="76" font-size="14" fill="#495057" font-weight="400" text-anchor="start">Bij energiedelen heeft elke stroom zijn eigen opsteller</text><rect x="46" y="104" width="336" height="230" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M46 114 a10 10 0 0 1 10 -10 h316 a10 10 0 0 1 10 10 v34 h-336 z" fill="#2e7d32"/><text x="62" y="133" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Factuur van de leverancier</text><text x="62" y="170" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Opgesteld door je energieleverancier</text><circle cx="66" cy="200" r="3" fill="#2e7d32"/><text x="80" y="205" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Restelektriciteit van het net</text><circle cx="66" cy="230" r="3" fill="#2e7d32"/><text x="80" y="235" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Nettarieven en taksen</text><circle cx="66" cy="260" r="3" fill="#2e7d32"/><text x="80" y="265" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Accijnzen en btw</text><rect x="414" y="104" width="336" height="230" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M414 114 a10 10 0 0 1 10 -10 h316 a10 10 0 0 1 10 10 v34 h-336 z" fill="#66bb6a"/><text x="430" y="133" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Factuur van het delen</text><text x="430" y="170" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Opgesteld door de vertegenwoordiger</text><circle cx="434" cy="200" r="3" fill="#66bb6a"/><text x="448" y="205" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Gedeelde kWh tegen interne prijs</text><circle cx="434" cy="230" r="3" fill="#66bb6a"/><text x="448" y="235" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Eventuele beheerskosten</text><circle cx="434" cy="260" r="3" fill="#66bb6a"/><text x="448" y="265" font-size="13.5" fill="#212529" font-weight="400" text-anchor="start">Verplichte wettelijke vermeldingen</text><text x="46" y="366" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Nettarieven en taksen blijven verschuldigd op gedeelde elektriciteit.</text><text x="46" y="388" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="start">Kaders van CWaPE, BRUGEL en VREG</text></g>
</svg>
