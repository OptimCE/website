 text-anchor="start">neutraal</text><circle cx="314" cy="283" r="3" fill="#66bb6a"/><text x="328" y="288" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Geen nabijheids-</text><text x="328" y="305" font-size="13" fill="#212529" font-weight="400" text-anchor="start">vereiste</text><circle cx="314" cy="333" r="3" fill="#66bb6a"/><text x="328" y="338" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Alleen elektriciteit</text><rect x="538" y="104" width="232" height="288" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/><path d="M538 114 a10 10 0 0 1 10 -10 h212 a10 10 0 0 1 10 10 v40 h-232 z" fill="#81c784"/><text x="654" y="136" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">CEL</text><text x="654" y="178" font-size="13" fill="#495057" font-weight="400" text-anchor="middle">Lokale energie-</text><text x="654" y="195" font-size="13" fill="#495057" font-weight="400" text-anchor="middle">gemeenschap</text><circle cx="560" cy="233" r="3" fill="#81c784"/><text x="574" y="238" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Brussels kader</text><circle cx="560" cy="266" r="3" fill="#81c784"/><text x="574" y="271" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Afgebakende lokale</text><text x="574" y="288" font-size="13" fill="#212529" font-weight="400" text-anchor="start">perimeter</text><circle cx="560" cy="316" r="3" fill="#81c784"/><text x="574" y="321" font-size="13" fill="#212529" font-weight="400" text-anchor="start">Toezicht door</text><text x="574" y="338" font-size="13" fill="#212529" font-weight="400" text-anchor="start">BRUGEL</text><text x="46" y="428" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="start">Richtlijnen (EU) 2018/2001 en (EU) 2019/944, per gewest omgezet</text></g>
