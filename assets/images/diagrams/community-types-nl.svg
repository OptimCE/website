<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">HEG, BEG en LEG</title><desc id="d">Vergelijking van de drie statuten van energiegemeenschappen — HEG, BEG en LEG — met hun vereisten inzake nabijheid en omvang.</desc>
<rect width="800" height="450" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="46" y="52" font-size="22" fill="#212529" font-weight="700" text-anchor="start">HEG, BEG en LEG</text>
