<title id="t">The school roof produces when the school is empty</title><desc id="d">Overlay, across a full year, of the photovoltaic output of a Walloon school roof and the periods when the school is actually occupied. The output curve forms a bell: very low in December and January, it rises from March, peaks from May to August, then falls back in October and November. The occupancy bands superimposed on that curve show the opposite: the school is closed for seven consecutive weeks in July and August, exactly at the top of the output curve, then for two weeks in October, two weeks at the end of December, two weeks in February or March and two weeks at the end of April or beginning of May, that is, in the troughs or on the flanks of the curve. To this are added weekends, which remove two days out of seven all year round, and Wednesday afternoons in primary education. The hatched area between the output curve and the occupancy bands represents electricity produced while the building consumes almost nothing: that is the volume energy sharing goes after, and it amounted to 64 % of annual output at the Saint-Augustin school in Forest and 83 % at the Nos Bambins school in Ganshoren in the two Brussels pilot projects of 2019. An inset recalls that the 2022 school rhythms reform moved two weeks of holiday from high summer to autumn and the carnival break, and that a summer day produces roughly three times what an autumn day produces: the shift therefore mechanically returned part of its own output to the school.</desc>
