<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d">
<title id="t">Vier wegen, vier delen van de factuur</title><desc id="d">Vergelijkend schema van de vier Belgische tariefwegen: het sociaal tarief werkt zowel op de energie als op het net maar hangt af van een statuut, het nachttarief werkt op het nettarief en verschilt per gewest, het dynamisch contract werkt uitsluitend op de energiecomponent en vereist een digitale meter, en de energiegemeenschap werkt op de energiecomponent van de gedeelde kilowattuur en komt bovenop beide contractformules.</desc>
<rect width="800" height="560" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="52" font-size="22" fill="#212529" font-weight="700">Vier wegen, vier delen van de factuur</text>
<text x="60" y="78" font-size="15" fill="#495057" font-weight="400">Op welke blokken van de factuur elke formule echt inwerkt</text>

<text x="299" y="116" font-size="12" fill="#ADB5BD" font-weight="600" text-anchor="middle">Energie 38,5 %</text>
<text x="422" y="116" font-size="12" fill="#ADB5BD" font-weight="600" text-anchor="middle">Net 29,7 %</text>
<text x="523" y="116" font-size="12" fill="#ADB5BD" font-weight="600" text-anchor="middle">Heffingen 26,1 %</text>
<text x="580" y="116" font-size="11" fill="#ADB5BD" font-weight="600" text-anchor="middle">Btw</text>

<text x="60" y="147" font-size="15" fill="#212529" font-weight="400">Sociaal tarief</text>
<rect x="230" y="128" width="136.6" height="28" rx="3" fill="#2e7d32"/>
<rect x="368.6" y="128" width="104.9" height="28" rx="3" fill="#2e7d32"/>
<rect x="475.5" y="128" width="92.0" height="28" rx="3" fill="#a5d6a7"/>
<rect x="569.5" y="128" width="20.5" height="28" rx="3" fill="#E9ECEF"/>
<text x="740" y="147" font-size="13" fill="#212529" font-weight="600" text-anchor="end">≈ 400 €/jaar</text>

<text x="60" y="205" font-size="15" fill="#212529" font-weight="400">Nachttarief</text>
<rect x="230" y="186" width="136.6" height="28" rx="3" fill="#a5d6a7"/>
<rect x="368.6" y="186" width="104.9" height="28" rx="3" fill="#2e7d32"/>
<rect x="475.5" y="186" width="92.0" height="28" rx="3" fill="#E9ECEF"/>
<rect x="569.5" y="186" width="20.5" height="28" rx="3" fill="#E9ECEF"/>
<text x="740" y="205" font-size="13" fill="#212529" font-weight="600" text-anchor="end">≈ 124 € per toestel</text>

<text x="60" y="263" font-size="15" fill="#212529" font-weight="400">Dynamisch contract</text>
<rect x="230" y="244" width="136.6" height="28" rx="3" fill="#2e7d32"/>
<rect x="368.6" y="244" width="104.9" height="28" rx="3" fill="#E9ECEF"/>
<rect x="475.5" y="244" width="92.0" height="28" rx="3" fill="#E9ECEF"/>
<rect x="569.5" y="244" width="20.5" height="28" rx="3" fill="#E9ECEF"/>
<text x="740" y="263" font-size="13" fill="#212529" font-weight="600" text-anchor="end">+ 62 € of − 15 %</text>

<text x="60" y="321" font-size="15" fill="#212529" font-weight="400">Energiegemeenschap</text>
<rect x="230" y="302" width="136.6" height="28" rx="3" fill="#a5d6a7"/>
<rect x="368.6" y="302" width="104.9" height="28" rx="3" fill="#E9ECEF"/>
<rect x="475.5" y="302" width="92.0" height="28" rx="3" fill="#E9ECEF"/>
<rect x="569.5" y="302" width="20.5" height="28" rx="3" fill="#E9ECEF"/>
<text x="740" y="321" font-size="13" fill="#212529" font-weight="600" text-anchor="end">≈ 145 € / 500 kWh</text>

<line x1="60" y1="352" x2="740" y2="352" stroke="#DEE2E6" stroke-width="1"/>
<rect x="60" y="368" width="14" height="14" rx="3" fill="#2e7d32" stroke="#DEE2E6"/>
<text x="82" y="380" font-size="14" fill="#212529" font-weight="400">Werkt op dit blok</text>
<rect x="240" y="368" width="14" height="14" rx="3" fill="#a5d6a7" stroke="#DEE2E6"/>
<text x="262" y="380" font-size="14" fill="#212529" font-weight="400">Werkt gedeeltelijk</text>
<rect x="430" y="368" width="14" height="14" rx="3" fill="#E9ECEF" stroke="#DEE2E6"/>
<text x="452" y="380" font-size="14" fill="#212529" font-weight="400">Geen effect</text>

<rect x="60" y="404" width="680" height="64" rx="6" fill="#e8f5e9"/>
<text x="80" y="430" font-size="14" fill="#1b5e20" font-weight="600">De energiegemeenschap is de enige weg die bij de andere optelt:</text>
<text x="80" y="452" font-size="14" fill="#212529" font-weight="400">geen leverancierswissel, geen werken, geen inkomens- of flexibiliteitsvoorwaarde.</text>

<text x="60" y="536" font-size="12" fill="#ADB5BD" font-weight="400">Factuuraandelen: CREG-maandrapport juni 2026 (3 500 kWh/jaar, enkelvoudig tarief) — cumulvoorwaarden: CWaPE</text>
</g>
</svg>
