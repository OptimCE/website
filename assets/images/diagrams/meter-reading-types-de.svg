<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Was Sie am Zähler notieren</title><desc id="d">Schema von fünf Zählern und was zu notieren ist. Eintarifzähler: ein Zählwerk, notiert wird 25003 ohne Nachkommastelle. Zweitarifzähler: zwei Stände, Hochlast (Sonne, I) 52002 und Schwachlast (Mond, II) 25003; Schwachlast von 11 bis 17 Uhr und von 22 bis 7 Uhr. Nachtstromzähler: ein eigener Zähler, ein Stand, zu den Zeiten des Netzbetreibers. Elektronischer Zähler: ein Bildschirm, auf dem die Register alle 7 bis 8 Sekunden wechseln, 1.8.1 Hochlast, 1.8.2 Schwachlast, 2.8.1 und 2.8.2 Einspeisung. Smart Meter: täglich aus der Ferne abgelesen, nichts zu melden, außer auf Anfrage des Netzbetreibers.</desc>
