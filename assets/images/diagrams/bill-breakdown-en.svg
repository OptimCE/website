<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">What you actually pay for</title><desc id="d">Stacked bar chart: energy is 38.5% of the bill, network costs 29.7%, taxes 26.1% and VAT 5.7%.</desc>
<rect width="800" height="450" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="52" font-size="22" fill="#212529" font-weight="700" text-anchor="start">What you actually pay for</text>
<text x="60" y="78" font-size="14" fill="#495057" font-weight="400" text-anchor="start">Breakdown of a residential electricity bill in Belgium</text>
<rect x="60.0" y="130" width="261.8" height="74" fill="#2e7d32" rx="6" stroke="#FFFFFF" stroke-width="2"/><text x="190.9" y="175" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">38.5 %</text><rect x="321.8" y="130" width="202.0" height="74" fill="#66bb6a"  stroke="#FFFFFF" stroke-width="2"/><text x="422.78" y="175" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">29.7 %</text><rect x="523.8" y="130" width="177.5" height="74" fill="#a5d6a7"  stroke="#FFFFFF" stroke-width="2"/><text x="612.5" y="175" font-size="19" fill="#212529" font-weight="700" text-anchor="middle">26.1 %</text><rect x="701.2" y="130" width="38.8" height="74" fill="#e8f5e9" rx="6" stroke="#FFFFFF" stroke-width="2"/>
<line x1="60" y1="216" x2="321.8" y2="216" stroke="#2e7d32" stroke-width="3"/>
<text x="60" y="238" font-size="13" fill="#495057" font-weight="400" text-anchor="start">Only this share is genuinely competitive</text>
<rect x="60" y="271" width="18" height="18" rx="4" fill="#2e7d32" stroke="#DEE2E6"/><text x="90" y="286" font-size="16" fill="#212529" font-weight="400" text-anchor="start">Energy</text><text x="740" y="286" font-size="16" fill="#212529" font-weight="600" text-anchor="end">38.5 %</text><rect x="60" y="305" width="18" height="18" rx="4" fill="#66bb6a" stroke="#DEE2E6"/><text x="90" y="320" font-size="16" fill="#212529" font-weight="400" text-anchor="start">Network costs</text><text x="740" y="320" font-size="16" fill="#212529" font-weight="600" text-anchor="end">29.7 %</text><rect x="60" y="339" width="18" height="18" rx="4" fill="#a5d6a7" stroke="#DEE2E6"/><text x="90" y="354" font-size="16" fill="#212529" font-weight="400" text-anchor="start">Taxes, excise and levies</text><text x="740" y="354" font-size="16" fill="#212529" font-weight="600" text-anchor="end">26.1 %</text><rect x="60" y="373" width="18" height="18" rx="4" fill="#e8f5e9" stroke="#DEE2E6"/><text x="90" y="388" font-size="16" fill="#212529" font-weight="400" text-anchor="start">VAT</text><text x="740" y="388" font-size="16" fill="#212529" font-weight="600" text-anchor="end">5.7 %</text>
<text x="60" y="434" font-size="12" fill="#ADB5BD" font-weight="400" text-anchor="start">Source: CREG dashboard, June 2026 — 3,500 kWh/year single-rate profile</text></g>
</svg>
