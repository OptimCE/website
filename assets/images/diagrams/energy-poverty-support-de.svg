<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Welche Hilfe deckt welchen Heizträger in Wallonien?</title><desc id="d">Tabelle der sechs wichtigsten Energiehilfen in Wallonien — Sozialtarif, Sozialer Heizfonds, MEBAR-Prämie, Gas-Strom-Fonds, Energietutor und garantierte Mindestversorgung — abgeglichen mit den drei Heizträgern. Die Spalte Heizöl ist überwiegend ungedeckt, obwohl 37,5 % der wallonischen Haushalte mit diesem Brennstoff heizen, in Brüssel dagegen nur 7,5 %.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="52" font-size="22" fill="#212529" font-weight="700">Das soziale Energienetz in Wallonien</text>
<text x="60" y="78" font-size="15" fill="#495057" font-weight="400">Sechs Instrumente — und ein Heizträger, den kein Sozialtarif deckt</text>

<text x="250" y="114" font-size="13" fill="#495057" font-weight="700">Betrag / Reichweite</text>
<text x="499" y="114" font-size="13" fill="#495057" font-weight="700" text-anchor="middle">Strom</text>
<text x="595" y="114" font-size="13" fill="#495057" font-weight="700" text-anchor="middle">Gas</text>
<text x="694" y="114" font-size="13" fill="#495057" font-weight="700" text-anchor="middle">Heizöl</text>

<text x="60" y="155" font-size="14" fill="#212529" font-weight="400">Sozialtarif</text>
<text x="250" y="155" font-size="13" fill="#212529" font-weight="600">≈ 400 €/Jahr</text>
<rect x="455" y="132" width="88" height="36" rx="4" fill="#2e7d32"/>
<text x="499" y="155" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">ja</text>
