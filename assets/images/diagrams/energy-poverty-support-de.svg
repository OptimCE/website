<rect x="60" y="488" width="680" height="64" rx="6" fill="#e8f5e9"/>
<text x="80" y="514" font-size="14" fill="#1b5e20" font-weight="600">37,5 % der wallonischen Haushalte heizen mit Heizöl, in Brüssel nur 7,5 %.</text>
<text x="80" y="536" font-size="14" fill="#212529" font-weight="400">Der einzige Heizträger ohne Sozialtarif — der Heizfonds deckelt bei 300 €/Jahr.</text>

<text x="60" y="592" font-size="12" fill="#ADB5BD" font-weight="400">Barometer der Energiearmut 2024 (KBS) — SPW Énergie — Sozialer Heizfonds — Stand 8. August 2026</text>
