<text x="595" y="155" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">ja</text>
<rect x="647" y="132" width="93" height="36" rx="4" fill="#E9ECEF"/>
<text x="694" y="155" font-size="13" fill="#495057" font-weight="600" text-anchor="middle">nein</text>

<text x="60" y="207" font-size="14" fill="#212529" font-weight="400">Sozialer Heizfonds</text>
