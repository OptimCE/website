<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Het Impact-tarief volgt de zon</title><desc id="d">Een strook van 24 uur met de drie tijdvakken van het Impact-tarief, alle dagen van de week gelijk: ECO van 1 tot 7 uur en van 11 tot 17 uur, MEDIUM van 7 tot 11 uur en van 22 tot 1 uur, PIC van 17 tot 22 uur, met de distributietarieven van ORES 2026 van 2,71, 8,13 en 13,54 cent per kilowattuur exclusief btw. Boven de strook twee uurcurves, berekend over 2023 voor een zonnedak in Namen: de zonneproductie, waarvan 70 procent in het ECO-tijdvak valt, 20 procent in MEDIUM en 10 procent in PIC, en de elektriciteit die tussen twaalf gezinnen gedeeld wordt, waarvan 59 procent in ECO valt, 24 procent in MEDIUM en 17 procent in PIC.</desc>
