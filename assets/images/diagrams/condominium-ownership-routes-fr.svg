<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="t d">
<title id="t">Trois routes pour posséder les panneaux d'une copropriété</title><desc id="d">Comparaison des trois montages de propriété possibles pour une installation photovoltaïque sur la toiture commune d'une copropriété belge en 2026. Dans la première route, les copropriétaires financent l'installation qui devient une partie commune détenue en indivision forcée : la décision se prend à la majorité des deux tiers en assemblée générale, le point d'injection est le compteur des communs, le syndic facture au nom de la copropriété, et c'est la copropriété qui s'assujettit à la TVA au-delà de dix kilovoltampères. Dans la deuxième route, une ASBL ou une coopérative détient l'installation sur un droit de superficie consenti par la copropriété : la décision exige quatre cinquièmes des voix, la personne morale est titulaire du point d'injection, facture elle-même et porte l'assujettissement. Dans la troisième route, un tiers investisseur détient l'installation sur droit de superficie, également à quatre cinquièmes des voix : la copropriété n'avance aucun capital mais ne perçoit qu'une redevance ou une part de recette, et la valeur créée sort de l'immeuble. Une bande en bas du schéma rappelle que l'association des copropriétaires elle-même n'est propriétaire dans aucune des trois routes, parce que l'article 3.86, paragraphe 3, du Code civil limite son patrimoine aux meubles nécessaires à la conservation et à l'administration de l'immeuble.</desc>
<rect width="800" height="620" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="44" font-size="21" fill="#212529" font-weight="700">Trois routes pour posséder les panneaux d'une copropriété</text>
<text x="60" y="70" font-size="13" fill="#495057" font-weight="400">Ce que chaque montage impose : majorité en assemblée générale, propriété, facturation et TVA</text>
<rect x="60" y="96" width="218" height="404" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
<path d="M68 99 h202" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" fill="none"/>
<text x="74" y="122" font-size="10" fill="#6c757d" font-weight="700">ROUTE 1</text>
<text x="74" y="144" font-size="13.5" fill="#212529" font-weight="700">L'indivision des</text>
<text x="74" y="160" font-size="13.5" fill="#212529" font-weight="700">copropriétaires</text>
<text x="74" y="182" font-size="10" fill="#6c757d" font-weight="400">La copropriété finance et</text>
<text x="74" y="195" font-size="10" fill="#6c757d" font-weight="400">possède — sans acte notarié</text>
<rect x="74" y="204" width="190" height="42" rx="6" fill="#e8f5e9" stroke="#DEE2E6" stroke-width="1"/>
<text x="169.0" y="226" font-size="15" fill="#1b5e20" font-weight="700" text-anchor="middle">2/3 des voix</text>
<text x="169.0" y="240" font-size="9" fill="#6c757d" font-weight="400" text-anchor="middle">art. 3.88, § 1er, 1°, b</text>
<text x="74" y="272" font-size="9" fill="#6c757d" font-weight="700">PROPRIÉTAIRE DE L'INSTALLATION</text>
<text x="74" y="285" font-size="10.5" fill="#212529" font-weight="400">Les copropriétaires</text>
<text x="74" y="297" font-size="10.5" fill="#212529" font-weight="400">en indivision forcée</text>
<text x="74" y="310" font-size="9" fill="#6c757d" font-weight="700">POINT D'INJECTION</text>
<text x="74" y="323" font-size="10.5" fill="#212529" font-weight="400">Le compteur des communs</text>
<text x="74" y="348" font-size="9" fill="#6c757d" font-weight="700">QUI FACTURE LE PARTAGE</text>
<text x="74" y="361" font-size="10.5" fill="#212529" font-weight="400">Le syndic, pour la</text>
<text x="74" y="373" font-size="10.5" fill="#212529" font-weight="400">copropriété</text>
<text x="74" y="386" font-size="9" fill="#6c757d" font-weight="700">ASSUJETTISSEMENT TVA &gt; 10 kVA</text>
<text x="74" y="399" font-size="10.5" fill="#212529" font-weight="400">La copropriété</text>
<text x="74" y="424" font-size="9" fill="#6c757d" font-weight="700">CAPITAL À MOBILISER</text>
<text x="74" y="437" font-size="10.5" fill="#212529" font-weight="400">Intégral</text>
<text x="74" y="462" font-size="9" fill="#6c757d" font-weight="700">OÙ VA LA VALEUR</text>
<text x="74" y="475" font-size="10.5" fill="#212529" font-weight="400">Aux copropriétaires,</text>
<text x="74" y="487" font-size="10.5" fill="#212529" font-weight="400">via les charges</text>
<rect x="291" y="96" width="218" height="404" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
<text x="305" y="122" font-size="10" fill="#6c757d" font-weight="700">ROUTE 2</text>
<text x="305" y="144" font-size="13.5" fill="#212529" font-weight="700">L'ASBL ou la</text>
<text x="305" y="160" font-size="13.5" fill="#212529" font-weight="700">coopérative</text>
<text x="305" y="182" font-size="10" fill="#6c757d" font-weight="400">Droit de superficie —</text>
<text x="305" y="195" font-size="10" fill="#6c757d" font-weight="400">acte notarié requis</text>
<rect x="305" y="204" width="190" height="42" rx="6" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
<text x="400.0" y="226" font-size="15" fill="#495057" font-weight="700" text-anchor="middle">4/5 des voix</text>
<text x="400.0" y="240" font-size="9" fill="#6c757d" font-weight="400" text-anchor="middle">art. 3.88, § 1er, 2°, e</text>
<text x="305" y="272" font-size="9" fill="#6c757d" font-weight="700">PROPRIÉTAIRE DE L'INSTALLATION</text>
<text x="305" y="285" font-size="10.5" fill="#212529" font-weight="400">L'ASBL ou la coopérative</text>
<text x="305" y="310" font-size="9" fill="#6c757d" font-weight="700">POINT D'INJECTION</text>
<text x="305" y="323" font-size="10.5" fill="#212529" font-weight="400">La personne morale</text>
<text x="305" y="348" font-size="9" fill="#6c757d" font-weight="700">QUI FACTURE LE PARTAGE</text>
<text x="305" y="361" font-size="10.5" fill="#212529" font-weight="400">La personne morale</text>
<text x="305" y="386" font-size="9" fill="#6c757d" font-weight="700">ASSUJETTISSEMENT TVA &gt; 10 kVA</text>
<text x="305" y="399" font-size="10.5" fill="#212529" font-weight="400">La personne morale</text>
<text x="305" y="424" font-size="9" fill="#6c757d" font-weight="700">CAPITAL À MOBILISER</text>
<text x="305" y="437" font-size="10.5" fill="#212529" font-weight="400">Intégral, hors patrimoine</text>
<text x="305" y="449" font-size="10.5" fill="#212529" font-weight="400">de l'association</text>
<text x="305" y="462" font-size="9" fill="#6c757d" font-weight="700">OÙ VA LA VALEUR</text>
<text x="305" y="475" font-size="10.5" fill="#212529" font-weight="400">Aux sociétaires</text>
<rect x="522" y="96" width="218" height="404" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
<text x="536" y="122" font-size="10" fill="#6c757d" font-weight="700">ROUTE 3</text>
<text x="536" y="144" font-size="13.5" fill="#212529" font-weight="700">Le tiers</text>
<text x="536" y="160" font-size="13.5" fill="#212529" font-weight="700">investisseur</text>
<text x="536" y="182" font-size="10" fill="#6c757d" font-weight="400">Droit de superficie —</text>
<text x="536" y="195" font-size="10" fill="#6c757d" font-weight="400">acte notarié requis</text>
<rect x="536" y="204" width="190" height="42" rx="6" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
<text x="631.0" y="226" font-size="15" fill="#495057" font-weight="700" text-anchor="middle">4/5 des voix</text>
<text x="631.0" y="240" font-size="9" fill="#6c757d" font-weight="400" text-anchor="middle">art. 3.88, § 1er, 2°, e</text>
<text x="536" y="272" font-size="9" fill="#6c757d" font-weight="700">PROPRIÉTAIRE DE L'INSTALLATION</text>
<text x="536" y="285" font-size="10.5" fill="#212529" font-weight="400">Le tiers investisseur</text>
<text x="536" y="310" font-size="9" fill="#6c757d" font-weight="700">POINT D'INJECTION</text>
<text x="536" y="323" font-size="10.5" fill="#212529" font-weight="400">L'investisseur, ou la</text>
<text x="536" y="335" font-size="10.5" fill="#212529" font-weight="400">copropriété selon contrat</text>
<text x="536" y="348" font-size="9" fill="#6c757d" font-weight="700">QUI FACTURE LE PARTAGE</text>
<text x="536" y="361" font-size="10.5" fill="#212529" font-weight="400">L'investisseur ou son</text>
<text x="536" y="373" font-size="10.5" fill="#212529" font-weight="400">mandataire</text>
<text x="536" y="386" font-size="9" fill="#6c757d" font-weight="700">ASSUJETTISSEMENT TVA &gt; 10 kVA</text>
<text x="536" y="399" font-size="10.5" fill="#212529" font-weight="400">L'investisseur</text>
<text x="536" y="424" font-size="9" fill="#6c757d" font-weight="700">CAPITAL À MOBILISER</text>
<text x="536" y="437" font-size="10.5" fill="#212529" font-weight="400">Nul</text>
<text x="536" y="462" font-size="9" fill="#6c757d" font-weight="700">OÙ VA LA VALEUR</text>
<text x="536" y="475" font-size="10.5" fill="#212529" font-weight="400">À l'investisseur,</text>
<text x="536" y="487" font-size="10.5" fill="#212529" font-weight="400">hors redevance</text>
<rect x="60" y="516" width="680" height="76" rx="8" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
<path d="M63 528 v52" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" fill="none"/>
<text x="80" y="540" font-size="11.5" fill="#212529" font-weight="700">Dans les trois routes, l'association des copropriétaires n'est jamais propriétaire.</text>
<text x="80" y="559" font-size="10" fill="#495057" font-weight="400">Article 3.86, § 3, du Code civil : son patrimoine se limite aux meubles nécessaires à l'administration de l'immeuble.</text>
<text x="80" y="574" font-size="10" fill="#495057" font-weight="400">Des panneaux fixés en toiture deviennent immeubles par incorporation — il faut donc désigner un propriétaire ailleurs.</text>
</g></svg>
