<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
<title id="t">Der Perimeter einer Erneuerbare-Energie-Gemeinschaft in Wallonien</title><desc id="d">Vergleich der beiden Nähekriterien, die den Perimeter einer Erneuerbare-Energie-Gemeinschaft in Wallonien bestimmen. Links das erste Kriterium: sämtliche Erzeugungsanlagen, deren Strom geteilt wird, und sämtliche Teilnehmer der Teilung liegen im Gebiet einer einzigen und derselben Gemeinde. Die Grafik zeigt eine Gemeindegrenze, innerhalb derer eine mit Photovoltaikmodulen ausgestattete Schule, eine Sporthalle, ein Gebäude des Sozialamts, die Gemeindeverwaltung und private Wohnhäuser liegen. Die Gemeinde muss nichts nachweisen: sie zeigt auf ihre eigene Karte, und die Verwaltungsgrenze dient als rechtlicher Perimeter, ohne jede Prüfung beim Netzbetreiber. Rechts das zweite Kriterium: alle Anschlusspunkte der Teilnehmer und der Erzeugungsanlagen müssen unterhalb desselben Hochspannungs-Umspannwerks des lokalen Übertragungsnetzbetreibers liegen, maßgeblich zum Zeitpunkt des Genehmigungsantrags. Die Grafik zeigt einen elektrischen Baum, der von einem Hochspannungs-Umspannwerk ausgeht und sich zu drei Gruppen von Anschlusspunkten verzweigt, hinzu kommt eine vierte, abgesetzte Gruppe, die in derselben Gemeinde liegt, aber an ein anderes Umspannwerk angeschlossen und deshalb ausgeschlossen ist. Dieses zweite Kriterium steht auf keiner öffentlichen Karte: es verlangt eine Prüfung beim Netzbetreiber und kann eine Straße in zwei Teile schneiden. Ein Band am unteren Rand der Grafik erinnert daran, dass die beiden Kriterien alternativ sind, dass eines davon genügt, und dass Wallonien die einzige der drei belgischen Regionen ist, in der der Gesetzgeber den Perimeter selbst gezogen hat, statt ihn die Mitglieder in ihrer Satzung festlegen zu lassen.</desc>
