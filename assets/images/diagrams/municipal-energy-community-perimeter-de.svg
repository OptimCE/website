<text x="574.0" y="367" font-size="10.5" fill="#6c757d" font-weight="400" text-anchor="middle">Gleiche Gemeinde, anderes Werk → raus</text>
<rect x="422" y="392" width="304" height="44" rx="6" fill="#F1F3F5" stroke="#DEE2E6" stroke-width="1"/>
<text x="574.0" y="411" font-size="12.5" fill="#495057" font-weight="700" text-anchor="middle">Prüfung beim</text>
<text x="574.0" y="427" font-size="12.5" fill="#495057" font-weight="700" text-anchor="middle">Netzbetreiber zwingend</text>
<text x="574.0" y="458" font-size="10" fill="#6c757d" font-weight="400" text-anchor="middle">Auf keiner öffentlichen Karte</text>
<rect x="60" y="506" width="680" height="62" rx="8" fill="#e8f5e9"/>
<text x="400" y="530" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle">Die beiden Kriterien sind alternativ: eines davon genügt.</text>
<text x="400" y="550" font-size="11" fill="#495057" font-weight="400" text-anchor="middle">Wallonien ist die einzige der drei Regionen, in der der Gesetzgeber den Perimeter selbst gezogen hat — entlang der Gemeindegrenze.</text>
