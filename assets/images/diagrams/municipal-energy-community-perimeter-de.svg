<text x="226.0" y="411" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle">Die Gemeinde zeigt auf</text>
<text x="226.0" y="427" font-size="12.5" fill="#1b5e20" font-weight="700" text-anchor="middle">ihre eigene Karte</text>
<text x="226.0" y="458" font-size="10" fill="#6c757d" font-weight="400" text-anchor="middle">Keine Netzprüfung erforderlich</text>
<text x="422" y="122" font-size="10" fill="#6c757d" font-weight="700">KRITERIUM 2</text>
<text x="422" y="144" font-size="13.5" fill="#212529" font-weight="700">Unterhalb desselben</text>
<text x="422" y="160" font-size="13.5" fill="#212529" font-weight="700">Hochspannungs-Umspannwerks</text>
<text x="422" y="180" font-size="10" fill="#6c757d" font-weight="400">Maßgeblich ist der Zeitpunkt des</text>
<text x="422" y="193" font-size="10" fill="#6c757d" font-weight="400">Antrags auf Teilungsgenehmigung</text>
